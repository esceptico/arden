<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Desk &amp; Paper — Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap"
      rel="stylesheet"
    />
    <script src="./board-icons.js?v=20260719-2"></script>
    <script src="./board-motion.js?v=20260722-42"></script>
    <link rel="stylesheet" href="./board-system.css?v=20260722-32" />
    <style>
      @property --fill-x {
        syntax: "<length>";
        inherits: true;
        initial-value: 0px;
      }
      @property --marker-x {
        syntax: "<length>";
        inherits: true;
        initial-value: 0px;
      }
      html,
      body {
        overflow: hidden;
      }

      /* native chrome and desk */
      .traffic {
        z-index: var(--z-shell);
      }
      .sidebar-toggle {
        z-index: var(--z-shell);
      }
      .rail {
        z-index: var(--z-sticky);
        padding: 48px 10px 12px;
        display: flex;
        flex-direction: column;
      }
      .rail-resizer {
        z-index: var(--z-shell);
        top: 50px;
        bottom: 12px;
      }
      .rail-title .dp-kbd-group {
        margin-left: auto;
      }
      .nav-meta {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        font: 500 var(--text-meta)/1 var(--mono);
        color: var(--faint);
      }
      body.nav-hidden .workspace {
        padding-left: 0;
      }

      /* paper room */
      .workspace {
        position: absolute;
        inset: 0;
        padding-left: calc(var(--sidebar-width) + var(--sidebar-gap));
        overflow: auto;
        overscroll-behavior: contain;
        transition: opacity var(--motion-feedback) var(--ease-out);
        scrollbar-width: none;
      }
      .workspace::-webkit-scrollbar {
        display: none;
      }
      .page {
        width: 100%;
        max-width: var(--content-max-width);
        min-height: 100%;
        margin: 0 auto;
        padding: 102px var(--content-gutter) 116px;
      }
      .page-plane {
        opacity: 1;
        transform: none;
        filter: none;
      }
      .page-plane.swapping {
        pointer-events: none;
      }
      .page-head {
        max-width: 620px;
      }
      .page-head-wide {
        max-width: none;
      }
      .crumb {
        font: 500 var(--text-meta)/1 var(--mono);
        letter-spacing: 0.075em;
        color: var(--faint);
        margin-bottom: 13px;
      }
      .crumb strong {
        color: var(--muted);
        font-weight: 500;
      }
      .page-title-row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: var(--space-2-5);
      }
      .page-title-row .header-action {
        margin-left: auto;
      }
      .page-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      h1 {
        margin: 0;
        font-size: var(--text-display);
        line-height: 1.2;
        font-weight: 620;
        letter-spacing: -0.025em;
      }
      .page-intro {
        max-width: 580px;
        margin: 9px 0 0;
        font-size: var(--text-body);
        line-height: 1.55;
        color: var(--muted);
      }
      /* content grammar */
      .summary {
        margin-top: 24px;
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) repeat(2, minmax(92px, 0.55fr));
        min-height: 70px;
        background: var(--panel);
        border-radius: var(--surface-radius);
        box-shadow: var(--e2);
        overflow: hidden;
      }
      .summary-main,
      .summary-stat {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 13px 15px;
      }
      .summary-stat {
        border-left: var(--border-width) solid var(--line);
      }
      .summary-label {
        font-weight: 600;
        letter-spacing: -0.006em;
      }
      .summary-copy {
        margin-top: 3px;
        font-size: var(--text-control);
        line-height: 1.45;
        color: var(--muted);
      }
      .summary-value {
        font: 500 15px/1.2 var(--mono);
        color: var(--ink);
      }
      .summary-value.ok {
        color: var(--ok);
      }
      .summary-meta {
        margin-top: 4px;
        font: 500 var(--text-meta)/1.2 var(--mono);
        color: var(--faint);
      }
      .section {
        margin-top: 30px;
      }
      .section-search {
        margin-top: 24px;
      }
      .section-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .section-actions-spacious {
        margin-top: 18px;
      }
      .control-wide {
        min-width: 300px;
      }
      .section-head {
        min-height: 24px;
        display: flex;
        align-items: baseline;
        gap: var(--space-3);
        padding: 0 2px 8px;
      }
      .section-head h2 {
        margin: 0;
        font-size: var(--text-body);
        font-weight: 620;
        letter-spacing: -0.006em;
      }
      .section-meta {
        margin-left: auto;
        font: 500 var(--text-meta)/1 var(--mono);
        color: var(--faint);
      }
      .section-action {
        margin-left: auto;
        height: 26px;
        padding: 0 10px;
        border-radius: var(--r-control);
        background: var(--panel);
        box-shadow: var(--e2);
        font-size: var(--text-control);
        font-weight: 500;
        transition: transform var(--motion-press) var(--ease-out);
      }
      .surface {
        background: var(--panel);
        border-radius: var(--surface-radius);
        box-shadow: var(--e2);
        overflow: hidden;
      }
      .row {
        min-height: 68px;
        display: grid;
        grid-template-columns: minmax(150px, 0.95fr) minmax(190px, 1.35fr) auto;
        align-items: center;
        gap: var(--space-5);
        padding: 12px 14px;
        transition: background var(--motion-feedback) var(--ease-out);
      }
      .row + .row {
        border-top: var(--border-width) solid
          color-mix(in oklab, var(--line) 72%, transparent);
      }
      .row:hover {
        background: color-mix(in oklab, var(--ink) 2%, var(--panel));
      }
      .row-main {
        min-width: 0;
      }
      .row-title {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font-weight: 590;
        color: var(--ink);
      }
      .brand-mark {
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        border-radius: var(--r-tag);
        background: var(--paper);
        box-shadow: inset 0 0 0 1px var(--line);
        font: 600 10px/1 var(--mono);
        color: var(--ink-soft);
      }
      .row-sub {
        margin-top: 4px;
        font: 500 var(--text-meta)/1.35 var(--mono);
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-copy {
        min-width: 0;
        font-size: var(--text-control);
        line-height: 1.45;
        color: var(--muted);
      }
      .row-copy b {
        display: block;
        color: var(--ink-soft);
        font-weight: 520;
        margin-bottom: 2px;
      }
      .row-end {
        min-width: 104px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: var(--space-2);
      }
      .integration-item + .integration-item {
        border-top: var(--border-width) solid
          color-mix(in oklab, var(--line) 72%, transparent);
      }
      .integration-row {
        min-height: 72px;
        display: grid;
        grid-template-columns: minmax(180px, 1.15fr) minmax(
            130px,
            0.7fr
          ) 148px 34px 30px;
        align-items: center;
        column-gap: var(--space-3);
        padding: 12px 14px;
        transition: background var(--motion-feedback) var(--ease-out);
      }
      .integration-row:hover,
      .integration-item.expanded > .integration-row {
        background: color-mix(in oklab, var(--ink) 2%, var(--panel));
      }
      .integration-state {
        min-width: 0;
        font-size: var(--text-control);
        line-height: 1.4;
        color: var(--muted);
      }
      .integration-state b {
        display: block;
        color: var(--ink-soft);
        font-weight: 560;
      }
      .integration-action {
        width: 148px;
        justify-self: end;
      }
      .integration-row > .dp-switch {
        justify-self: center;
      }
      .integration-disclosure {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: var(--r-circle);
        color: var(--faint);
        transition:
          background var(--motion-feedback) var(--ease-out),
          color var(--motion-feedback) var(--ease-out),
          transform var(--motion-press) var(--ease-out);
      }
      .integration-disclosure:hover {
        background: var(--panel-soft);
        color: var(--ink);
      }
      .integration-disclosure svg {
        width: var(--icon-size);
        height: var(--icon-size);
        transition: transform var(--motion-tab-shift) var(--ease-out);
      }
      .integration-item.expanded .integration-disclosure svg {
        transform: rotate(180deg);
      }
      .integration-panel {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        border-top: var(--border-width) solid transparent;
        transition:
          grid-template-rows var(--motion-content) var(--ease-out),
          opacity var(--motion-feedback) var(--ease-out),
          border-color var(--motion-feedback) var(--ease-out);
      }
      .integration-item.expanded .integration-panel {
        grid-template-rows: 1fr;
        opacity: 1;
        border-top-color: color-mix(in oklab, var(--line) 72%, transparent);
      }
      .integration-panel-clip {
        min-height: 0;
        overflow: hidden;
      }
      .integration-detail {
        margin: 12px 14px 14px;
        padding: 4px 12px;
        border-radius: var(--r-house);
        background: var(--paper);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .integration-detail-row {
        min-height: 44px;
        display: grid;
        grid-template-columns: minmax(160px, 1fr) minmax(150px, 0.9fr) auto;
        align-items: center;
        gap: var(--space-3);
      }
      .integration-detail-row + .integration-detail-row {
        border-top: var(--border-width) solid var(--line);
      }
      .integration-detail-main {
        min-width: 0;
        font-size: var(--text-control);
        font-weight: 550;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .integration-detail-meta {
        font: 500 var(--text-meta)/1.35 var(--mono);
        color: var(--faint);
      }
      .integration-detail-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--space-2);
      }
      .integration-detail-footer {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: var(--border-width) solid var(--line);
        color: var(--faint);
        font: 500 var(--text-meta)/1.35 var(--mono);
      }
      .section-meta.actions {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .mcp-list .row {
        grid-template-columns: minmax(170px, 0.95fr) minmax(260px, 1.35fr) 184px;
      }
      .mcp-list .row-copy {
        text-align: left;
      }
      .mcp-list .row-end {
        width: 184px;
      }
      .refresh-slot {
        width: var(--refresh-control-width);
        height: var(--control-size-large);
        margin-left: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        contain: layout;
      }
      .refresh-action {
        position: relative;
        isolation: isolate;
        width: var(--refresh-control-width);
        display: grid;
        place-items: center;
        overflow: visible;
      }
      .refresh-content {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-1-5);
        pointer-events: none;
      }
      .refresh-glyph {
        width: var(--icon-size);
        height: var(--icon-size);
        flex: none;
        transition: transform var(--motion-refresh-morph) var(--ease-drawer);
      }
      .refresh-glyph svg {
        width: var(--icon-size);
        height: var(--icon-size);
      }
      .refresh-label-slot {
        display: block;
        opacity: 1;
        filter: blur(0);
        transform: none;
        transition:
          opacity var(--motion-feedback) var(--ease-out),
          filter var(--motion-feedback) var(--ease-out),
          transform var(--motion-refresh-morph) var(--ease-drawer);
      }
      .refresh-label {
        display: block;
      }
      .refresh-action.is-refreshing .refresh-glyph {
        transform: translateX(var(--refresh-spin-shift));
      }
      .refresh-action.is-refreshing .refresh-label-slot {
        opacity: 0;
        filter: blur(var(--refresh-label-blur));
        transform: translateX(var(--refresh-label-shift));
      }
      .refresh-action.is-done .refresh-label-slot {
        opacity: 1;
        filter: blur(0);
      }
      .refresh-action:disabled {
        color: var(--ink);
        cursor: default;
      }
      .scope-note {
        margin-top: 10px;
        padding: 0 2px;
        font: 500 var(--text-meta)/1.5 var(--mono);
        color: var(--faint);
      }
      .integration-panel {
        visibility: hidden;
        transition:
          grid-template-rows var(--motion-content) var(--ease-out),
          opacity var(--motion-feedback) var(--ease-out),
          border-color var(--motion-feedback) var(--ease-out),
          visibility 0s var(--motion-content);
      }
      .integration-item.expanded .integration-panel {
        visibility: visible;
        transition-delay: 0s;
      }
      .setting-row {
        min-height: 76px;
        display: grid;
        grid-template-columns: minmax(210px, 1fr) minmax(230px, auto);
        align-items: center;
        gap: var(--space-5);
        padding: 13px 15px;
      }
      .setting-row + .setting-row {
        border-top: var(--border-width) solid
          color-mix(in oklab, var(--line) 72%, transparent);
      }
      .setting-title {
        font-weight: 580;
      }
      .setting-hint {
        max-width: 400px;
        margin-top: 4px;
        font-size: var(--text-control);
        line-height: 1.45;
        color: var(--muted);
      }
      .control {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        align-items: center;
        gap: var(--space-2);
      }
      .seg-indicator {
        height: var(--tab-control-size);
      }
      .select {
        height: 32px;
        min-width: 190px;
        padding: 0 32px 0 12px;
        border: 0;
        border-radius: var(--r-control);
        background: var(--paper);
        box-shadow: var(--e2);
        color: var(--ink);
        font-size: var(--text-control);
      }
      .model-control {
        width: 276px;
        display: grid;
        grid-template-columns: 180px 88px;
        align-items: center;
        gap: var(--space-2);
      }
      .model-select,
      .effort-select {
        position: relative;
        min-width: 0;
      }
      .model-trigger,
      .effort-trigger {
        width: 100%;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-1-5);
        padding: 0 10px 0 12px;
        border-radius: var(--r-control);
        background: var(--paper);
        box-shadow: var(--e2);
        font: 500 var(--text-control)/1 var(--mono);
        text-align: left;
        transition:
          background var(--motion-feedback) var(--ease-out),
          transform var(--motion-press) var(--ease-out);
      }
      .effort-trigger {
        text-transform: capitalize;
        color: var(--muted);
      }
      .model-trigger span {
        min-width: 0;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .model-trigger svg,
      .effort-trigger svg {
        width: var(--icon-size);
        height: var(--icon-size);
        flex: none;
        color: var(--faint);
        transition: transform var(--motion-feedback) var(--ease-out);
      }
      .model-control.model-open .model-trigger svg,
      .model-control.effort-open .effort-trigger svg {
        transform: rotate(180deg);
      }
      .model-menu,
      .effort-menu {
        position: absolute;
        z-index: var(--z-popover);
        top: 38px;
        transform-origin: top;
      }
      .model-menu {
        left: 0;
        width: 300px;
        max-height: 260px;
        overflow: auto;
      }
      .effort-menu {
        right: 0;
        width: 116px;
      }
      [data-model-option] {
        font: 500 var(--text-control)/1.25 var(--mono);
      }
      [data-effort-option] {
        font: 500 var(--text-control)/1.25 var(--sans);
        text-transform: capitalize;
      }
      .dp-menu-item .check {
        margin-left: auto;
        opacity: 0;
      }
      .dp-menu-item:is([aria-selected="true"], [aria-checked="true"]) .check {
        opacity: 1;
      }

      .meter {
        width: 170px;
        height: 5px;
        border-radius: var(--r-control);
        background: var(--panel-soft);
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        width: var(--value, 60%);
        background: var(--ink);
        border-radius: inherit;
      }
      .range {
        accent-color: var(--ink);
        width: 170px;
      }
      .number {
        width: 58px;
        height: 32px;
        text-align: center;
        border: 0;
        border-radius: var(--r-control);
        background: var(--paper);
        box-shadow: var(--e2);
      }
      .comfortable {
        --pct: 50%;
        --fill-x: 0px;
        --marker-x: 0px;
        --marker-opacity: 1;
        position: relative;
        width: 100%;
        height: 32px;
        display: flex;
        align-items: center;
        overflow: hidden;
        border: var(--border-width) solid var(--line-strong);
        border-radius: var(--r-row);
        background: var(--paper);
        cursor: ew-resize;
        touch-action: none;
        user-select: none;
        transition:
          --fill-x var(--motion-tab-shift) var(--ease-out),
          --marker-x var(--motion-tab-shift) var(--ease-out);
      }
      .comfortable.instant,
      .comfortable.dragging {
        transition: none;
      }
      .comfortable::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--fill-x);
        background: color-mix(in oklab, var(--accent) 18%, transparent);
      }
      .comfortable::after {
        content: "";
        position: absolute;
        top: 8px;
        bottom: 8px;
        left: var(--marker-x);
        width: var(--range-marker-width);
        border-radius: var(--range-marker-width);
        background: color-mix(in oklab, var(--ink) 35%, transparent);
        opacity: var(--marker-opacity);
        transform: scaleY(1);
        transform-origin: center;
      }
      .comfortable:hover::after,
      .comfortable:focus-within::after {
        background: color-mix(in oklab, var(--ink) 55%, transparent);
        transform: scaleY(1.125);
      }
      .comfortable-label,
      .comfortable-value {
        position: relative;
        z-index: var(--z-raised);
        padding: 0 13px;
        font-size: var(--text-control);
        color: var(--muted);
        pointer-events: none;
      }
      .comfortable-value {
        margin-left: auto;
        min-width: 70px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .comfortable input[type="range"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: ew-resize;
      }
      .comfortable input[type="number"] {
        position: relative;
        z-index: var(--z-raised);
        margin-left: auto;
        width: 72px;
        height: var(--tab-control-size);
        padding: 0 10px;
        border: 0;
        outline: 0;
        background: transparent;
        text-align: right;
        font-size: var(--text-control);
        font-variant-numeric: tabular-nums;
        -moz-appearance: textfield;
      }
      .comfortable input[type="number"]::-webkit-inner-spin-button {
        display: none;
      }
      .comfortable.pips::before {
        background: linear-gradient(
          90deg,
          color-mix(in oklab, var(--accent) 20%, var(--paper)),
          color-mix(in oklab, var(--accent) 20%, var(--paper))
        );
      }
      .field-stack {
        display: grid;
        gap: var(--space-1-5);
      }
      .field-stack + .field-stack {
        margin-top: 15px;
      }
      .field-help {
        font-size: var(--text-control);
        line-height: 1.45;
        color: var(--faint);
      }
      .comfortable {
        border: 0;
        border-radius: var(--r-control);
        box-shadow: var(--e2);
      }
      .comfortable::after {
        transition:
          opacity var(--motion-press) var(--ease-out),
          transform var(--motion-feedback) var(--ease-out),
          background var(--motion-feedback) var(--ease-out);
      }
      .comfortable:focus-within {
        outline: 0;
      }
      .comfortable:has(input[type="range"]:focus-visible),
      .comfortable:has(input[type="number"]:focus-visible) {
        box-shadow:
          var(--e2),
          inset 0 0 0 1px color-mix(in oklab, var(--ink) 16%, transparent);
      }
      .model-menu {
        transform-origin: 24px 0;
      }
      .model-search-wrap {
        margin: 6px 4px 4px;
      }
      .surface:has(.model-control.model-open, .model-control.effort-open) {
        overflow: visible;
      }
      .setting-row:has(.model-control.model-open, .model-control.effort-open) {
        position: relative;
        z-index: var(--z-shell);
      }
      .model-control.above .model-menu,
      .model-control.above .effort-menu {
        --popover-offset: var(--popover-offset-above);
        top: auto;
        bottom: 38px;
        transform-origin: 24px 100%;
      }
      .comfortable-pips {
        position: absolute;

        width: var(--tab-control-size);
        min-width: var(--tab-control-size);
        height: var(--tab-control-size);
        display: grid;
        place-items: center;
        padding: 0;
        border-radius: var(--r-control);
        color: var(--faint);

      .policy button:hover {
        color: var(--muted);

      .policy button.on {
        color: var(--ink);

      .policy-icon {
        width: var(--icon-size);
        height: var(--icon-size);
        opacity: 0.6;
        transition: opacity var(--motion-feedback) var(--ease-out);
      }
      .policy button.on .policy-icon {
        opacity: 1;
      }
      .tool-list .row {
        grid-template-columns: minmax(150px, 0.95fr) minmax(190px, 1.35fr) var(
            --tab-triplet-width
          );
      }
      .tool-list .row-end {
        width: var(--tab-triplet-width);
      }
      .swatches {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
      }
      .swatch {
        position: relative;
        width: 24px;
        height: 24px;
        border-radius: var(--r-circle);
        background: var(--swatch);
        box-shadow: var(--swatch-shadow);
        transition: transform var(--motion-press) var(--ease-out);
      }
      .swatch.on::after {
        content: "";
        position: absolute;
        inset: -4px;
        border: 1.5px solid var(--swatch);
        border-radius: var(--r-circle);
      }
      .preview-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--space-2);
        padding: 14px;

      .motion-card {
        min-height: 88px;
        padding: 11px;
        border-radius: var(--r-house);
        background: var(--paper);
        box-shadow: inset 0 0 0 1px var(--line);
        text-align: left;
      }
      .motion-card.on {
        box-shadow: inset 0 0 0 1.5px var(--ink);
      }
      .motion-card b {
        display: block;
        font-size: var(--text-control);
        margin-top: 18px;
      }
      .motion-card span {
        display: block;
        margin-top: 3px;
        font: 500 var(--text-meta)/1.3 var(--mono);
        color: var(--faint);
      }
      .motion-mark {
        width: 28px;
        height: 5px;
        border-radius: var(--r-control);
        background: var(--ink);
        opacity: 0.75;
      }
      .motion-card:nth-child(2) .motion-mark {
        filter: blur(2px);
        transform: scaleX(1.35);
      }
      .motion-card:nth-child(3) .motion-mark {
        background: linear-gradient(90deg, var(--ink), var(--accent));
      }
      .motion-card:nth-child(4) .motion-mark {
        width: 18px;
        height: 18px;
        border: 2px solid var(--line-strong);
        border-top-color: var(--ink);
        border-radius: var(--r-circle);
        background: none;

      .archive-row {
        min-height: 62px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--space-5);
        padding: 11px 14px;

        border-top: var(--border-width) solid

        font-weight: 550;

      .archive-meta {
        margin-top: 4px;
        font: 500 var(--text-meta)/1.3 var(--mono);
        color: var(--faint);

      .archive-actions {
        display: flex;
        gap: var(--space-1-5);
        opacity: 0;
        transition: opacity var(--motion-feedback) var(--ease-out);
      }

      .archive-row:focus-within .archive-actions {
        opacity: 1;
      }

      /* setup inspector */
      .setup-sheet {
        position: fixed;
        z-index: var(--z-sheet);
        right: var(--floating-edge);
        top: var(--setup-sheet-top);
        bottom: var(--setup-sheet-bottom);
        width: min(
          var(--setup-sheet-width),
          calc(100vw - var(--floating-edge) * 2)
        );
        display: flex;
        flex-direction: column;
        border-radius: var(--surface-radius);
        opacity: 0;
        visibility: hidden;
        transform: translateX(var(--motion-distance-sheet-enter));

      .setup-sheet.show {
        opacity: 1;
        visibility: visible;
        transform: translateX(0);

        font-size: var(--text-body);

        min-height: 3.75rem;
        padding: 0.5rem 0.75rem 0.75rem;
        border-top: 0;
      }
      .sheet-close {
        margin-left: auto;
      }

        font: 500 var(--text-meta)/1 var(--mono);
        letter-spacing: 0.08em;
        color: var(--faint);

        font-size: var(--text-2xl);
        letter-spacing: -0.02em;
        margin: 12px 0 7px;
      }
      .setup-sheet .dp-sheet-body > p {

      }
      .sheet-step {

        display: flex;
        align-items: center;
        gap: var(--space-2);

        width: 20px;
        height: 20px;

        margin-top: 10px;
      }

        display: block;
        margin-bottom: 7px;
        font-size: var(--text-control);
        font-weight: 550;
      }

        height: 38px;

      .scope-list {
        margin-top: 10px;
        padding: 11px 12px;
        border-radius: var(--r-house);
        background: var(--surface-7);
        font-size: var(--text-control);
        color: var(--muted);

        color: var(--ink-soft);

      }
      .veil {
        position: fixed;
        left: 0;
        right: 0;

        backdrop-filter: blur(5px);

      }
      .veil.bottom {
        bottom: 0;
        mask-image: linear-gradient(to bottom, transparent, #000 78%);
      }

          );
        document.querySelectorAll("[data-radius]").forEach((b) =>
          b.addEventListener("click", () => {
            const square = b.dataset.radius === "square";
            document.documentElement.style.setProperty(
              "--r-control",
              square ? "var(--r-square)" : "var(--r-pill)",
            );
            document.documentElement.style.setProperty(
              "--r-shell",
              square ? "var(--r-shell-square)" : "var(--r-shell-round)",
            );
          }),
        );
        document
          .querySelectorAll("[data-sheet]")
          .forEach((b) =>
            b.addEventListener("click", () => openSheet(b.dataset.sheet)),
          );
        document.querySelectorAll(".model-control").forEach(bindModelControl);
        document.querySelectorAll("[data-slider]").forEach(bindComfortable);
        document.querySelectorAll(".searchbar input").forEach((input) =>
          input.addEventListener("input", () => {
            const q = input.value.toLowerCase(),
              root =
                input.closest(".section")?.nextElementSibling ||
                input.closest(".section");
            document
              .querySelectorAll(".tool-list .row,.archive-row")
              .forEach(
                (row) =>
                  (row.style.display = row.textContent.toLowerCase().includes(q)
                    ? ""
                    : "none"),
              );
          }),
        );
      }
      function render(name, direction = 0) {
        const next = template(name);
        const commit = () => {
          plane.replaceChildren(next);
          bindContent();
          active = name;
          layout();
        };
        if (!direction) {
          commit();
          return;
        }
        plane.classList.add("swapping");
        window.BOARD_MOTION.content
          .swap(plane, commit, { direction })
          .finally(() => plane.classList.remove("swapping"));
      }
      document.querySelectorAll(".nav-item").forEach((button, index) =>
        button.addEventListener("click", () => {
          if (button.dataset.page === active) return;
          const current = pages.indexOf(active),
            next = pages.indexOf(button.dataset.page),
            direction = next > current ? 1 : -1;
          document
            .querySelectorAll(".nav-item")
            .forEach((x) => x.classList.toggle("on", x === button));
          positionHighlight();
          render(button.dataset.page, direction);
          if (COMPACT_SHELL.matches)
            document.body.classList.remove("mobile-nav");
        }),
      );
      function layout() {
        positionHighlight(true);
      }
      document
        .querySelector(".sidebar-toggle")
        .addEventListener("click", () => {
          const mobile = COMPACT_SHELL.matches;
          if (mobile) document.body.classList.toggle("mobile-nav");
          else
            window.BOARD_MOTION.sidebar.sync({
              className: "nav-hidden",
              hidden: !document.body.classList.contains("nav-hidden"),
              sidebar: document.querySelector(".rail"),
              dependents: [document.querySelector(".workspace")],
            });
          const expanded = mobile
            ? document.body.classList.contains("mobile-nav")
            : !document.body.classList.contains("nav-hidden");
          window.BOARD_MOTION.shellToggle.sync(
            document.querySelector(".sidebar-toggle"),
            {
              expanded,
              expandedIcon: "#dp-panel-left-close",
              collapsedIcon: "#dp-panel-left-open",
            },
          );
          requestAnimationFrame(layout);
        });
      const resizer = document.querySelector(".rail-resizer");
      window.BOARD_MOTION.sidebarResize.bind(resizer, {
        variable: "--sidebar-width",
        keyboard: true,
        onChange: (value) => {
          document.documentElement.style.setProperty(
            "--sidebar-width",
            `${value}px`,
          );
          layout();
        },
      });
      function showSheet() {
        window.BOARD_MOTION.surface.show(sheet, {
          beforeOpen: () => sheet.classList.add("show"),
        });
        requestAnimationFrame(() => sheetBody.querySelector("input")?.focus());
      }
      function openSheet(key) {
        const primary = document.querySelector(".sheet-primary");
        primary.textContent = "Continue";
        if (key === "mcp-add") {
          sheetTitle.textContent = "Add MCP server";
          primary.textContent = "Save";
          sheetBody.innerHTML = `<div class="sheet-kicker">MCP SERVER</div><h3>Connect to a custom MCP</h3><p>Choose a transport, then provide only the fields that transport needs.</p><div class="sheet-step"><div class="sheet-field"><label>Name</label><input class="dp-field" placeholder="MCP server name"></div><div class="sheet-field"><label>Transport</label><div class="seg dp-segmented" data-mcp-transport><button>STDIO</button><button class="on">Streamable HTTP</button></div></div><div data-mcp-fields></div></div>`;
          const fields = sheetBody.querySelector("[data-mcp-fields]"),
            buttons = [
              ...sheetBody.querySelectorAll("[data-mcp-transport] button"),
            ];
          const draw = (kind) => {
            fields.innerHTML =
              kind === "STDIO"
                ? `<div class="sheet-field"><label>Command to launch</label><input class="dp-field" placeholder="openai-dev-mcp serve-sqlite"></div><div class="sheet-field"><label>Arguments</label><input class="dp-field" placeholder="Add argument"></div><div class="sheet-field"><label>Environment variables</label><input class="dp-field" placeholder="KEY=Value"></div>`
                : `<div class="sheet-field"><label>URL</label><input class="dp-field" placeholder="https://mcp.example.com/mcp"></div><div class="sheet-field"><label>Auth</label><div class="seg dp-segmented"><button class="on">Auto</button><button>Headers</button></div></div>`;
            bindSegments(fields);
          };
          buttons.forEach((button) =>
            button.addEventListener("click", () => {
              buttons.forEach((item) =>
                item.classList.toggle("on", item === button),
              );
              draw(button.textContent);
            }),
          );
          draw("Streamable HTTP");
          bindSegments(sheetBody);
          showSheet();
          return;
        }
        if (key === "mcp-edit") {
          sheetTitle.textContent = "Update Obsidian MCP";
          primary.textContent = "Save";
          sheetBody.innerHTML = `<div class="sheet-kicker">MCP SERVER</div><h3>Obsidian</h3><p>Transport is locked after creation. Uninstall first to switch transport.</p><div class="sheet-step"><div class="scope-list"><b>Transport</b><br>Streamable HTTP<br><b>Status</b><br>Connected · 6 tools</div><div class="sheet-field"><label>URL</label><input class="dp-field" value="http://localhost:8765"></div><div class="sheet-field"><label>Auth</label><div class="seg dp-segmented"><button class="on">Auto</button><button>Headers</button></div></div></div><div class="sheet-step"><div class="sheet-step-label"><span class="step-num">2</span>Discovered tools</div><div class="scope-list"><b>6 tools</b><br>Per-tool policy: Approve · Ask · Deny</div></div>`;
          bindSegments(sheetBody);
          showSheet();
          return;
        }
        if (key === "custom-model") {
          sheetTitle.textContent = "Custom models";
          primary.textContent = "Add model";
          sheetBody.innerHTML = `<div class="sheet-kicker">OPENAI-COMPATIBLE</div><h3>Add custom model</h3><p>Local or hosted endpoints use the same explicit model contract.</p><div class="sheet-field"><label>Model ID</label><input class="dp-field" placeholder="provider/model-name"></div><div class="sheet-field"><label>Base URL</label><input class="dp-field" placeholder="http://localhost:11434/v1"></div><div class="sheet-field"><label>Context window</label><input class="dp-field" inputmode="numeric" placeholder="128000"></div><div class="sheet-field"><label>Max output tokens</label><input class="dp-field" inputmode="numeric" placeholder="8192"></div><div class="sheet-field"><label>API key (optional)</label><input class="dp-field" type="password"></div>`;
          showSheet();
          return;
        }
        if (key === "mcp-assistant") {
          sheetTitle.textContent = "MCP setup assistant";
          sheetBody.innerHTML = `<div class="sheet-kicker">GUIDED SETUP</div><h3>Connect an MCP server</h3><p>Describe the server you have; the assistant prepares a reviewable configuration without enabling tools.</p><div class="sheet-step"><div class="sheet-field"><label>Server or package</label><input class="dp-field" placeholder="URL, package name, or command"></div></div><div class="sheet-step"><div class="scope-list"><b>Before enabling</b><br>Review transport, authentication, discovered tools, and each approval policy.</div></div>`;
          showSheet();
          return;
        }
        const d = sheetData[key] || sheetData.openai;
        sheetTitle.textContent = d[0];
        sheetBody.innerHTML = `<div class="sheet-kicker">${d[1]}</div><h3>${d[2]}</h3><p>${d[3]}</p><div class="sheet-step"><div class="sheet-step-label"><span class="step-num">1</span>${d[4]}</div><div class="sheet-field"><label>${d[4]}</label><input class="dp-field" value="${d[5]}" placeholder="Required"></div></div><div class="sheet-step"><div class="sheet-step-label"><span class="step-num">2</span>Review capability</div><div class="scope-list"><b>${d[6]}</b><br>${d[7]}<br><b>${d[8]}</b><br>${d[9]}</div></div>`;
        showSheet();
      }
      function closeSheet() {
        window.BOARD_MOTION.surface.hide(sheet, {
          afterClose: () => sheet.classList.remove("show"),
        });
      }
      document
        .querySelectorAll(".sheet-close,.sheet-cancel")
        .forEach((b) => b.addEventListener("click", closeSheet));
      document.querySelector(".sheet-primary").addEventListener("click", () => {
        closeSheet();
        showToast("Connection saved");
      });
      function showToast(message) {
        window.BOARD_TOAST.show(message);
      }
      addEventListener("resize", layout);
      document.addEventListener("pointerdown", (event) => {
        document
          .querySelectorAll(
            ".model-control.model-open,.model-control.effort-open",
          )
          .forEach((root) => {
            if (!root.contains(event.target)) closeModelControl(root);
          });
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && sheet.classList.contains("show"))
          closeSheet();
        if (e.key === "Escape")
          document
            .querySelectorAll(
              ".model-control.model-open,.model-control.effort-open",
            )
            .forEach(closeModelControl);
      });
      render("providers");
      requestAnimationFrame(() => {
        positionHighlight(true);
        layout();
      });
    </script>
    <details class="dp-review-nav">
      <summary>Mockups</summary>
      <nav aria-label="Mockup pages">
        <a href="./board-home.html">Home</a><a href="./board-chat.html">Chat</a
        ><a href="./board-automations.html">Automations</a
        ><a href="./board-memory.html">Memory</a
        ><a href="./board-settings.html" aria-current="page">Settings</a
        ><a href="./board-area-room.html">Area Room</a
        ><a href="./board-system-overlays.html">Overlays</a>
      </nav>
    </details>
  </body>
</html>

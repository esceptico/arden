<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board — Mission Control · A (Linear triage)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<script src="./board-icons.js?v=20260719-2"></script>
<script src="./board-motion.js?v=20260720-31"></script>
<style>
@import "./board-system.css?v=20260722-21";

html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  font-family: var(--sans);
  font-size: var(--text-base);
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

/* ---- sidebar shell — verbatim from board-home ---- */
.traffic { z-index: 60; }
.sidebar-toggle { z-index: 61; }
.rail { z-index: 40; padding: 48px 10px 12px; display: flex; flex-direction: column; }
.rail-nav { display: grid; gap: 1px; }
.nav-row, .area-row {
  width: 100%; min-width: 0; color: var(--ink-2); text-align: left; border-radius: var(--row-radius);
  transition: background var(--motion-feedback) var(--ease-out), color var(--motion-feedback) var(--ease-out), transform var(--motion-press) var(--ease-out);
}
.nav-row { height: 30px; padding: 0 8px; display: grid; grid-template-columns: var(--icon-size) minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.nav-row:hover, .area-row:hover, .nav-row.on { color: var(--ink); background: var(--state-hover-bg); }
.nav-row.on { background: var(--state-selected-bg); }
.nav-row svg { width: var(--icon-size); height: var(--icon-size); color: var(--muted); }
.nav-count { font-size: var(--text-2xs); color: var(--faint); }
.area-bar { height: 32px; margin-top: 10px; padding: 0 4px 0 8px; display: flex; align-items: center; justify-content: space-between; }
.area-bar > span { font-size: var(--text-xs); font-weight: 590; color: var(--muted); }
.area-list { flex: 1; min-height: 0; overflow: auto; }
.area-row { height: 30px; padding: 0 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.area-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.area-row small { font-size: var(--text-2xs); font-weight: 520; color: var(--faint); font-variant-numeric: tabular-nums; }
.area-row small.warn { color: var(--warning); }
.area-row small.live { color: var(--accent-ink); }
.rail-bottom { display: flex; align-items: center; gap: 4px; padding-top: 7px; border-top: var(--border-width) solid var(--edge); }
.rail-bottom .nav-row { flex: 1; }
.rail-resize { top: 72px; bottom: 58px; }

.workspace {
  position: absolute; inset: 0; overflow: hidden; overscroll-behavior: contain;
  padding-left: calc(var(--sidebar-width) + var(--sidebar-gap));
  transition: padding-left var(--motion-sidebar-hide) var(--motion-drawer-ease);
}
body.rail-hidden .workspace { padding-left: 0; }

/* ---- page — Linear triage: dense, list-forward, top-anchored, left-aligned ---- */
.page {
  height: 100%; max-width: 41.5rem; margin: 0;
  padding: 58px var(--content-gutter) 16px 44px;
  display: flex; flex-direction: column; align-items: stretch; min-height: 0;
}
.page > * { min-width: 0; flex: none; }

/* the answer — one working line, not a headline */
.answer { margin: 0; padding: 0 1px; font-size: var(--text-md); line-height: 1.4; font-weight: 620; letter-spacing: -.008em; }
.answer-meta { font-size: var(--text-sm); font-weight: 460; color: var(--muted); font-variant-numeric: tabular-nums; }

/* the front door — slim, full column width, quiet ring */
.capture {
  height: 33px; margin-top: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 11px;
  border-radius: var(--r-control); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-strong);
  transition: box-shadow var(--motion-focus) var(--ease-out);
}
.capture:focus-within { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in oklab, var(--accent) 13%, transparent); }
.capture input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: var(--text-sm); }
.capture input::placeholder { color: var(--faint); }
.capture kbd { flex: none; font: 500 var(--text-xs)/1 var(--mono); color: var(--faint); }

/* section heads — plain sentence-case words, no eyebrow treatment */
.section-head {
  margin-top: 26px; min-height: 24px; padding: 0 1px;
  display: flex; align-items: baseline; gap: 10px;
}
.section-head h2 { margin: 0; font-size: var(--text-sm); font-weight: 620; letter-spacing: -.004em; }
.section-head .head-pos { margin-left: auto; font: 500 var(--text-xs)/1 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.not-today {
  padding: 2px 6px; margin-right: -6px; border-radius: var(--r-tag);
  font: 500 var(--text-xs)/1 var(--sans); color: var(--faint);
  transition: color var(--motion-feedback) var(--ease-out), background var(--motion-feedback) var(--ease-out);
}
.not-today:hover { color: var(--ink); background: var(--state-hover-bg); }

/* ---- the queue — every ask visible; the head ask opens in place ---- */
.queue { margin-top: 8px; display: flex; flex-direction: column; }

.ask-row {
  width: 100%; min-height: 38px; padding: 0 11px; border-radius: var(--r-row);
  display: flex; align-items: center; gap: 12px; text-align: left; color: var(--ink);
  transition: background var(--motion-feedback) var(--ease-out), transform var(--motion-press) var(--ease-out);
}
.ask-row:hover { background: var(--state-hover-bg); }
.ask-row:not(:disabled):active { transform: scale(var(--press-scale-subtle)); }
.ask-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: var(--text-sm); font-weight: 560; letter-spacing: -.004em; }
.ask-meta { flex: none; font-size: var(--text-xs); color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.queue > .ask-row + .ask-row { position: relative; }
.queue > .ask-row + .ask-row::before {
  content: ""; position: absolute; left: 11px; right: 11px; top: 0;
  border-top: var(--border-width) solid color-mix(in oklab, var(--line) 72%, transparent);
}

/* the head ask, expanded in place — tone separates it, never a shadow */
.ask-open {
  padding: 3px 11px 12px; border-radius: var(--r-house);
  background: var(--state-hover-bg);
}
.ask-open .ask-row { padding: 0 0; background: none; }
.ask-open .ask-row:hover { background: none; }
.ask-reason { margin: 1px 0 0; max-width: 56ch; font-size: var(--text-sm); line-height: 1.5; color: var(--muted); text-wrap: pretty; }
.ask-then { margin: 6px 0 0; font-size: var(--text-xs); line-height: 1.45; color: var(--faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ask-then b { font-weight: 520; color: var(--muted); }
.ask-verbs { margin-top: 12px; display: flex; align-items: center; gap: 6px; }

/* verbs — small, quiet, keyed with bare faint numerals */
.verb {
  height: 28px; padding: 0 10px; border-radius: var(--r-control);
  display: inline-flex; align-items: center;
  font-size: var(--text-control); font-weight: 540; color: var(--ink);
  background: color-mix(in oklab, var(--ink) 5%, transparent);
  transition: background var(--motion-feedback) var(--ease-out), color var(--motion-feedback) var(--ease-out), transform var(--motion-press) var(--ease-out);
}
.verb:hover { background: color-mix(in oklab, var(--ink) 9%, transparent); }
.verb.primary { color: var(--paper); background: var(--ink); }
.verb.primary:hover { background: color-mix(in oklab, var(--ink) 88%, var(--paper)); }
.verb-key { margin-right: 7px; font: 560 var(--text-2xs)/1 var(--mono); opacity: .5; }

/* ---- ambient tiers — dense rows, hairline-separated, one line each ---- */
.ambient { margin-top: 6px; display: flex; flex-direction: column; }
.tier {
  width: 100%; min-height: 34px; padding: 0 11px; border-radius: var(--r-row);
  display: flex; align-items: center; gap: 9px; text-align: left;
  transition: background var(--motion-feedback) var(--ease-out);
}
.tier:hover { background: var(--state-hover-bg); }
.tier + .tier { position: relative; }
.tier + .tier::before {
  content: ""; position: absolute; left: 11px; right: 11px; top: 0;
  border-top: var(--border-width) solid color-mix(in oklab, var(--line) 72%, transparent);
}
.tier-line { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: var(--text-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.tier-line b { color: var(--ink-soft); font-weight: 570; }
.tier-line .live { color: var(--accent-ink); }
.tier-chev { width: 12px; height: 12px; flex: none; color: var(--faint); opacity: .45;
  transition: opacity var(--motion-feedback) var(--ease-out); }
.tier:hover .tier-chev { opacity: 1; }

@media (max-width: 46.25rem) {
  .workspace { padding-left: 0; }
  .page { padding-top: var(--home-compact-top-inset); }
}
@media (max-height: 47rem) {
  .page { padding-top: 48px; }
  .section-head { margin-top: 20px; }
  .ask-row { min-height: 36px; }
  .tier { min-height: 32px; }
}
</style>
</head>
<body>
<div id="app">
  <div class="dp-traffic traffic" aria-hidden="true"><i class="dp-traffic-light"></i><i class="dp-traffic-light"></i><i class="dp-traffic-light"></i></div>
  <button class="dp-shell-toggle dp-shell-toggle-left sidebar-toggle" id="sidebar-toggle" aria-label="Hide sidebar"><svg aria-hidden="true"><use href="#dp-panel-left-close"/></svg></button>

  <aside class="rail dp-sidebar" aria-label="Workspace sidebar">
    <nav class="rail-nav" aria-label="App">
      <button class="nav-row on"><svg><use href="#dp-home"/></svg><span>Mission Control</span></button>
      <button class="nav-row"><svg><use href="#dp-zap"/></svg><span>Automations</span><span class="nav-count">3</span></button>
      <button class="nav-row"><svg><use href="#dp-brain"/></svg><span>Memory</span></button>
    </nav>
    <div class="area-bar"><span>Areas</span><button class="dp-icon-button" aria-label="Manage areas"><svg><use href="#dp-sliders"/></svg></button></div>
    <div class="area-list">
      <button class="area-row"><span>O-1A evidence</span><small class="warn">needs you</small></button>
      <button class="area-row"><span>Market launch</span><small class="live">2 running</small></button>
      <button class="area-row"><span>Product</span><small>quiet</small></button>
      <button class="area-row"><span>Health</span><small>updated</small></button>
    </div>
    <nav class="rail-bottom" aria-label="Settings">
      <button class="nav-row"><svg><use href="#dp-settings"/></svg><span>Settings</span></button>
      <button class="theme-toggle dp-icon-button" aria-label="Toggle theme"><svg><use href="#dp-sun"/></svg></button>
    </nav>
    <button class="dp-sidebar-resizer rail-resize" aria-label="Resize sidebar"></button>
  </aside>

  <main class="workspace">
    <div class="page">
      <h1 class="answer">3 things need you <span class="answer-meta">· 2 agents out · 2 handled today</span></h1>

      <form class="capture" data-region="universal-capture">
        <input aria-label="Ask, search, or start a chat" placeholder="Ask, search, or start a chat…" autocomplete="off">
        <kbd>⌘K</kbd>
      </form>

      <div class="section-head">
        <h2>Needs you</h2>
        <span class="head-pos">1 of 3</span>
        <button type="button" class="not-today">not today</button>
      </div>

      <section class="queue" aria-label="Needs you">
        <div class="ask-open">
          <button type="button" class="ask-row" aria-expanded="true">
            <span class="ask-title">Approve the release note publish</span>
            <span class="ask-meta">review · market launch · waiting 12m</span>
          </button>
          <p class="ask-reason">The release is ready — publishing waits on its only external write. The note itself is already reviewed by the drafting agent.</p>
          <p class="ask-then"><b>The publish workflow resumes</b> · no other changes</p>
          <div class="ask-verbs">
            <button type="button" class="verb primary"><span class="verb-key">1</span>Approve</button>
            <button type="button" class="verb"><span class="verb-key">2</span>Reject…</button>
            <button type="button" class="verb"><span class="verb-key">3</span>Later</button>
          </div>
        </div>
        <button type="button" class="ask-row" aria-expanded="false">
          <span class="ask-title">Choose the launch brief audience</span>
          <span class="ask-meta">question · market launch · waiting 4h</span>
        </button>
        <button type="button" class="ask-row" aria-expanded="false">
          <span class="ask-title">Review the award-date conflict</span>
          <span class="ask-meta">review · O-1A evidence · waiting 52m</span>
        </button>
      </section>

      <div class="section-head">
        <h2>Working without you</h2>
      </div>

      <section class="ambient" aria-label="Working without you">
        <button type="button" class="tier">
          <span class="tier-line"><b>2 agents out</b> — <span class="live">market analyst: comparing retention signals · 4m</span></span>
          <svg class="tier-chev"><use href="#dp-chevron-down"/></svg>
        </button>
        <button type="button" class="tier">
          <span class="tier-line"><b>Asleep until tomorrow 08:30</b> — inbox brief</span>
          <svg class="tier-chev"><use href="#dp-chevron-down"/></svg>
        </button>
        <button type="button" class="tier">
          <span class="tier-line"><b>2 landed today</b> — latest: competitor evidence review — 7 sources grouped, brief in memory</span>
          <svg class="tier-chev"><use href="#dp-chevron-down"/></svg>
        </button>
      </section>
    </div>
  </main>
</div>
<script>
  window.BOARD_MOTION.theme.bindToggle(document.querySelector(".theme-toggle"), { lightIcon: "#dp-sun", darkIcon: "#dp-moon" });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rethink — Branching</title>
<style>
/* ============================================================
   RETHINK 1 — CHAT IS A TREE, NOT A LOG
   Every answer is a fork point. Alternatives aren't lost in
   "regenerate" — they're siblings you can walk. The conversation
   is a path through a tree; the map at the top is the real
   object, the transcript is just the current path.
   ============================================================ */
:root{
  --bg:#101014;--surface:#17171d;--raised:#1e1e26;
  --ink:#e8e8ec;--soft:#b6b6c2;--dim:#787886;--ghost:#4a4a56;
  --line:#26262e;--live:#e2c044;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --sans:-apple-system,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}

/* — The map. The conversation's true shape. — */
.map{flex:none;padding:22px 28px 18px;border-bottom:1px solid var(--line)}
.map-title{font:600 12px var(--mono);color:var(--dim);letter-spacing:.08em;margin-bottom:14px}
.map svg{display:block;overflow:visible}
.node{fill:var(--ghost);transition:fill .2s}
.node.on-path{fill:var(--soft)}
.node.current{fill:var(--live)}
.node-hit{fill:transparent;cursor:pointer}
.edge{stroke:var(--line);stroke-width:1.5;fill:none;transition:stroke .2s}
.edge.on-path{stroke:var(--dim)}
.map-label{font:10px var(--mono);fill:var(--ghost)}

/* — The path (transcript of the selected branch) — */
.path{flex:1;overflow-y:auto}
.lane{max-width:620px;margin:0 auto;padding:34px 28px 120px}
.msg{margin-bottom:30px}
.msg .who{font:600 11px var(--mono);letter-spacing:.1em;color:var(--dim);margin-bottom:8px}
.msg.you .who{color:var(--soft)}
.msg .text{color:var(--soft);text-wrap:pretty}
.msg.you .text{color:var(--ink);font-weight:500}
.msg .text p{margin:0 0 12px}
.msg .text p:last-child{margin:0}

/* fork handle: the paradigm feature. every agent msg has one. */
.forks{display:flex;gap:6px;margin-top:12px}
.fork{height:26px;padding:0 11px;border-radius:13px;font:500 11.5px var(--mono);
  color:var(--dim);background:var(--surface);border:1px solid var(--line);transition:all .15s}
.fork:hover{color:var(--ink);border-color:var(--ghost)}
.fork.on{color:var(--bg);background:var(--live);border-color:var(--live);font-weight:600}
.fork.new{border-style:dashed}

.hint{font:11px var(--mono);color:var(--ghost);max-width:620px;margin:10px auto 0}

/* composer */
.composer{flex:none;border-top:1px solid var(--line);padding:14px 28px 18px}
.composer-inner{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
.composer input{flex:1;border:0;outline:0;background:var(--surface);color:var(--ink);
  font:15px var(--sans);height:44px;border-radius:10px;padding:0 16px}
.composer input::placeholder{color:var(--ghost)}
.branch-note{font:11px var(--mono);color:var(--ghost);white-space:nowrap}
</style>
</head>
<body>

<header class="map">
  <div class="map-title">CONVERSATION MAP — click any node</div>
  <svg id="tree" width="100%" height="96" viewBox="0 0 560 96"></svg>
</header>

<main class="path"><div class="lane" id="lane"></div></main>

<footer class="composer">
  <div class="composer-inner">
    <input placeholder="Reply continues the yellow branch…">
    <span class="branch-note" id="note"></span>
  </div>
  <div class="hint">this transcript is one path through the tree — forks stay alive</div>
</footer>

<script>
/* A real little tree. Nodes: {id, parent, who, text, x, y} */
const T = {
  q1:{parent:null, who:"YOU", text:"I want to quit my job and freelance. Talk me through it.", x:40,y:48},
  a1:{parent:"q1", who:"AGENT", text:"Before tactics — the real question is runway. How many months can you live at current burn with zero income? Everything else (clients, pricing, fear) is downstream of that number.", x:150,y:48},
  a1b:{parent:"q1", who:"AGENT · alt", text:"Don't quit yet. The boring, correct play: land your first two paying clients on nights and weekends, then quit the moment freelance income crosses 50% of salary. You lose six months of speed and gain a decade of calm.", x:150,y:16},
  q2:{parent:"a1", who:"YOU", text:"About 7 months if I'm careful.", x:260,y:48},
  a2:{parent:"q2", who:"AGENT", text:"Seven months is genuinely enough — most people who fail at this had three. Split it: months 1–2 you're allowed to earn nothing while you build a portfolio around one painfully specific offer. Months 3–5, outreach is your job — 10 conversations a week, not 'marketing'. Month 6 is the checkpoint: one paying client by then or you restart the job search with no shame and a better portfolio.", x:370,y:48},
  a2b:{parent:"q2", who:"AGENT · alt", text:"Seven months of savings really means four of runway — you'll underestimate burn, and job hunting takes three if it goes wrong. Treat month 4 as the real deadline and the whole plan changes shape: you need a paying client in 90 days, which means you start selling in week one, portfolio be damned.", x:370,y:80},
  q3:{parent:"a2", who:"YOU", text:"What's the 'painfully specific offer' for a generalist frontend dev?", x:480,y:48},
};
const CHILDREN = {}; Object.entries(T).forEach(([id,n])=>{ if(n.parent){(CHILDREN[n.parent]??=[]).push(id)} });
let current = "q3";

function pathTo(id){ const p=[]; while(id){p.unshift(id); id=T[id].parent} return p }

function render(){
  const path = pathTo(current);
  /* map */
  const svg = document.getElementById("tree");
  let s = "";
  Object.entries(T).forEach(([id,n])=>{ if(!n.parent) return;
    const p=T[n.parent], on = path.includes(id)&&path.includes(n.parent);
    s += `<path class="edge ${on?"on-path":""}" d="M${p.x+5} ${p.y} C ${p.x+55} ${p.y}, ${n.x-55} ${n.y}, ${n.x-5} ${n.y}"/>`;
  });
  Object.entries(T).forEach(([id,n])=>{
    const cls = id===current?"current":(path.includes(id)?"on-path":"");
    s += `<circle class="node ${cls}" cx="${n.x}" cy="${n.y}" r="4.5"/>
          <circle class="node-hit" cx="${n.x}" cy="${n.y}" r="14" onclick="go('${id}')"/>`;
  });
  s += `<text class="map-label" x="34" y="78">start</text><text class="map-label" x="452" y="78">now</text>`;
  svg.innerHTML = s;

  /* transcript = the path */
  const lane = document.getElementById("lane");
  lane.innerHTML = path.map(id=>{
    const n=T[id], sibs=(CHILDREN[n.parent]||[]).filter(c=>T[c].who!=="YOU");
    const forkRow = (n.who!=="YOU" && sibs.length)
      ? `<div class="forks">${sibs.map((s,i)=>`<button class="fork ${path.includes(s)?"on":""}" onclick="go('${s}')">take ${i+1}</button>`).join("")}
         <button class="fork new">+ fork here</button></div>` : "";
    return `<div class="msg ${n.who==="YOU"?"you":""}">
      <div class="who">${n.who}</div>
      <div class="text"><p>${n.text}</p></div>${forkRow}</div>`;
  }).join("");
  document.getElementById("note").textContent =
    `branch ${path.length} deep · ${Object.keys(T).length} nodes`;
}
function go(id){
  /* walking to a node selects the deepest continuation under it */
  let tip=id; while((CHILDREN[tip]||[]).length){ tip = CHILDREN[tip].find(c=>pathTo(current).includes(c)) || CHILDREN[tip][0]; }
  current = tip; render();
}
render();
</script>
</body>
</html>

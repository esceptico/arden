<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rethink — Presence</title>
<style>
/* ============================================================
   RETHINK 3 — NO SCROLLBACK
   A real conversation isn't a log you scroll; it's one moment
   at a time, and memory. So: the current exchange fills the
   room. Nothing else is on screen. The past exists as a thin
   stack of edges at the top — flip back like turning to earlier
   pages, but the default state is *presence*, not history.
   ============================================================ */
:root{
  --bg:#0c0c0d;--ink:#f2f0eb;--soft:#a9a7a0;--dim:#5d5c58;--edge:#232324;
  --sans:-apple-system,"Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}

/* the past: a stack of paper edges. each line = one exchange. */
.stack{flex:none;padding:16px 0 0;display:flex;flex-direction:column;align-items:center;gap:5px}
.sheet-edge{width:min(560px,80vw);height:3px;border-radius:2px;background:var(--edge);
  cursor:pointer;transition:background .2s,transform .2s}
.sheet-edge:hover{background:var(--dim);transform:scaleX(1.02)}
.stack-hint{margin-top:6px;font:10.5px var(--mono);color:var(--dim);opacity:0;transition:opacity .2s}
.stack:hover .stack-hint{opacity:1}

/* the present */
.room{flex:1;display:grid;place-items:center;padding:0 24px;min-height:0}
.moment{width:min(620px,100%);transition:opacity .25s,transform .25s,filter .25s}
.moment.leaving{opacity:0;transform:translateY(14px);filter:blur(6px)}
.q{font:500 24px/1.4 var(--sans);letter-spacing:-.018em;text-wrap:balance;margin:0 0 30px}
.q .cursor-tag{display:block;margin-bottom:12px;font:600 10.5px var(--mono);letter-spacing:.12em;color:var(--dim)}
.a{font-size:16.5px;line-height:1.7;color:var(--soft);text-wrap:pretty}
.a p{margin:0 0 14px}
.a p:last-child{margin:0}
.a em{color:var(--ink);font-style:normal;font-weight:560}

.nav{margin-top:34px;display:flex;align-items:center;gap:14px;font:11px var(--mono);color:var(--dim)}
.nav button{color:var(--dim);padding:4px 8px;border-radius:6px;transition:color .15s,background .15s}
.nav button:hover{color:var(--ink);background:var(--edge)}
.nav .pos{letter-spacing:.08em}
.nav .back-to-now{display:none;color:var(--ink)}
body.in-past .nav .back-to-now{display:inline-block}

/* composer: only exists in the present */
.ask{flex:none;padding:0 24px 34px;display:flex;justify-content:center;transition:opacity .25s,transform .25s}
body.in-past .ask{opacity:.15;pointer-events:none}
.ask-inner{width:min(620px,100%);display:flex;align-items:center;gap:12px;
  background:#141415;border:1px solid var(--edge);border-radius:14px;padding:4px 6px 4px 18px}
.ask input{flex:1;border:0;outline:0;background:none;color:var(--ink);font:16px var(--sans);height:48px}
.ask input::placeholder{color:var(--dim)}
.go{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--bg);
  font:600 13px var(--sans);display:grid;place-items:center}
</style>
</head>
<body>

<div class="stack" id="stack"></div>

<main class="room">
  <div class="moment" id="moment"></div>
</main>

<footer class="ask"><div class="ask-inner">
  <input placeholder="Speak…" id="input">
  <button class="go">↑</button>
</div></footer>

<script>
const EXCHANGES = [
  { q:"I want to quit my job and freelance. Talk me through it.",
    a:[`Before tactics — the real question is runway. <em>How many months can you live at current burn with zero income?</em> Everything else — clients, pricing, fear — is downstream of that number.`]},
  { q:"About 7 months if I'm careful.",
    a:[`Seven months is genuinely enough; most people who fail at this had three.`,
       `Split it. Months 1–2 you're allowed to earn nothing while you build a portfolio around one painfully specific offer. Months 3–5, outreach <em>is</em> the job — ten real conversations a week. Month 6 is the checkpoint: <em>one paying client by then, or you restart the job search</em> with no shame and a better portfolio.`]},
  { q:"What's the 'painfully specific offer' for a generalist frontend dev?",
    a:[`Not a skill — a situation. Think of the three teams you've saved before: mid-size product orgs whose design system rotted, where every screen ships 20% off-spec and nobody owns it.`,
       `That's the offer: <em>“I make your design system something your team actually uses — eight weeks, fixed scope.”</em> Generalists compete on price. Situations compete on recognition — the buyer says “that's us” before you finish the sentence.`]},
  { q:"Okay. How do I price an eight-week rescue like that?",
    a:[`Anchor on what the mess costs them, not on your old salary. A team of eight losing even 10% velocity to design-system chaos burns roughly €12k a month — your rescue pays for itself in a quarter.`,
       `Open at <em>€640/day</em>, said out loud without flinching — we'll script the sentence so the number isn't scary. Day rate for clients one and two; value pricing when you have proof.`]},
];
let now = EXCHANGES.length - 1, showing = now;

function render(){
  const stack = document.getElementById("stack");
  stack.innerHTML = EXCHANGES.slice(0, now).map((e,i)=>
    `<div class="sheet-edge" title="${e.q.replace(/"/g,'&quot;')}" onclick="flip(${i})"></div>`).join("")
    + `<div class="stack-hint">the past — ${now} earlier exchanges, hover an edge, click to revisit</div>`;

  const e = EXCHANGES[showing];
  const inPast = showing !== now;
  document.body.classList.toggle("in-past", inPast);
  document.getElementById("moment").innerHTML = `
    <h1 class="q"><span class="cursor-tag">${inPast?`EARLIER · ${showing+1} OF ${EXCHANGES.length}`:"NOW"}</span>${e.q}</h1>
    <div class="a">${e.a.map(p=>`<p>${p}</p>`).join("")}</div>
    <div class="nav">
      <button onclick="flip(${Math.max(0,showing-1)})">← older</button>
      <span class="pos">${showing+1} / ${EXCHANGES.length}</span>
      <button onclick="flip(${Math.min(now,showing+1)})">newer →</button>
      <button class="back-to-now" onclick="flip(${now})">return to now ⏎</button>
    </div>`;
}
function flip(i){
  if(i===showing) return;
  const m = document.getElementById("moment");
  m.classList.add("leaving");
  setTimeout(()=>{ showing=i; render(); m.classList.remove("leaving") }, 200);
}
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowUp") flip(Math.max(0,showing-1));
  if(e.key==="ArrowDown") flip(Math.min(now,showing+1));
  if(e.key==="Enter" && showing!==now) flip(now);
});
render();
</script>
</body>
</html>

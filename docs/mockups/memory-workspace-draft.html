h inbox history can be fetched, causing timeouts, stale work, or duplicate work; PRD-302 / DEX-80 looked “done but not done” (from chat). Gmail search performance should honor `includeFullMessages`, default to `format=metadata` with useful headers, defer body reads, and use sequential HTTP multipart batch `messages.get` requests around batch size 10 with retry/backoff to avoid 429s (from chat). The likely Gmail archive-vs-unread fix is a bulk remove-label or bulk mark-read tool, or an explicit bulk archive option that removes both `INBOX` and `UNREAD` via Gmail `batchModify`; tool descriptions should state that archiving removes `INBOX`, not `UNREAD` (from chat). For bulk email cleanup, the agent should group, analyze, label, explain counts, verify state before mass actions, and stop/explain when results look stale/repeated or an operation aborts (from chat).", " ", "-Onboarding direction is specific. As of July 2026, intended new-user onboarding is login → tell us about you → how will you use Dex → schedule call → start trial; going straight to pricing after login is not intended (from chat). The draft 2FA screen in onboarding PR #1077 was not part of Dex’s intended main onboarding or current waitlist-removal flow; Kevin said Dex ideally does not need 2FA, and the 2FA mention likely came from Slackbot/Viktor onboarding context (from chat). The team also decided not to preview real Gmail/Calendar/Context Engine/Nexus data before card or during onboarding because sync latency and edge cases were risky; use strong copy plus a GIF/looping animation instead (from chat).", "+Onboarding direction is specific. As of July 2026, intended new-user onboarding is login → tell us about you → how will you use Dex → schedule call → start trial; going straight to pricing after login is not intended (from chat). The draft 2FA screen in onboarding PR #1077 was not part of Dex’s intended main onboarding or current waitlist-removal flow; Kevin said Dex ideally does not need 2FA, and the 2FA mention likely came from Slackbot/Viktor onboarding context (from chat). The team previously decided not to preview real Gmail/Calendar/Context Engine/Nexus data before card or during onboarding because sync latency and edge cases were risky; use strong copy plus a GIF/looping animation instead (from chat). A Jul 13 Micro onboarding reference reopened the visualization question: Micro appears to show an instant context graph before trial card, and Viktor’s read was that this is likely a cheap metadata/placeholder first-pass rather than a fully indexed graph; Dex could mimic this with seeded placeholders plus “building your context” progressive replacement, while still avoiding a blocked real-data preview (from Slack).", " ", " The model/tool-search workstream is PRD-407. Regina asked the user to help Kevin scope the model selector, Kevin asked the user to research/scope tool search for OpenAI and other models, and the user prepared `./tasks/prd-407/scoping.html` for claim verification (from chat). For provider-agnostic tool-search deferral, frame the architecture by mechanism: native provider deferral where supported, Dex-managed request-side active-tool projection, stable bridge tools such as `tool_search`/`tool_describe`/`tool_call`, and MCP-style filtering before model requests (from chat). Anthropic can use native `defer_loading`/tool-reference expansion; OpenAI Responses supports native `tool_search` plus `defer_loading`; Dex fallback paths should prefer active-tool projection over a generic `tool_call` bridge unless the runtime cannot mutate the tool list between model steps (from chat). Dex model-selector reliability issues around GPT-5.5 selector breakage/disappearing UI were tracked around PRD-440, PRD-451, and PRD-343 and were mostly fixed or merged as of the July 2026 reliability sweep (from chat). Shared models metadata exists so the extension can use frontend-safe picker data without importing backend provider code or SDKs; a clearer boundary may be picker-models for frontend contract versus provider registry for backend runtime config (from chat).", " "]}, {"at": "2026-07-13 04:39", "actor": "filesystem", "stat": "+4 −4", "diff": [" ", " Reliability and observability are recurring product gaps. Users can struggle to tell whether tools, integrations, or automations failed, ran, skipped, or produced output somewhere invisible; Drive, Notion, Linear, Slack, and Pipedream can look connected/enabled while tools, triggers, connections, or sources are broken (from chat). A strong proposed direction is Automation Health/Reconciliation comparing DB enabled state, OAuth state, Pipedream trigger state, and last enqueue/run with statuses such as healthy, broken, needs reauth, or trigger missing; this overlaps PRD-251, is broadly tracked under PRD-379, and lacks clean ownership (from chat). For bug-triage automation, the trace-finding path is Postgres user/account/email resolution → LangSmith default project filtered by userId → exact matching session or trace inspection (from chat).", " ", "-The agent/tooling stack has several reliability tracks. First-tool-call failures/refires are a real issue: Slack reports describe the first 1–3 tries failing before eventually succeeding, with one suspected cause being Claude/Anthropic strict-schema handling that emits schema-ish but invalid tool JSON before Dex repairs or retries (from chat). Successful repairs are hard to count from LangSmith because `experimental_repairToolCall` runs inside the AI SDK parse-failure path and may only surface as a final repaired tool call (from chat). Bedrock Anthropic schema compatibility has two distinct constraints: Dex strips unsupported Zod-derived constraints only from the outgoing Bedrock request-body copy while preserving app-side validation, and Bedrock Anthropic requires each tool input schema to have a top-level object type (from chat). Dex request traces capture assembled AI SDK `args.params` before the provider request, so `llm_request_traces.request` is “what Dex gave AI SDK,” not the raw provider HTTP body (from chat).", "+The agent/tooling stack has several reliability tracks. First-tool-call failures/refires are a real issue: Slack reports describe the first 1–3 tries failing before eventually succeeding, with one suspected cause being Claude/Anthropic strict-schema handling that emits schema-ish but invalid tool JSON before Dex repairs or retries (from chat). Successful repairs are hard to count from LangSmith because `experimental_repairToolCall` runs inside the AI SDK parse-failure path and may only surface as a final repaired tool call (from chat). Bedrock Anthropic schema compatibility has two distinct constraints: Dex strips unsupported Zod-derived constraints only from the outgoing Bedrock request-body copy while preserving app-side validation, and Bedrock Anthropic requires each tool input schema to have a top-level object type (from chat). Dex request traces capture assembled AI SDK `args.params` before the provider request, so `llm_request_traces.request` is “what Dex gave AI SDK,” not the raw provider HTTP body (from chat). A Jul 12 self-analysis/harness discussion highlighted practical causes of cascading harness/tool issues: weird tool args with optional/mandatory mismatches, empty strings passed where unsupported, Anthropic `strict` flag concerns, weak recovery guidance after tool/model failures, inconsistent tool return shapes, and no large-result offloading (from Slack).", " ", " The reasoning-boundary investigation is evidence-sensitive. Dex has a bug where user-facing assistant/action prose can be returned and persisted as provider-declared reasoning, with evidence of `<thinking>` leakage, polluted-context examples, and clean first-seed cases where tag-bearing assistant output occurred while captured request traces had zero tag-bearing reasoning/text parts (from chat). The root cause remains unproven; do not claim tag leakage, `smoothStream`, metadata namespace, provider/model misclassification, Dex message splitting, or saved request replay as the fix/root cause without side-by-side replay proof and raw provider/stream evidence (from chat). For contaminated-trace hunting, use the literal structural condition that the last real assistant/LLM content block is `reasoning`, and do not broaden into causal classifiers unless separately asked (from chat). Bedrock/Anthropic extended thinking with tool use requires replaying exact signed reasoning/thinking blocks with signatures in order, so Dex should preserve provider-native signed reasoning separately from UI/debug reasoning and only replay signed native reasoning (from chat).", " ", " Dex’s automation/todo architecture should keep responsibilities separated: Pipedream owns external auth, connections, and event ingress/triggers; Dex owns product/domain truth, automation definitions, authoritative todo/session state, invariants, dispatch decisions, and the automation pipeline; Trigger.dev owns durable queues, retries, schedules, delayed runs, concurrency, and run reconciliation (from chat). Todos should be first-class structured runtime state rather than reconstructed from transcript `todo_write` history, with typed update events, live UI state, full-list replacement, invariant validation, and no repeated full todo lists flooding model context (from chat). “Rehydration state” means small structured runtime state that must survive when old chat messages are summarized or deleted, such as pending approvals, background tasks, active plans/todos, active loops/automations, browser targets, and tool-result artifacts (from chat).", " ", "-Approvals are an active product area. PRD-439 / the automation notification/approval flow is in progress, and the next decision is to finish it or explicitly park it (from chat). The intended “Needs You” / Inbox approvals UX is for reviewing concrete Dex-prepared draft outputs or tool actions after Dex has already run the prompt, such as exact Slack/email text, email fields, or write/edit/delete payloads; task/prompt assignment belongs in chat or a separate task-management surface (from chat). AI iteration inside approvals remains open, and Graem later said the Inbox prototype and Form fields pages are temporary and will not be in sidebar nav (from chat). There is also an open approvals bug where accept-all works for calendar-style flows but not Gmail or bulk tasks such as large email batches, tracked under DEX-22 (from chat).", "+Approvals are an active product area. PRD-439 / the automation notification/approval flow is in progress; for the AQ/Varun pilot, Chris said on Jul 12 that the Slack approve automation was almost done and he was making a final testing demo (from Slack). The intended “Needs You” / Inbox approvals UX is for reviewing concrete Dex-prepared draft outputs or tool actions after Dex has already run the prompt, such as exact Slack/email text, email fields, or write/edit/delete payloads; task/prompt assignment belongs in chat or a separate task-management surface (from chat). AI iteration inside approvals remains open, and Graem later said the Inbox prototype and Form fields pages are temporary and will not be in sidebar nav (from chat). There is also an open approvals bug where accept-all works for calendar-style flows but not Gmail or bulk tasks such as large email batches, tracked under DEX-22 (from chat).", " ", " Gmail/email work has both product and agent-behavior issues. Recurring email automations have an unbounded-scan reliability issue where too much inbox history can be fetched, causing timeouts, stale work, or duplicate work; PRD-302 / DEX-80 looked “done but not done” (from chat). Gmail search performance should honor `includeFullMessages`, default to `format=metadata` with useful headers, defer body reads, and use sequential HTTP multipart batch `messages.get` requests around batch size 10 with retry/backoff to avoid 429s (from chat). The likely Gmail archive-vs-unread fix is a bulk remove-label or bulk mark-read tool, or an explicit bulk archive option that removes both `INBOX` and `UNREAD` via Gmail `batchModify`; tool descriptions should state that archiving removes `INBOX`, not `UNREAD` (from chat). For bulk email cleanup, the agent should group, analyze, label, explain counts, verify state before mass actions, and stop/explain when results look stale/repeated or an operation aborts (from chat).", " ", " ", " Dex skills work should build on existing `.agent/skills/<name>/SKILL.md` rather than adding a new skill-management primitive (from chat). Kevin asked for HermesAgent research on periodic `SKILL` updates, Viktor’s criteria for saving/injecting skills, and a Dex system prompt for skill use; the takeaway was to combine Claude/Agent Skills progressive disclosure, Hermes-style post-turn review nudges, and Letta-style separation between tiny always-on core memory and larger retrievable memory (from chat). SkillOpt and SkillLens are relevant patterns for a practical “Skill Lab”: collect traces/outcomes, evaluate current skills against candidate skills, detect when skills help or hurt, validate-gate edits, and publish or roll back only when held-out validation improves (from chat).", " ", "-Session recording currently captures browser events in extension content scripts, coalesces them into steps in the extension background recorder, uploads screenshot/DOM assets, stores workflow recording rows and steps on the dashboard API, and renders playback from signed asset URLs in the workflow recordings viewer (from chat). The target is Pango/Scribe-like action timelines with reliable pre-screenshots and post-screenshots for every meaningful action, including navigation and tab-switching; Kevin explicitly requested accurate pre/post screenshots and screenshots for navigation/tab switches (from chat). The current implementation likely has a coverage gap because instruction-style steps such as tab switches are skipped by the normal screenshot path while navigation uses custom post-screenshot logic (from chat).", "+Session recording currently captures browser events in extension content scripts, coalesces them into steps in the extension background recorder, uploads screenshot/DOM assets, stores workflow recording rows and steps on the dashboard API, and renders playback from signed asset URLs in the workflow recordings viewer (from chat). The target is Pango/Scribe-like action timelines with reliable pre-screenshots and post-screenshots for every meaningful action, including navigation and tab-switching; Kevin explicitly requested accurate pre/post screenshots and screenshots for navigation/tab switches (from chat). The current implementation had a coverage/race concern around screenshot capture and ordering; Kevin chose the smaller fix PR first rather than a broader recording state-management refactor, and PR #1107 was posted/tested on Jul 11 with pre/post screenshot persistence, ordering/dedup adjustments, scroll/new-tab/navigation coverage, and a follow-on note about pre-existing Excel keyboard-event grouping (from Slack + code).", " ", " Integrations and customer contexts remain active. Dex MCP OAuth supports Dynamic Client Registration through its OAuth provider; Mercury MCP registration is `POST https://mcp.mercury.com/register`, with production callback `https://app.joindex.com/api/oauth/callback` and staging callback `https://app.getdexterity.com/api/oauth/callback` (from chat). Dex currently stores user OAuth tokens and DCR client registration credentials in the same per-user/per-MCP-server auth row shape, even though user tokens and client credentials are different things (from chat). Customer/project contexts include Jivaro/Jordan Levin tied to Bullhorn integration and API/admin-access blockers, Chatbase/Humphrey/Yasser/Zeyad tied to GTM prompt packs and activation, and Daniel Wang/Abundant as a recurring account with many bugs and requests that can affect engineering/support work (from chat).", " ", " - **External Claude Code control:** The target is coordinating users’ already-open Claude Code sessions from Dex, likely through plugin/sidecar/control-plane patterns, but Claude Code Channels, Agent SDK, hooks, transcript syncing, MCP, headless mode, PTY/tmux control, plugins/sidecars, comparable apps, and mechanism limits still need verification (from chat).", " - **Nexus entity data integrity:** In branch `tim/nexus-prd-ui`, saving a Nexus entity type can turn built-in fields into custom fields because `builtIn` is dropped and the store deletes/reinserts non-built-ins; this is open until fixed (from chat).", " - **Production backfill behavior:** Kevin asked the user to check Dex production backfill behavior after Gmail/Slack connection (from chat).", "-- **Branch deployment automation:** The user wants a fully automated branch deployment/undeployment system with per-branch staging/preview deployments, master deployed to staging, and production manual/on-demand only (from chat).", "+- **Branch deployment automation:** The user wants a fully automated branch deployment/undeployment system with per-branch staging/preview deployments, master deployed to staging, and production manual/on-demand only (from chat). On Jul 12, the staging discussion narrowed to a proper staging environment as a validation gate for the full stack — OAuth redirects, Redis, Supabase, Trigger.dev jobs/schedules, migrations, and exact promoted builds — with later per-branch deployments, extension env switching, and Chris’s concern that staging needs a testing policy to avoid bottlenecks (from Slack).", " ", " ## WATCHING", " "]}], "recordsTotal": 2, "knowledge": [["2026-07-14", "fact", "", "For Dex’s AQ/Varun pilot, Regina Lin specified that Slack-driven CRM updates must work in real time and understand nuanced long customer threads through conversation history and the context system; a naive related-message lookup is insufficient. The Slack approval DM flow is acceptable for the current version, while approval timing and ownership still need clarification."], ["2026-07-14", "fact", "", "Dex has a recurring reasoning-toggle/browser reliability issue. As of July 14, 2026, Regina reported that reasoning was still enabled in every new chat despite a promised fix, making Dex slow and hurting demos; Timur said he would disable it within about an hour and make it off by default in the next extension release. No Linear ticket was found in the July 2026 reliability sweep."], ["2026-07-14", "fact", "", "For Dex’s AQ/Varun pilot, Regina Lin said the current demo is too naive for 300+ message customer threads and must use nuanced context from knowledge files and conversation history rather than a simple related-message lookup. The team needs to align the pilot before more implementation and clarify whether it should remain an automation or move to a real-time Slack app/webhook, including approval timing."], ["2026-07-14", "fact", "", "As of July 14, 2026, Dex’s reasoning-toggle behavior was partially fixed: the first fix was merged to default reasoning off, but the intended behavior is that reasoning may persist within a chat while every new chat resets it off. The follow-up implementation and extension release still need confirmation; the UI/model selector also waits on the new extension."], ["2026-07-13", "fact", "", "For the AQ/Varun pilot, the automation must understand long customer conversations and nuance using the context system, knowledge files, and conversation history; the current naive related-message lookup is insufficient, and real-time Slack ingestion through a Slack app or webhook is desired."], ["2026-07-13", "fact", "", "For the AQ/Varun pilot, Regina accepted the Slack approval DM flow for V1, but production must understand long customer threads and prior context through the context system, knowledge files, and conversation history; the naive related-message lookup is insufficient. Real-time Slack ingestion via an app or webhook is desired, and approval timing and ownership still need clarification."], ["2026-07-13", "source", "", "Slack #automation-alerts reported repeated production automation failures on Jul 13, 2026: <code>pipeline-v2-sync-integration</code> failed roughly every 30 minutes from 04:02–14:07 UTC, with additional <code>continuous-index</code> and <code>execute-automation</code> failures. Dex reported production error batches of 17, then 4 and 2 observations from 13:10–14:00 UTC; automation UUID <code>90a120e9-9d72-46e7-b681-cab463e163b6</code> recurred across consecutive runs. No resolution or owner response was visible, leaving an open question whether the failure loop remained active. Sources: C0B3HNG9X8U:1783915331.369639, C0B3HNG9X8U:1783951347.446969, C0B3HNG9X8U:1783951665.940639, C0B3HNG9X8U:1783948241.805449, C0B3HNG9X8U:1783950026.025489, C0B3HNG9X8U:1783951253.909459."], ["2026-07-13", "source", "", "Slack #automation-alerts reported that the production automation failure loop continued on Jul 13, 2026: <code>pipeline-v2-sync-integration</code> failed roughly every 30 minutes through 15:02 UTC, with new failures at 14:32 and 15:02; no owner response or resolution was visible. Dex production error batches continued from 13:10–15:10 UTC, with the latest batch containing 2 errors. Automation UUID <code>ff16bc87-bb40-42be-b6b1-fe4ab7fe70b2</code> reappeared across the 13:10 and 15:10 batches, indicating a recurring failure rather than a one-off. Sources: C0B3HNG9X8U:1783953144.228019, C0B3HNG9X8U:1783954948.208739, C0B3HNG9X8U:1783948241.805449, C0B3HNG9X8U:1783955436.469499."], ["2026-07-13", "source", "", "Slack #automation-alerts reported that the production automation failure loop continued escalating on Jul 13, 2026: <code>pipeline-v2-sync-integration</code> failed roughly every 30 minutes through 16:15 UTC, with additional failures after 15:02; an 11-error batch affected seven automations, and another <code>execute-automation</code> failure was reported. No owner response or resolution was visible. Dex production error batches also continued, with recurring failures including automation UUID <code>ff16bc87-bb40-42be-b6b1-fe4ab7fe70b2</code>. Sources: C0B3HNG9X8U:1783953144.228019, C0B3HNG9X8U:1783954948.208739, C0B3HNG9X8U:1783948241.805449, C0B3HNG9X8U:1783955436.469499, C0B3HNG9X8U:1783956701.034999, C0B3HNG9X8U:1783959037.720309, C0B3HNG9X8U:1783959353.500889"], ["2026-07-13", "source", "", "Slack #automation-alerts reported that the production automation failure loop continued escalating on Jul 13, 2026: <code>pipeline-v2-sync-integration</code> failed roughly every 30 minutes through 16:15 UTC, with additional failures after 15:02; an 11-error batch affected seven automations, and another <code>execute-automation</code> failure was reported. No owner response or resolution was visible. Dex production error batches also continued, with recurring failures including automation UUID <code>ff16bc87-bb40-42be-b6b1-fe4ab7fe70b2</code>. Sources: C0B3HNG9X8U:1783953144.228019, C0B3HNG9X8U:1783954948.208739, C0B3HNG9X8U:1783948241.805449, C0B3HNG9X8U:1783955436.469499, C0B3HNG9X8U:1783956701.034999, C0B3HNG9X8U:1783959037.720309, C0B3HNG9X8U:1783959353.500889"], ["2026-07-10", "fact", "8", "Dex has a tool-call reliability issue involving frequent first-tool-call failures or refires before eventual success. Slack reports suspected that Claude/Anthropic strict-schema handling may allow schema-like but invalid JSON, such as a string where an array is expected, triggering Dex's repair or retry path. A Jun 2–3, 2026 engineering thread records Timur proposing this hypothesis and Kevin responding positively: https://thirdlayerai.slack.com/archives/C08V9QFCLLB/p1780431339796329. Successful repairs are difficult to count from LangSmith because <code>experimental_repairToolCall</code> runs inside the AI SDK parse-failure path and may appear only as final repaired calls; a sampled check found no explicit repair/refire errors in 500 root traces and 1,306 LLM runs, with one ambiguous repeated <code>toolSearch</code> call."], ["2026-07-10", "fact", "8", "As of July 2026, Dex’s intended new-user onboarding flow is login → tell us about you → how will you use Dex → schedule call → start trial; going straight to the pricing page after login is not intended. Dex does not need 2FA in its main onboarding or current waitlist-removal onboarding flow, and onboarding should not preview real Gmail, Calendar, Context Engine, or Nexus data before the card because sync latency and edge cases are risky; use strong copy plus a GIF or looping animation instead."], ["2026-07-10", "fact", "8", "Dex must migrate away from Gemini 2.5 Flash and Flash-Lite before their October 16, 2026 retirement. Timur opened fallback/migration PR #1106 after a July 9, 2026 Google-side Gemini 2.5 Flash outage and is keeping it open pending target-task benchmarks because replacement 3.1 models have material cost/quality tradeoffs. Source: Slack #engineering thread C08V9QFCLLB:1783624073.182329 on July 9, 2026."], ["2026-07-09", "fact", "8", "Dex had recurring automation chat-noise and chat-scale platform debt: automations can create empty/spam chats or one-chat-per-email explosions, as in PRD-334 and Jules/PRD-446. The Jules disappearance was diagnosed as a scale/loading failure rather than deleted data after hourly automations created roughly 3,000 chats / 60–70 per day and backend chat loading had no limits. PRD-446 was completed as a temporary cap/limit hotfix. GitHub showed that PRD-448 / PR #1088 real extension chat-list pagination was still open as of Jul 7, 2026 despite Linear/Slack looking done-ish. PR #1099 restored legacy <code>/api/runs</code> and <code>/api/automations</code> proxy routes for pre-v3.62 extensions, and PR #1100 added request-level tRPC logging with path and user ID for debuggability; together they were compatibility/debuggability mitigations rather than a proven customer fix without extension-side/client data. Related platform debt includes deciding one chat per automation versus per tick, filtering automation chats, improving table/view relation code, and adding changelog or Attio-style traces."], ["2026-07-09", "fact", "8", "Dex has a partially tracked product reliability/observability gap around silent or confusing tool, integration, and automation failures: users can struggle to tell whether actions failed, automations ran/failed/skipped, where outputs went, or why integrations appear connected/enabled while Drive, Notion, Linear, Slack, Pipedream tools/triggers/connections/sources are effectively broken. Failures such as machine-too-small, OAuth/reauth problems, task-not-triggered, missing triggers, or broken automation state should surface visible alerts/statuses and navigation to the relevant automation, skill, or knowledge output. A strong proposed feature is Automation Health/Reconciliation comparing DB enabled state, OAuth state, Pipedream trigger state, and last enqueue/run, with statuses such as healthy, broken, needs reauth, or trigger missing; this is partly covered by PRD-251, broadly tracked under PRD-379, and not cleanly owned."], ["2026-07-09", "fact", "6", "Dex has a recurring reasoning-toggle/browser reliability issue where the reasoning toggle can turn itself on in new chats and the browser can lag or glitch; Regina reported the reasoning-toggle bug in engineering and bugs/fails Slack channels, and a fix was claimed or pending, but no Linear ticket was found in the July 2026 reliability sweep."], ["2026-07-09", "fact", "8", "PRD-439 / the Dex automation notification/approval flow is active and in progress; the next decision is to finish it or explicitly park it. Its notifications/approvals / “Needs You” / Inbox UX is for reviewing and approving concrete Dex-prepared draft outputs or tool actions after Dex has already run the prompt—such as exact Slack/email message text, email fields, or write/edit/delete payloads—not for approving task prompts or assignments. Task/prompt assignment belongs in chat or a separate task-management surface, AI iteration inside approvals remains open, and Graem later said the Inbox prototype and Form fields pages are temporary and will not be in sidebar nav. Sources include Regina Lin in Slack #product-design thread C09F1G827LJ:1783413313.571809 on Jul 8, 2026, an earlier Jul 7 clarification that suggested-prompt previews should already have run before approval, plus #product-design C09F1G827LJ:1783529770.217969 and C09F1G827LJ:1783566722.373829."], ["2026-07-09", "fact", "7", "Dex session recording currently captures browser events in extension content scripts, coalesces them into steps in the extension background recorder, uploads screenshot/DOM assets, stores workflow recording rows and steps on the dashboard API, and renders playback from signed asset URLs in the workflow recordings viewer."], ["2026-07-08", "fact", "7", "Dex has an existing Agent Intel automation: the <code>agent intel sweep</code> runs daily and is enabled; there is also a separate enabled daily <code>Dex agent</code> slice automation."], ["2026-07-07", "fact", "7", "Dex recurring email automations have had an unbounded-scan reliability issue where too much inbox history can be fetched, causing timeouts, stale work, or duplicate work; PRD-302 / DEX-80 looked “done but not done.”"], ["2026-07-07", "fact", "6", "Dex had model-selector reliability issues, including GPT-5.5 selector breakage or disappearing UI, tracked around Linear PRD-440, PRD-451, and PRD-343; team updates indicated these were mostly fixed or merged as of the July 2026 reliability sweep."], ["2026-07-06", "fact", "8", "Dex has an open customer/integration loop for Gmail and PDF attachment reading: multiple customers need Dex to read PDF or email attachments, tracked under PRD-161 and CUS-32."], ["2026-07-06", "fact", "7", "Dex has an open Slack channel/context selection bug: Dex can get confused about which Slack channel to use because the channel directory lives in memory versus skills and multiple Slack skills can conflict; this is tracked under CUS-74 / PRD-280."], ["2026-07-06", "fact", "7", "Dex has an open approvals bug where accept-all approvals works for calendar-style flows but not for Gmail or bulk tasks such as large email batches; this is tracked under DEX-22."], ["2026-07-06", "fact", "6", "Dex Slack bot is internal-workspace-only as of Jul 6, 2026; Chris Moon said it should not be included in the user newsletter yet."], ["2026-07-05", "directive", "8", "Dex SDK v1 should be framed as a company-context API or context layer for agents and internal tools, not a read-only query SDK: preserve Dex’s capture → consolidate → recall loop with a write path such as <code>context.add</code>/<code>remember</code>; include tenancy/scope concepts such as <code>subject</code>, <code>scopes</code>, <code>namespace</code>, or <code>tenant</code> in the first request shape because Dex context is inherently multitenant and must support whitelabel and shared-team contexts; keep citations/provenance by default, source filters, timeline/entity reads, typed errors, retries, request IDs, and testing mocks as table-stakes SDK UX; and exclude <code>chat.*</code>, <code>automations.*</code>, and <code>webhooks.*</code> from the MVP because those are likely scope creep or require event semantics outside the core context SDK."], ["2026-07-05", "directive", "7", "Dirac/Pierre is not confirmed as the user's own work or terminology and should not be attributed to them without verification; treat “Dirac” as memory/automation terminology for the Dex hash-anchored observation-diffs/content-addressed sync protocol idea unless the user confirms otherwise."], ["2026-07-05", "directive", "8", "Dex needs a native TypeScript deterministic stateful-agent eval/regression harness adapted from Letta-style ideas, focused on real bug-derived regression fixtures rather than copying Letta or using a Python-first, LLM-judge-first, or huge benchmark-suite approach. It should use declarative suites, JSONL/CSV datasets, real agent execution, trajectory capture, extractor/grader separation, memory/tool-state extractors, cached trajectory regrading, multi-run consistency checks, CI gates, and potentially LLM or agent judges and portable packaging across extension, desktop, Slack bot, and API surfaces. Coverage should include trajectory correctness, tool/state side effects, memory/context behavior, automation/browser safety, proactive context assembly for skills/memory/files before answering, latency/caching for context assembly, eval/self-correction loops, plan-and-execute orchestration, multi-model routing, human-in-the-loop approval queues, tool discovery and availability failures across toolSearch, Slack MCP, Gmail, browser, and automation gating flows, malformed agent-loop state regressions, and tool failure or false-success behavior. A key context-usage track should teach and evaluate when agents should use prefetched memory/wiki/skills, when to search deeper, and when to ignore stale or irrelevant retrieval, rather than focusing only on retrieval or prefetch."], ["2026-07-04", "fact", "7", "Dex’s MCP OAuth flow supports Dynamic Client Registration via its OAuth provider. For Mercury MCP OAuth, Mercury supports Dynamic Client Registration at <code>POST https://mcp.mercury.com/register</code>: Dex registers itself with a client name and the current environment’s OAuth callback URL, and Mercury returns a <code>client_id</code> and <code>client_secret</code> for the normal OAuth flow. Dex’s production app domain is <code>https://app.joindex.com</code> with callback <code>https://app.joindex.com/api/oauth/callback</code>; Dex’s staging app domain is <code>https://app.getdexterity.com</code> with callback <code>https://app.getdexterity.com/api/oauth/callback</code>. Local callback URLs are not useful for real Mercury registration. Dex stores user OAuth tokens and DCR client registration credentials in the same per-user/per-MCP-server auth row shape, but they are different things: user tokens are <code>access_token</code>/<code>refresh_token</code>/<code>scope</code>, while DCR client registration credentials are <code>client_id</code> and <code>client_metadata.client_secret</code>; DCR client credentials are currently stored per user and MCP server rather than as a shared app-level/environment-level registration."], ["2026-07-03", "directive", "7", "For arden/Dex/provider-agnostic tool-search deferral, frame the architecture around mechanisms rather than Anthropic-versus-OpenAI implementations: native provider deferral where supported; Dex-managed request-side active-tool projection where tool search selects deferred tools and the next model step receives matched real tool schemas; stable proxy/bridge tools such as <code>tool_search</code>, <code>tool_describe</code>, and <code>tool_call</code>, dispatched and validated app-side; and MCP-style filtering of <code>tools/list</code> or server responses before the model request. Anthropic can use native <code>defer_loading</code>/tool-reference expansion. OpenAI Responses supports native <code>tool_search</code> plus <code>defer_loading</code> for functions/namespaces/MCP, and Codex uses this native OpenAI loading format with client-side BM25-style tool metadata search returning loadable tool specs as <code>tool_search_output</code>. For Dex fallback paths without native structured deferral, prefer active-tool projection over a generic <code>tool_call</code> bridge unless the provider/runtime cannot mutate the tool list between model steps. Hermes-agent is an example of the stable bridge/proxy pattern rather than native provider deferral: it exposes generic bridge tools such as <code>tool_search</code>, <code>tool_describe</code>, and <code>tool_call</code> in the formal tools list; <code>tool_describe</code> returns real tool schemas in message history; and Hermes unwraps <code>tool_call(name, arguments)</code> server-side while preserving scope checks, hooks, and approvals. This keeps the top-level provider tools array stable but sacrifices provider-native per-tool schema enforcement because the model calls a generic <code>tool_call</code> tool and the application must validate and dispatch it. Arden's deferred tools middleware uses the same append-only loaded-tools tradeoff as Dex-managed deferred loading: it rebuilds visible tools as always-visible plus loaded tools, so each distinct load event changes the request <code>tools</code> array and can invalidate/reset provider prefix caches for tools, system, and messages until the loaded set stabilizes. This trades occasional full-prefix reprocessing for a smaller upfront prompt, while native server-side deferral is the only path that preserves the tools array and avoids both costs. Real schema-constrained tool calls in vLLM/open-source-style tool calling still require selected tools to be present in the request. A likely clearer refactor is to collapse or rename around mechanisms: keep or merge the pure keyword search engine depending on test value, combine deferral-strategy and deferred-loading into one deferred-tools module, and rename vague custom strategy language to request-side, emulated, or Dex-managed loading."], ["2026-07-03", "fact", "7", "Dex has an open Google Docs tooling request from Regina to restore/add Docs table insertion and formatting support; Regina clarified that email formatting should be ignored for now and the immediate need is Docs tables. Reported Docs tooling regressions include table creation, table formatting, replace-text, duplicated Docs tools, and style parameters not taking effect, so the table implementation should avoid depending on flaky existing format-text or replace-text behavior unless verified."], ["2026-07-03", "fact", "8", "Dex AI SDK/Bedrock reasoning replay research concerns a reasoning-boundary/channel-contamination bug: user-facing assistant/action prose is sometimes returned and persisted as provider-declared reasoning, with evidence of widespread <code>&lt;thinking&gt;</code> leakage in assistant turns and captured model requests, polluted-context examples proving answer-like assistant prose can be stored as provider-signed reasoning, and clean first-seed evidence where tag-bearing assistant output occurred while matching captured request traces had zero tag-bearing reasoning/text parts. Replay contamination is proven but not the only possible seed mechanism: existing fresh repro harnesses with signed reasoning did not reproduce tag/prose leakage across multiple 40-run tests, and corrected replay tests from a saved polluted step request preserved reasoning <code>providerOptions</code> but did not deterministically reproduce the target prose as new reasoning output. The root cause remains unproven; do not claim tag leakage, <code>smoothStream</code>, metadata namespace, provider/model misclassification, Dex message splitting, or saved request replay as the fix/root cause without side-by-side replay proof and raw provider/stream evidence. Durable evidence artifacts include the note “AI SDK Bedrock reasoning replay evidence - 2026-06-04” and the Obsidian evidence-only audit <code>Dex/Research/Thinking leakage evidence audit - 2026-06-08.md</code>. Bedrock/Anthropic extended thinking with tool use requires replaying exact signed reasoning/thinking blocks with signatures in order; Dex should preserve provider-native signed reasoning separately from UI/debug reasoning, preserve providerMetadata signatures, and only replay signed native reasoning. Dex appears to use the <code>@ai-sdk/amazon-bedrock/anthropic</code> subpath, which may explain why streamed reasoning metadata is persisted under an Anthropic namespace even though replay provider options may be keyed as Bedrock. Dex <code>llm_request_traces</code> stores one row per run with last-write-wins behavior, so multi-step examples can show only a final-step polluted request snapshot; clean-seed examples with <code>step_index=0</code> are not weakened by this caveat, while step-level exactness for multi-step cases depends on LangSmith spans. Upstream AI SDK issues such as <code>#11689</code> may be cited only as related reasoning-metadata handling evidence, not as proof of Dex’s tag/text-in-reasoning cause. Current suspicious input-shape evidence is that all five examined final-reasoning-only spans occurred immediately after a tool result, used extended thinking, contained prior replayed reasoning, and had earlier tag contamination somewhere in the input; Dex legacy conversion can split assistant reasoning/text and tool calls into separate assistant messages unlike the AI SDK grouped assistant-message shape, but side-by-side replay batches comparing exact split inputs, grouped assistant/tool-call inputs, and no-prior-reasoning variants did not reproduce final reasoning-only output, with 0/47 replay calls ending with reasoning. The evidence standard for the investigation is an evidence table with confirmed / not confirmed / unknown states plus side-by-side replay tests. The next proof work should add instrumentation that logs when the final step’s last content block is reasoning, captures the exact input, captures AI SDK pre/post-stream parts, ideally captures raw Bedrock converted events, and immediately runs grouped/no-reasoning controls from that exact occurrence."], ["2026-07-03", "fact", "6", "For Dex, SkillOpt and SkillLens are relevant patterns for a practical “Skill Lab”: collect task traces and outcomes, evaluate current skills against candidate skills, run SkillLens-style baseline-vs-skill metrics to detect when skills help or hurt, optionally apply SkillOpt-style validation-gated skill edits, and publish or roll back only when held-out validation improves. The main implementation complexity is reliable traces, scoring labels, train/validation splits, rollback/versioning, safety checks, and model- or workspace-specific negative-transfer detection, not the Markdown skill artifact itself."], ["2026-07-03", "fact", "8", "Dex Bedrock Anthropic tool-schema handling has two separate schema-compatibility constraints: PRD-341 fixed provider-facing Zod-derived schemas by sanitizing only the outgoing Bedrock request-body copy, stripping unsupported constraints such as min/max lengths/items, numeric limits, patterns, unsupported formats, uniqueItems, and non-false additionalProperties while preserving app-side Zod validation and moving constraints into descriptions; Bedrock Anthropic also requires every tool input schema to have a top-level object type, so root anyOf/oneOf/discriminated-union-style schemas can fail before model execution with errors such as “input_schema.type: Field required.” Dex’s custom <code>bedrockAnthropic</code> wrapper mutates/sanitizes outgoing request bodies by mapping tool schemas and Anthropic beta settings before Bedrock signing; current code evidence does not show the wrapper inserting thinking tags or rewriting messages, and does not confirm that the custom Bedrock sanitizer causes reasoning-tag leakage. The broader root-object Bedrock bug class remains real, but the PRD-325 claim that Dex’s integration-suggest_mcp currently breaks Bedrock because it is a root discriminated union appears stale because the inspected current code uses a root object schema with strict validation and superRefine rather than a root discriminated union."], ["2026-07-03", "fact", "8", "For Dex support of external Claude Code/agent harnesses, the target direction is commanding or coordinating users' already-open live Claude Code sessions from Dex, likely through a user-installed plugin, sidecar, or control-plane pattern rather than a headless Claude Code CLI/SDK runner. The proposed integration shape is: Channels for Dex-to-Claude Code commands/events, hooks plus transcript syncing for Claude Code-to-Dex observability/telemetry, and MCP tools for Claude Code access to Dex context and actions. Claude Agent SDK may still be useful for Dex-launched headless Claude-Code-like workers, but open research remains to verify Claude Code Channels, Claude Agent SDK, hooks, transcript syncing, MCP, headless mode, PTY/tmux control, plugins/sidecars, comparable products/apps, and the roles and limits of each mechanism before treating this as a stable source-backed architecture recommendation."], ["2026-07-03", "directive", "", "For Dex support of external Claude Code/agent harnesses, the target direction is commanding or coordinating users' already-open live Claude Code sessions from Dex, likely through a user-installed plugin, sidecar, or control-plane pattern rather than a headless Claude Code CLI/SDK runner. The proposed integration shape is: Channels for Dex-to-Claude Code commands/events, hooks plus transcript syncing for Claude Code-to-Dex observability/telemetry, and MCP tools for Claude Code access to Dex context and actions. Claude Agent SDK may still be useful for Dex-launched headless Claude-Code-like workers, but open research remains to verify Claude Code Channels, Claude Agent SDK, hooks, transcript syncing, MCP, headless mode, PTY/tmux control, plugins/sidecars, comparable products/apps, and the roles and limits of each mechanism before treating this as a stable source-backed architecture recommendation."], ["2026-07-03", "directive", "", "Dex should target commanding or coordinating users' already-open live Claude Code sessions through supported extension points, likely via a user-installed plugin, sidecar, or control-plane pattern—not a headless Claude Code CLI/SDK runner. The proposed integration shape is Channels for Dex-to-Claude Code commands/events, hooks plus transcript syncing for Claude Code-to-Dex observability and telemetry, and MCP tools for Claude Code access to Dex context and actions. Claude Agent SDK may still support Dex-launched headless Claude-Code-like workers. Describe this as “near-full control through Claude Code’s supported extension points,” not raw god-mode: Dex cannot directly mutate hidden Claude state, guarantee delivery without plugin acknowledgements, control closed sessions, bypass permissions, or safely approve dangerous actions without explicit policy. Keep verifying Claude Code Channels, Claude Agent SDK, hooks, transcript syncing, MCP, headless mode, PTY/tmux control, plugins/sidecars, comparable products/apps, and the roles and limits of each mechanism before treating the architecture as stable and source-backed."], ["2026-07-02", "fact", "7", "In Dex branch <code>tim/nexus-prd-ui</code>, saving a Nexus entity type can turn built-in fields into custom fields because the UI drops <code>builtIn</code>, the server defaults missing <code>builtIn</code> to false, and the store deletes/reinserts all non-built-ins; this is an open UX/data-integrity bug until fixed."], ["2026-07-02", "fact", "5", "Dex's shared models metadata exists so the extension can use frontend-safe model picker data without importing core backend provider code or SDKs; a possible clearer naming boundary is picker-models for the frontend contract versus provider registry for backend runtime config, with tests keeping keys in sync."], ["2026-07-02", "source", "4", "Slack source pointer for Kevin's Dex tool-search deferral PR review thread: https://thirdlayerai.slack.com/archives/C08V9QFCLLB/p1781461692414919."], ["2026-07-02", "fact", "7", "Dex Knowledge Base deletion enforcement is implemented in the shared file-system path utilities, the agent <code>file_delete</code> tool, the dashboard/API <code>deleteFile</code> path, and the Pipeline-v2 Pierre delete tool; protected deletes should return a clear <code>Cannot delete protected Knowledge Base file: &lt;path&gt;</code> error."], ["2026-07-02", "source", "6", "Kevin asked the user to check Dex production backfill behavior after Gmail/Slack connection; the relevant Slack thread is https://thirdlayerai.slack.com/archives/C08V9QFCLLB/p1781431806180489."], ["2026-07-02", "source", "6", "Dex backfill and sync scheduling semantics can be checked in the Context Engine and pipeline-v2 code paths, especially <code>context-engine.ts</code>, <code>sync-integration.ts</code>, <code>backfill-context.ts</code>, <code>schedule-syncs.ts</code>, and <code>contextEngineConfig.ts</code>."], ["2026-07-02", "fact", "7", "Dex PRD-407 is the user's model selector plus tool-search workstream: Regina asked the user to help Kevin scope the model selector, Kevin asked the user to research/scope tool search for OpenAI and other models, and the user prepared a scoping document at <code>./tasks/prd-407/scoping.html</code> for claim verification."], ["2026-07-02", "source", "7", "Slack source pointers for Serova/Dex CRM provenance and scoping: Kevin said Timur owns the Serova project and that it is high priority; Regina asked Lily to watch the Serova Notion video and write up columns/features; the requirements thread includes scalable project, docs, database, task, operational-change/work-log, and patient CRM tracking because Notion is messy; Regina clarified that the Serova requirements document summarizes the customer-channel Serova messages; the requirements document was shared in #engineering; there is a Slack mention of Serova CRM setup; and a Slack engineering thread about Nexus/CRM usability and missing core features is a source for the Dex CRM v0 scoping discussion. Links: https://thirdlayerai.slack.com/archives/C08V9QFCLLB/p1782367101822279 ; https://thirdlayerai.slack.com/archives/C0A3SE8EK54/p1782152694455049 ; https://thirdlayerai.slack.com/archives/C08V9QFCLLB/p1782337855475599?thread_ts=1782337855.475599&amp;cid=C08V9QFCLLB ; https://thirdlayerai.slack.com/archives/C08V9QFCLLB/p1782320624342529 ; https://thirdlayerai.slack.com/archives/C08V9QFCLLB/p1781917090988879 ; https://thirdlayerai.slack.com/archives/C08V9QFCLLB/p1781218032727499"], ["2026-07-02", "fact", "8", "A recurring team-facing bug in the extension/chat UI is that Vercel Bot Protection can return a “We’re verifying your browser” Security Checkpoint HTML page for API routes such as chat, chat queue, or tRPC; the frontend then displays raw HTML or fails JSON parsing instead of showing a clean error. The durable fix is to bypass or relax Vercel Bot Protection/WAF for trusted API routes and to make the extension request/error layer detect HTML or security-checkpoint responses before setting UI errors or parsing JSON."], ["2026-07-02", "directive", "6", "For Dex skills work, Kevin asked to research HermesAgent source code for how it fires off <code>SKILL</code> updates every N user queries, research Viktor's criteria for saving something as a skill and injecting it into its harness, and add a Dex system prompt for skill use. The research takeaway was to copy Claude/Agent Skills-style progressive disclosure, Hermes-style post-turn skill/memory review nudges after complex workflows/corrections/repeated tool use, and Letta-style separation between tiny always-on core memory and larger retrievable memory, while using Dex's existing <code>.agent/skills/&lt;name&gt;/SKILL.md</code> structure instead of introducing a new skill-management primitive."], ["2026-07-02", "source", "6", "For Dex harness research, local sources checked included HermesAgent, claude-code-leaked, Letta, and relevant Dex code; related web research covered Anthropic Agent Skills-style progressive disclosure, Claude Code project memory/context ideas, and Letta core-versus-archival memory concepts."], ["2026-07-02", "fact", "6", "Dex request-trace capture records assembled AI SDK <code>args.params</code> before the provider request and attaches it alongside caching middleware, so <code>llm_request_traces.request</code> is useful as “what Dex gave AI SDK,” not as the raw HTTP body sent to the provider."], ["2026-07-02", "directive", "7", "For the Dex reasoning-boundary investigation, when the task is to find contaminated traces, use the literal structural condition that the LLM/assistant output's last real content block is <code>reasoning</code> (for example, <code>last(content).type === reasoning</code>); do not add classifiers or broaden the task into causal theories unless separately requested."], ["2026-07-02", "directive", "9", "Dex/arden automation and todo architecture should keep provider responsibilities separated: Pipedream handles external app auth/connections and event ingress/triggers; Dex code owns product/domain truth, automation definitions, authoritative per-turn or per-session todo state, state, invariants, dispatch decisions, and the automation pipeline; Trigger.dev handles durable job execution such as queues, retries, schedules, delayed runs, concurrency, and run reconciliation. Todos should be first-class structured runtime state rather than reconstructed from transcript <code>todo_write</code> history: store todos as real state, emit small typed todo/plan update events tied to turns, have the UI maintain the live todo list, prefer full-list replacement over fragile merge semantics, validate invariants such as one <code>in_progress</code> item and valid statuses/IDs, avoid repeating full todo lists into model context, and re-enable the custom TodoDisplay after the state model is fixed so todos remain durable context anchors without flooding model context."], ["2026-07-02", "fact", "8", "For Dex, “rehydration state” means small structured runtime state that must survive when old chat messages are summarized or deleted, such as pending approvals, background tasks, active plans or todos, active loops/automations, browser targets, and tool-result artifacts."], ["2026-07-02", "fact", "6", "The likely Dex fix for the Gmail archive-vs-unread bug is to expose a bulk remove-label or bulk mark-read tool, or extend bulk archive with an explicit option that removes both <code>INBOX</code> and <code>UNREAD</code> using Gmail <code>batchModify</code>; tool descriptions should state that archiving removes <code>INBOX</code>, not <code>UNREAD</code>, and that inbox-zero with unread-count reduction requires removing both labels."], ["2026-07-02", "directive", "7", "Dex email triage has a broader agent-behavior problem beyond the Gmail <code>UNREAD</code> label bug: for bulk email cleanup, the agent should group, analyze, label, explain counts, and verify state before mass actions, and should stop and explain when results look stale/repeated or an operation aborts instead of improvising."], ["2026-07-02", "fact", "8", "Dex Gmail search performance work should honor <code>includeFullMessages</code>: use <code>format=metadata</code> by default with only useful headers such as From, To, Subject, and Date, defer body reads to a message/thread read tool, and use <code>format=full</code> only when full messages are requested. To avoid Gmail 429s, detail fetches should use sequential HTTP multipart batch <code>messages.get</code> requests, starting around batch size 10, with retry/backoff around each batch, rather than <code>Promise.all</code> concurrency or per-message serial retries. Dex PR #971 / branch <code>tim/prd-333-fix-prevent-email-triage-timeout-during-repeated-gmail</code> improves Gmail search by honoring <code>includeFullMessages</code> and using metadata/full formats appropriately, but currently fetches message details as 10-wide concurrent individual GETs. Pipedream's public Gmail component is a weak model because its search flow lists messages then fetches each message serially with generic retry; it does not expose or use <code>includeFullMessage(s)</code>, does not explicitly use Gmail <code>format=metadata</code>, does not use HTTP multipart batch reads, and only uses <code>Promise.all</code> for small new-message source/webhook-style fetches."], ["2026-07-02", "fact", "7", "For Dex deep-research harness work, Kevin’s intended shape is closer to recursive agent-as-tool research with a result ledger to avoid duplicate searches and prompt diversity across subagents, not necessarily a heavy “deep research” product clone."], ["2026-07-02",

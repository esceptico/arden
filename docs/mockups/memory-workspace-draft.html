neric platform. The MVP should answer Sam’s questions—“who should I talk to, why, and what happened recently?”—by combining VIP trader records, Telegram context, real DM examples, trade and activity history, trading volume, summaries, sentiment, churn and check-in prompts, manual fields, trustworthy provenance, and observable automation states. (from chat)</p><p>The implementation source of truth is Linear project “Nexus MVP: Custom Entities, Sources, and AI Views.” The intended product foundation includes records, activity timelines, custom fields and properties, pipelines and views, email and calendar sync, and automation observability, while AI-generated summaries, sentiment, churn risk, and next actions must expose clickable source, provenance, and reasoning visibility. (from chat)</p><p>Nexus graph work under PRD-408 is scoped to a readability and high-level visualization pass, not a primary-search or graph-product rebuild. The direction includes reducing visual noise through organized tree diagrams, zoom-aware or selectively displayed labels, filters for low-connection and orphan nodes, connection-based node sizing, and useful colors or tags. (from chat)</p><p>CRM research should benchmark Attio most heavily for modern object and schema UX, HubSpot for CRM completeness and integrated workflows, and Pipedrive for simple pipeline and action UX. Salesforce, Close, Folk, and Clay are secondary references for governance, sales execution, relationship CRM, and GTM data workflows. (from chat)</p><h2>Open loops</h2><ul><li><b>MVP implementation and acceptance testing</b> — Keep Linear current, confirm whether PRD-284 is complete, resolve questions about contact ownership, wallet ownership, HubSpot parallel-run duration, the Granola path, and the opt-in form revamp, then acceptance-test VIP import, wallet aggregation, Telegram last-contacted dates, churn/check-in prompts, and the weekday-digest fallback. (from chat)</li></ul><h2>Related</h2><ul><li><a class=\"wl\" data-open=\"topics/dex.md\">Dex</a> — Nexus is the CRM product being developed within the Dex context.</li></ul>", "records": [], "recordsTotal": 0, "knowledge": [["2026-07-05", "directive", "7", "For Dex/Nexus CRM v0, prioritize the Ostium VIP Contact CRM MVP over the broader generic Nexus platform while framing it around reusable CRM primitives rather than bespoke one-offs. The MVP should help Sam answer “who should I talk to, why, and what happened recently?” by combining VIP trader rows, Telegram context/timelines and real DM examples with expected outputs from Sam/Ostium, trade/activity history, trading volume, summaries, sentiment, churn/check-in prompts, inline/manual fields, loading/error/stale states for computed fields, bulk regeneration/refresh, clickable provenance/source/reasoning visibility for AI summaries, sentiment, churn risk, and next actions, plus trustworthy records, activity timelines, custom fields/properties, pipeline/views, email/calendar sync, and automation observability. Linear project “Nexus MVP: Custom Entities, Sources, and AI Views” is the source of truth for implementation state, and current MVP loops include keeping Linear current, confirming whether PRD-284 is done, resolving PRD questions around contact ownership, wallet ownership, HubSpot parallel-run duration, Granola path, and opt-in form revamp, and acceptance-testing VIP import, wallet aggregation, Telegram last-contacted dates, churn/check-in prompts, and weekday digest fallback."], ["2026-07-04", "directive", "7", "For PRD-408 Nexus graph work, treat Regina’s feedback as scoping the graph to a readability/high-level visualization pass rather than a primary-search or graph-product rebuild: make the graph less noisy with options such as cleaner organized tree diagrams if needed, zoom-aware labels, hidden labels by default or smart/core/all label modes, filters for low-connection/orphan nodes, node sizing by connection count, and colors/tags where useful; avoid clustering, saved presets, new backend/indexing work, command palette work, minimaps, marketplace-style features, or other expansions that would balloon the PR."], ["2026-07-02", "directive", "6", "For Dex/Nexus CRM research, benchmark hardest against Attio for modern object/schema UX, HubSpot for CRM completeness and all-in-one workflows, and Pipedrive for simple pipeline/action UX; Salesforce, Close, Folk, and Clay are useful secondary references for enterprise governance, sales execution, lightweight relationship CRM, and GTM data workflows respectively."]], "backlinks": [["index", "index.md", ["<mark>Nexus</mark> — Nexus is being developed as a reusable CRM platform, with the v0 priority narrowed to the Ostium VIP Contact CRM MVP …"]], ["me", "me.md", ["<mark>Nexus</mark> — A Dex CRM workstream currently focused on reusable CRM primitives and the Ostium VIP Contact CRM MVP. (from chat)"]], ["dex", "topics/dex.md", ["<mark>Nexus</mark> — Dex includes Nexus/entity/CRM work, including a built-in-field data-integrity bug and onboarding decisions around not previewin"]], ["arden", "topics/arden.md", ["<mark>Nexus</mark> — Nexus is part of the directory-browser reference point for arden’s file-backed memory UX (from chat)."]]], "outgoing": [["Dex", "topics/dex.md", "topics"]], "unlinked": [["2026-07-08", "daily/2026-07-08.md", "stray 2FA screen and use copy plus a GIF/animation instead of previewing real Gmail/Calendar/Context Engine/<mark>Nexus</mark> data, and approvals should confirm concrete drafted outputs/actions rather than prompts or task assignments ("], ["2026-07-05", "daily/2026-07-05.md", "Prioritized the Ostium VIP Contact CRM MVP for Dex/<mark>Nexus</mark>, with reusable CRM primitives and acceptance testing for VIP imports, wallet aggregation, Telegram activity,"], ["2026-07-04", "daily/2026-07-04.md", "Scoped PRD-408 <mark>Nexus</mark> graph work to a readability/high-level visualization pass—less noise, smarter labels/filters/sizing/colors wh"], ["2026-07-02", "daily/2026-07-02.md", "Advanced Dex product work across PRD-407 model selection and tool search, <mark>Nexus</mark> field-integrity bugs, Vercel security-checkpoint handling, Gmail triage and performance, Knowledge Base delet"]], "source": "---\ntype: topic\ntitle: Nexus\nupdated: 2026-07-12\n---\n\n# Nexus\n\n## What we know\n\nNexus is being developed as a reusable CRM platform, with the v0 priority narrowed to the Ostium VIP Contact CRM MVP rather than a broad generic platform. The MVP should answer Sam’s questions—“who should I talk to, why, and what happened recently?”—by combining VIP trader records, Telegram context, real DM examples, trade and activity history, trading volume, summaries, sentiment, churn and check-in prompts, manual fields, trustworthy provenance, and observable automation states. (from chat)\n\nThe implementation source of truth is Linear project “Nexus MVP: Custom Entities, Sources, and AI Views.” The intended product foundation includes records, activity timelines, custom fields and properties, pipelines and views, email and calendar sync, and automation observability, while AI-generated summaries, sentiment, churn risk, and next actions must expose clickable source, provenance, and reasoning visibility. (from chat)\n\nNexus graph work under PRD-408 is scoped to a readability and high-level visualization pass, not a primary-search or graph-product rebuild. The direction includes reducing visual noise through organized tree diagrams, zoom-aware or selectively displayed labels, filters for low-connection and orphan nodes, connection-based node sizing, and useful colors or tags. (from chat)\n\nCRM research should benchmark Attio most heavily for modern object and schema UX, HubSpot for CRM completeness and integrated workflows, and Pipedrive for simple pipeline and action UX. Salesforce, Close, Folk, and Clay are secondary references for governance, sales execution, relationship CRM, and GTM data workflows. (from chat)\n\n## Open loops\n\n- **MVP implementation and acceptance testing** — Keep Linear current, confirm whether PRD-284 is complete, resolve questions about contact ownership, wallet ownership, HubSpot parallel-run duration, the Granola path, and the opt-in form revamp, then acceptance-test VIP import, wallet aggregation, Telegram last-contacted dates, churn/check-in prompts, and the weekday-digest fallback. (from chat)\n\n## Related\n\n- [[Dex]] — Nexus is the CRM product being developed within the Dex context.\n", "body": "# Nexus\n\n## What we know\n\nNexus is being developed as a reusable CRM platform, with the v0 priority narrowed to the Ostium VIP Contact CRM MVP rather than a broad generic platform. The MVP should answer Sam’s questions—“who should I talk to, why, and what happened recently?”—by combining VIP trader records, Telegram context, real DM examples, trade and activity history, trading volume, summaries, sentiment, churn and check-in prompts, manual fields, trustworthy provenance, and observable automation states. (from chat)\n\nThe implementation source of truth is Linear project “Nexus MVP: Custom Entities, Sources, and AI Views.” The intended product foundation includes records, activity timelines, custom fields and properties, pipelines and views, email and calendar sync, and automation observability, while AI-generated summaries, sentiment, churn risk, and next actions must expose clickable source, provenance, and reasoning visibility. (from chat)\n\nNexus graph work under PRD-408 is scoped to a readability and high-level visualization pass, not a primary-search or graph-product rebuild. The direction includes reducing visual noise through organized tree diagrams, zoom-aware or selectively displayed labels, filters for low-connection and orphan nodes, connection-based node sizing, and useful colors or tags. (from chat)\n\nCRM research should benchmark Attio most heavily for modern object and schema UX, HubSpot for CRM completeness and integrated workflows, and Pipedrive for simple pipeline and action UX. Salesforce, Close, Folk, and Clay are secondary references for governance, sales execution, relationship CRM, and GTM data workflows. (from chat)\n\n## Open loops\n\n- **MVP implementation and acceptance testing** — Keep Linear current, confirm whether PRD-284 is complete, resolve questions about contact ownership, wallet ownership, HubSpot parallel-run duration, the Granola path, and the opt-in form revamp, then acceptance-test VIP import, wallet aggregation, Telegram last-contacted dates, churn/check-in prompts, and the weekday-digest fallback. (from chat)\n\n## Related\n\n- [[Dex]] — Nexus is the CRM product being developed within the Dex context.", "snippet": "Nexus is being developed as a reusable CRM platform, with the v0 priority narrowed to the Ostium VIP Contact CRM MVP rather than a broad generic platform. The MVP should…", "created": "2026-07-12", "modified": "2026-07-12", "home": false}, "topics/arden.md": {"title": "arden", "fm": {"type": "project", "title": "arden", "updated": "2026-07-13"}, "dir": "topics", "type": "project", "updated": "2026-07-13", "wide": false, "outline": [["What we know", 2], ["Watching", 2], ["Open loops", 2], ["Related", 2]], "prose": "<h2>What we know</h2><p>Arden is the user’s main personal-agent project and a credible &gt;20-hour/week MATS/application project, with the user reporting at least about 3 hours per day on it (from chat). For application framing, it can be presented as a long-horizon agent/memory testbed: a source-grounded assistant that retrieves, cites, remembers, schedules, and acts across personal data and tools while managing provenance, stale memory, over-retrieval, context loss, and approval/safety boundaries (from chat). It also supports the user’s O-1A/SF relocation narrative as a public open-source personal agent memory/context system, backed by the technical post at <code>timganiev.com/log/arden</code> and strengthened by GitHub metrics, demos/screenshots, a polished technical brief, and Kevin/ThirdLayer letters (from chat).</p><p>For the next 4–8 weeks, Arden should mostly stay in lightweight artifact-producing capture mode rather than becoming the main implementation push, because current Dex production work is stronger application/O-1A evidence and the user’s workload/health constraints make large speculative side-project pushes costly (from chat).</p><p>The product direction is a native agent workbench / personal AI control center: Raycast-fast, Linear-clean, Apple/Fluent-native, Cursor/Codex/Claude-agent-aware, and ChatGPT Canvas-capable (from chat). Chat is only one surface; the app should feel calm, dense, inspectable, keyboard-first, and provenance/permission-aware, with restrained glass/material used for chrome and transient controls rather than as a full app skin (from chat). The global command palette is the central interaction model, spanning memory search, agent runs, research, automations, tools, approvals, settings, workspaces, and sources (from chat). For visual design, avoid full-window delimiter lines and dated admin/forum separators; prefer Linear/Raycast/Cursor-like spacing, subtle background tier shifts, and short inset borders inside cards (from chat).</p><p>The current public surface is desktop-first: the TUI/CLI client surface, TUI app, TUI guide, CLI publish/CI workflows, and TUI recipes/references were removed (from chat). Public docs have been refreshed to match current app capabilities, with desktop-first language, current screenshots, Desktop and HTML widget guides, corrected webhook/runtime/memory/API wording, and coverage for goals, todos, background sessions, notifications, directives, loops, and wakeups (from chat). Public docs should stay short, polished, and user-facing, with deeper implementation notes separated into internal architecture docs (from chat).</p><p>arden’s memory direction is filesystem-backed, inspectable, and intentionally simpler than an idealized memory OS (from chat). The design keeps raw-ish append-only logs/artifacts or atomic records and retrieval/index layers separate from clean compiled human-readable wiki/filesystem projections for agent use (from chat). Memory v3 should expose directives/procedural context, curated project briefs, compact chat/session briefs, source/file registries, changelog/audit infrastructure, tooling docs, a facts index/guide, and emergent entity/topic dossiers, while raw records remain browseable/searchable through Records mode alongside generated Markdown Files mode (from chat). Durable memory should not be organized primarily by chat/project separation, because project IDs are session metadata rather than meaningful memory topics (from chat).</p><p>The user wants Arden memory to become a long-horizon personal context system that converts scattered raw data into useful evolving memory, while treating recent Obsidian daily sweeps/reports as weak idea sources rather than authoritative truth (from chat). The preferred implementation posture is “simple, capable, robust, boring, inspectable, sparse, and easy to delete” rather than overengineered (from chat). Graph-oriented memory architecture should likely be removed for the current memory direction because the user finds the graph useless (from chat). Memory tooling means real agent-callable operations for reading, searching, editing, moving, regenerating, and validating memory files, not documentation that merely describes tooling (from chat).</p><p>Memory UI should be a serious file-backed directory browser comparable to Dex/Nexus, not a low-quality file list or tabbed pane abstraction (from chat). The left pane should adapt the Dex/Nexus FileListView pattern: compact single-line folder/file rows with icon, label, and count only, while path/kind/record metadata and snippets live in preview/details (from chat). Memory artifact UI should render Markdown properly and show human-readable project names instead of exposing internal <code>proj_*</code> identifiers as primary labels (from chat). Projection sanitization should avoid exposing internal project IDs, source/provenance metadata, repo paths, debug identifiers, hashes, Slack thread IDs, fake changelog entries, boilerplate canonicality headers, or duplicated garbage content (from chat).</p><p>The memory sanitizer had a recurring projection bug: it replaced useful snake_case or metric-like technical tokens with placeholder text, making summaries unreadable while raw DB records remained correct (from chat). Fixes need regression coverage against representative experiment tokens and numeric metrics, not one-off allowlists (from chat). The sanitizer should preserve meaningful identifiers and metrics such as <code>stage25_sentence_bridge_300</code>, <code>stage3_from_bridge_nl_400</code>, <code>exact_match</code>, <code>normalized_similarity</code>, <code>avg_loss</code>, and <code>no_act</code>, while redacting genuinely opaque or sensitive IDs, hashes, paths, run/span/project IDs, and similar operational identifiers (from chat).</p><p>The research-agent direction is Harness-1-inspired but focused on harness patterns rather than reinforcement learning (from chat). Research harness functionality should be explicit runtime/state-machine code exposed through tools: tools handle search/read/curate/verify/write/finish actions, while the harness stores workspace state and renders compact working memory back into the agent prompt (from chat). Curation and verification should be first-class: agents promote evidence while working, tag importance/confidence, track found-but-unused material, preserve source inventories, and store claim-support verdicts as part of the research workspace (from chat).</p><p>The first research harness pass implements a lightweight <code>ResearchWorkspace</code>/<code>ResearchHarness</code> backed by <code>SharedLedger</code>: it tracks candidate/source store, curated evidence, verification records, questions/dead ends, search history, artifact/report-building state, and budget-aware context rendering (from chat). It is intentionally lighter than Harness-1: no RL/training loop, formal reward environment, automatic verification engine, sophisticated dedup/ranking/budget optimizer, or runtime-enforced report-writing gate yet (from chat). Research output should be a concise TL;DR in chat/tool results plus Markdown artifacts for normal or deep research, while quick lookups may stay inline (from chat). Downstream agents should automatically read relevant artifacts such as <code>summary.md</code> or <code>report.md</code> before concluding (from chat).</p><p>Research artifacts are filesystem-backed and addressable for future runs under <code>~/.arden/artifacts/research/&lt;readable-scope&gt;/</code>, using readable scope IDs like <code>research-&lt;coolname&gt;</code> while retaining original tool-call IDs for trace/debug compatibility (from chat). Read/list tools prefer filesystem artifacts with fallback to the legacy store, tests isolate writes from the user’s real <code>~/.arden</code>, and old research artifacts from before this change were not automatically migrated (from chat). The behavior has been live-smoke-tested with a readable scope, multiple Markdown artifacts, a concise TL;DR, and follow-up-readable filesystem paths (from chat). Artifact directories should use human-readable generated slugs such as <code>research-&lt;cool-slug&gt;</code> instead of raw tool-call IDs (from chat).</p><p>Arden is borrowing from Vercel’s Eve as an agent-surface spec, not as a dependency or runtime replacement (from chat). The direction is to adopt Eve’s filesystem-first, inspectable-agent-artifact shape while keeping arden’s runtime underneath: instructions, tools, skills, schedules, channels, subagents, evals, manifest/runtime-info, active tools, deferred groups, automations, event types, and related runtime capabilities should be inspectable rather than scattered across DB/runtime configuration (from chat). File-authored schedules should compile into arden’s existing automation system (from chat). The user explicitly does not want to depend on Eve directly, copy Vercel-hosted observability assumptions, expose the whole repo to sandboxes by default, or stay with boolean-only approval semantics (from chat).</p><p>Parked workflow states should become first-class in the Eve-inspired direction: waiting for approval, waiting for input, waiting for auth, waiting for subagent/background result, completed, failed, and cancelled (from chat). Evals should be event-aware and assert on real runtime events such as tool calls, approval waits, event types, completion, failure, and SSE/event-architecture states (from chat). Approval semantics are a recurring design boundary: safe headless notifications need a separate auto-approve/always-approve concept from basic writability, so notifications can run without granting blanket approval to destructive actions (from chat).</p><p>Recent Arden agent-intel/self-architecture sweeps strengthen the same direction: MCP’s draft spec points toward stateless tools with explicit <code>_meta</code> context, typed <code>input_required</code> waits, and scope-based auth/step-up permissions; Basic Memory suggests tool behavior hints, schema/diff validation, doctor checks, and matched search chunks; agent-eval harnesses suggest turning real bad runs into JSONL/golden trajectory tests with tool-use, cost, latency, and CI gates (from Arden agent intel sweep). For arden, this means per-automation source policies should become explicit runtime objects shown before tool use and checked by trajectory evals, instead of relying only on broad prompt text (from Arden agent intel sweep).</p><p>The automation stack can run scheduled autonomous tasks and notify the user when done, as of integration sync (from chat). The “Memory self-improve experiment” is a runtime automation, not a source-code change; it runs every 3 hours and is enabled (from chat). For that experiment, fixes may add or adjust tests when required, but must not modify or weaken the memory eval gate; test changes are allowed only when they strengthen or cover the fix (from chat). The Slack bug-triage automation watches every new message in <code>#bugs-or-fails</code>, investigates possible bug reports using Slack/thread context, relevant MCPs, and local Dex source code, then reports only in arden chat (from chat). That workflow must keep Slack read-only: no replies, reactions, or block messages; useful replies should be drafted in arden chat instead (from chat).</p><p>External-agent access should be scoped rather than exposing the assistant’s full toolbelt (from chat). A viable design is a narrow <code>arden-mcp</code> gateway exposing capability tools such as research, workflow, audit, and investigate, internally calling arden’s HTTP API or workflow entrypoints while preserving approval boundaries (from chat). The preferred security model is capability-based: read-only research and specific workflow names by default, no broad “do anything as Timur” access, and Slack/Gmail or other mutations behind approval unless explicitly scoped (from chat).</p><p>Integration auth should default to BYO/local credentials for privacy and control (from chat). Managed auth brokers such as Composio or Pipedream may be optional for polished onboarding, but they add vendor dependency, cost, reduced control/debuggability, and sensitive Gmail/Slack token or data custody concerns (from chat). Arden uses Hermes-style guided setup assistants for integration onboarding: one assistant per integration, with desktop status, targeted questions, preflight checks, generated links/commands or JSON import parsing, credential/path/code paste or import, validation, and setup verification (from chat). Current desktop settings include guided setup for Google, Slack, and MCP integrations (from chat).</p><p>The current architecture treats the server as authority; the desktop proxies server HTTP/SSE through Electron IPC via <code>window.ardenDesktop</code> (from chat). The old TUI talked directly to the server over HTTP/SSE, but the TUI surface has since been removed (from chat). The agent-streaming direction is HTTP commands plus fetch-based SSE rather than browser <code>EventSource</code>, because future remote/multi-user deployment needs auth headers, cancellation, and better client control (from chat). Streams should be treated as a typed event ledger rather than raw token soup, with explicit protocol rules for replay, reconnects, cancellation, idempotency, backpressure, and slow-consumer handling (from chat). As of integration sync, the server may eventually support multiple users (from chat).</p><p>The streaming hardening path is staged: start with a single process plus a database event store, and move to Redis Streams or Pub/Sub only when multiple server workers need fanout (from chat). Later remote or multi-user deployment needs stream authorization, cross-user leak prevention, durable replay, quotas, proxy-safe headers and heartbeats, bounded subscriber queues, reconnect-loop protection, stale-cursor handling, and eventual multi-process fanout (from chat). The source-backed research artifact for client-server agent streaming/SSE best practices is <code>Research/arden-agent-streaming-sse-client-server-best-practices-2026.md</code> (from chat).</p><p>The user has several arden skills and harness-quality patterns. <code>polish-ui</code> covers polished UI prompts, microinteraction specs, Figma handoff guidance, and refinement passes to avoid generic “AI slop,” with design-token-first styling, exact motion specs, state-driven variants, tactile defaults, isolated tuning prompts, and accessibility/performance caveats (from chat). <code>tool-harness-audit</code> audits MCP/agent tool harness ergonomics across arden, Codex, Claude, and Agents, with invariants around Markdown-first outputs, clear tool ownership, no opaque IDs, workflow examples, right-sized tools, pagination, naming, read-before-write, provenance, destructive annotations, and eval-driven refinement (from chat). arden’s MCP vault tools now follow Markdown-first outputs for search/list/read (from chat).</p><p>Frontend polish is midstream. The user is refactoring the frontend from raw CSS to Tailwind and from raw CSS animations to Motion (from chat). Desktop already has a centralized motion-token layer and reduced-motion handling, so future UI polish should refine consistency rather than assume the motion system is absent (from chat). Composer thinking animations are the highest-risk motion-polish area because flashy styles can make the app feel like a custom AI toy rather than a quiet Vercel/Linear-style product (from chat). Button/action primitives are a bigger consistency issue than most animation details because many actions are still hand-rolled despite an existing <code>IconButton</code> primitive (from chat).</p><p>The right sidebar MVP should keep the existing Todo/Tasks, approvals row, active background agents, running automations, and collapsed badge/count, then add derived sidebar state rather than model-written prose (from chat). Missing sections are Context used, Sources used, Waiting/blocked reason/status, and possibly low-noise suggested actions (from chat). Context should be a tiny list of semantic grounding currently influencing the answer, Sources should derive from successful tool/read/search events and dedupe by path/url/id, and Open loops/waiting should come from unresolved conversation or runtime events such as rejected direction, pending approval/action/draft, assistant question, or user input needed (from chat).</p><p>Arden has a real tool-result offload pattern: very large tool results are written to durable artifacts, the model receives only a head/tail preview plus instructions for bounded reads, and later reads are capped so the model does not automatically re-ingest the whole blob (from chat). This is relevant to Dex’s context-loss problem, where polluted live context and unsafe compaction appear to cause forgetting; arden’s model suggests clamping/stubbing large tool results, replacing noisy pre-summary context, summarizing cleaned previews, and avoiding split tool-call turns during truncation (from chat).</p><p>For arden 1.0 cleanup, the user is willing to remove legacy/backwards-compatibility paths, redundant defensive wrappers, and over-safe old code instead of preserving pre-1.0 compatibility, while still protecting against real user-data corruption and live safety issues (from chat). Cleanup already removed legacy compatibility shims for <code>ARDEN_EXPLORE_MODEL</code>, legacy SSE alias event names, the old <code>/session/episodes</code> endpoint, the old <code>session_episodes</code> DB migration/alias path, and the unused legacy <code>web_fetch</code> tool (from chat). Recent docs refresh and legacy/dead-code cleanup commits are local but not pushed; push only if the user asks (from chat).</p><p>Known reliability/security issues are concrete and should be treated as work items, not vague polish. Tool execution ignores <code>allowed_tool_names</code>, so registered tools not exposed to the current model step can still execute if emitted (from chat). Chat orchestration has race conditions around queued messages after final drain, cancel-before-task still starting a task, and concurrent first messages spawning multiple top-level runs (from chat). Transcript search applies time bounds to FTS hits but not vector hits, transcript edits can leave stale semantic-index entries, and session tools can ignore active project scope and expose transcripts from other projects (from chat). Malformed <code>context</code> blocks can produce HTTP 500s, non-positive <code>max_depth</code> can terminate agents immediately, MCP OAuth token paths derive from unvalidated server names with weak file permissions, background agent spawns can bypass per-session caps, and stale/nonexistent session posting can silently create a different session while streaming under the stale ID (from chat).</p><p>Other implementation risks have specific fixes. Server session IDs are timestamp-only in <code>apps/server/arden/services/session.py</code>; move to UUID/ULID or add a random suffix (from chat). <code>chat_queued_messages</code> is keyed only by global <code>client_id</code> in <code>apps/server/arden/context/store.py</code>; scope it by <code>(session_id, client_id)</code> to avoid cross-session leakage/collisions (from chat). Approval, config-write, and migration failures are swallowed in several server/config/store paths and should fail visibly or be made atomic (from chat). Desktop quick-capture can lose messages because Electron main may send before the React listener is ready (from chat). Package-management boundaries between root <code>package.json</code>/<code>bun.lock</code> and <code>apps/desktop/package.json</code> need clarification (from chat). Memory migrations should create indexes referencing new columns after additive migrations, not in bootstrap schema before migrations (from chat).</p><p>The user is also exploring memory “lenses”: user-authored natural-language instruction files that define a bucket, retrieve matching entities from append-only raw memory, and materialize evidence-linked synthesized profile nodes that refresh as new memories arrive (from chat). Lenses should behave like incremental materialized views, compiling into retrieval plans with FTS, embeddings, inclusion/exclusion hints, identity rubrics, minimum-evidence policy, and profile shape; new memories route to candidate lenses and LLM judgment decides whether to update an entity, create a candidate, or no-op (from chat). For prior-art research, the user cares about mechanism over marketing: authoring model, extraction, entity resolution/dedup, synthesis, update model, and human-in-the-loop correction (from chat).</p><h2>Watching</h2><ul><li><b>Public artifact health:</b> Track whether the public <code>esceptico/arden</code> surface remains evidence-clean for applications/O-1A, especially the Jul 7 main-branch CI failure on commit <code>5aa1c8f</code>; treat this as worth surfacing when the user next touches arden, but not as a reason to pull focus from Dex by itself.</li><li><b>Automation/intel quality:</b> Track the <code>Arden agent intel sweep</code> as a read-only, arden-specific source of practical agent-memory, harness, eval, prompt/tool/process, and self-architecture insights; keep Trigger.dev, browser automation, and generic copied agent-news scope out unless the user re-adds them.</li><li><b>Memory and research harness direction:</b> Track concrete evidence that changes the memory-v3, research-artifact, curation/verification, lens, episodic-memory, or filesystem-backed projection strategy; prefer source-backed mechanisms over vague architecture churn.</li><li><b>Reliability/security backlog:</b> Track drift on known concrete risks — tool-scope enforcement, chat-run races, transcript/project scoping, OAuth token path security, background caps, stale session posting, session IDs, queued-message scoping, swallowed failures, quick-capture loss, and package-boundary ambiguity.</li><li><b>Boundaries I will not touch:</b> Do not push local commits, edit source files, restart servers, post to Slack/email/GitHub, change automations, or perform external mutations from this custodian role; observe, update this topic page, and raise only high-leverage asks.</li></ul><h2>Open loops</h2><ul><li><b>Research harness adoption</b> — The remaining question after the live-smoke-tested filesystem artifact work is whether research agents consistently use all harness tools such as curate and verify internally (from chat).</li><li><b>Local commits</b> — Recent arden docs refresh and legacy/dead-code cleanup commits are committed locally but not pushed; push only if the user asks (from chat).</li><li><b>Main CI failure</b> — GitHub Actions reported <code>esceptico/arden</code> main-branch CI failed on commit <code>5aa1c8f</code> on Jul 7, 2026, with both <code>test</code> and <code>lint</code> jobs failing; because Arden is a public evidence artifact, this is worth fixing when the user next touches arden, but it does not justify a large side-project push by itself (from email feed).</li><li><b>Memory episode design</b> — The current live window-summary design is producing near-duplicate, overlapping, low-quality episode summaries when one long chat spans many topics; the open research/design question is the right bounded unit of episodic memory, especially whether production systems avoid live buffered-window summaries in favor of raw turn/message provenance, fact/entity extraction, context compaction, or background reflection (from chat).</li><li><b>Lens prior art</b> — arden lens research still needs to investigate how systems avoid full graph scans, apply schema/lens definitions to new records, and handle fuzzy or inferred entities, using code, papers, blogs, and Twitter/X posts where relevant (from chat).</li><li><b>Research-agent harness upgrade</b> — The user asked to implement the arden research-agent harness upgrade, including TL;DR plus artifact output and stateful curation/verification workspace behavior (from chat).</li><li><b>Reliability/security backlog</b> — Tool-scope enforcement, chat-run races, transcript search/edit indexing, project scoping, validation errors, config bounds, OAuth token path security, background-agent caps, stale session posting, timestamp-only session IDs, queued-message scoping, swallowed failures, quick-capture loss, and package-management ambiguity remain recorded risks with concrete fixes (from chat).</li><li><b>Memory consolidation bottleneck</b> — Normal fact consolidation can request observation creation, but the observation-creation gate rejects single-fact patterns, effectively blocking ordinary fact consolidation from creating observations (from chat).</li></ul><h2>Related</h2><ul><li><a class=\"wl\" data-open=\"topics/mats.md\">MATS</a> — Arden can be framed as the user’s long-horizon agent/memory testbed and viable main &gt;20-hour project for applications (from chat).</li><li><a class=\"wl unresolved\">O-1A</a> — Arden is an evidence pillar for authorship, original contribution, public technical artifact, and relocation narrative criteria (from chat).</li><li><a class=\"wl unresolved\">Vercel</a> — Eve is the product/architecture reference for arden’s filesystem-first, inspectable agent-surface direction, without adopting Eve as a dependency (from chat).</li><li><a class=\"wl\" data-open=\"topics/dex.md\">Dex</a> — Dex/Nexus directory UI informs arden’s memory browser, and arden’s context-management/offload patterns are a model for Dex’s forgetting/context-loss problem (from chat).</li><li><a class=\"wl\" data-open=\"topics/nexus.md\">Nexus</a> — Nexus is part of the directory-browser reference point for arden’s file-backed memory UX (from chat).</li><li><a class=\"wl unresolved\">Design</a> — arden’s UI direction is a calm, dense, keyboard-first native agent workbench with Linear/Raycast/Cursor-style spacing and restrained material treatment (from chat).</li><li><a class=\"wl unresolved\">Claude Code</a> — Claude Code is one of the agent-aware references for arden’s product direction and session-status/waiting-state modeling (from chat).</li><li><a class=\"wl unresolved\">Codex</a> — Codex is a product reference for agent-aware UI and structured todo/open-loop patterns in arden (from chat).</li><li><a class=\"wl unresolved\">AI safety</a> — arden’s long-horizon assistant framing includes provenance, stale memory, over-retrieval, context loss, and approval/safety boundaries (from chat).</li><li><a class=\"wl unresolved\">HermesAgent</a> — Arden uses Hermes-style guided setup assistants for integration onboarding (from chat).</li><li><a class=\"wl\" data-open=\"topics/letta.md\">Letta</a> — Letta/MemGPT is part of the required primary-source set for episodic-memory architecture research relevant to Arden memory design (from chat).</li><li><a class=\"wl unresolved\">Obsidian</a> — Obsidian daily sweeps/reports are idea sources for arden continual learning, not authoritative truth (from chat).</li><li><a class=\"wl unresolved\">ThirdLayer</a> — Kevin/ThirdLayer letters could strengthen arden’s O-1A evidence by tying the work to hiring or role significance (from chat).</li></ul>", "records": [{"at": "2026-07-13 04:37", "actor": "filesystem", "stat": "+2 −0", "diff": [" Arden is borrowing from Vercel’s Eve as an agent-surface spec, not as a dependency or runtime replacement (from chat). The direction is to adopt Eve’s filesystem-first, inspectable-agent-artifact shape while keeping arden’s runtime underneath: instructions, tools, skills, schedules, channels, subagents, evals, manifest/runtime-info, active tools, deferred groups, automations, event types, and related runtime capabilities should be inspectable rather than scattered across DB/runtime configuration (from chat). File-authored schedules should compile into arden’s existing automation system (from chat). The user explicitly does not want to depend on Eve directly, copy Vercel-hosted observability assumptions, expose the whole repo to sandboxes by default, or stay with boolean-only approval semantics (from chat).", " ", " Parked workflow states should become first-class in the Eve-inspired direction: waiting for approval, waiting for input, waiting for auth, waiting for subagent/background result, completed, failed, and cancelled (from chat). Evals should be event-aware and assert on real runtime events such as tool calls, approval waits, event types, completion, failure, and SSE/event-architecture states (from chat). Approval semantics are a recurring design boundary: safe headless notifications need a separate auto-approve/always-approve concept from basic writability, so notifications can run without granting blanket approval to destructive actions (from chat).", "+", "+Recent Arden agent-intel/self-architecture sweeps strengthen the same direction: MCP’s draft spec points toward stateless tools with explicit `_meta` context, typed `input_required` waits, and scope-based auth/step-up permissions; Basic Memory suggests tool behavior hints, schema/diff validation, doctor checks, and matched search chunks; agent-eval harnesses suggest turning real bad runs into JSONL/golden trajectory tests with tool-use, cost, latency, and CI gates (from Arden agent intel sweep). For arden, this means per-automation source policies should become explicit runtime objects shown before tool use and checked by trajectory evals, instead of relying only on broad prompt text (from Arden agent intel sweep).", " ", " The automation stack can run scheduled autonomous tasks and notify the user when done, as of integration sync (from chat). The “Memory self-improve experiment” is a runtime automation, not a source-code change; it runs every 3 hours and is enabled (from chat). For that experiment, fixes may add or adjust tests when required, but must not modify or weaken the memory eval gate; test changes are allowed only when they strengthen or cover the fix (from chat). The Slack bug-triage automation watches every new message in `#bugs-or-fails`, investigates possible bug reports using Slack/thread context, relevant MCPs, and local Dex source code, then reports only in arden chat (from chat). That workflow must keep Slack read-only: no replies, reactions, or block messages; useful replies should be drafted in arden chat instead (from chat).", " "]}], "recordsTotal": 1, "knowledge": [["2026-07-13", "fact", "", "Recent Arden agent-intel and self-architecture research suggests using stateless tools with explicit context metadata, typed input-required waits, and scope-based authentication or step-up permissions; tool behavior hints, schema/diff validation, doctor checks, and matched search chunks; and JSONL or golden trajectory tests derived from real failures with tool-use, cost, latency, and CI gates. For arden, per-automation source policies should become explicit runtime objects shown before tool use and checked by trajectory evals rather than relying only on broad prompt text."], ["2026-07-13", "directive", "", "Recent Arden agent-intel and self-architecture research suggests using stateless tools with explicit context metadata, typed input-required waits, and scope-based authentication or step-up permissions; tool behavior hints, schema/diff validation, doctor checks, and matched search chunks; and JSONL or golden trajectory tests derived from real failures with tool-use, cost, latency, and CI gates. For arden, per-automation source policies should become explicit runtime objects shown before tool use and checked by trajectory evals rather than relying only on broad prompt text."], ["2026-07-10", "directive", "8", "For the user's arden Dex bug-triage automation, watch every new message in Slack channel #bugs-or-fails without keyword filtering. Investigate potential reports using Slack/thread context, relevant MCPs such as LangSmith, Trigger, and Postgres, and local Dex source code. To find the relevant trace, search Postgres for available name, account, or email context, resolve the user_id, search the default LangSmith project filtered by that userId, and inspect the exact matching session or trace. Report triage results only in arden chat; keep Slack read-only by not posting replies, reactions, or blocks, and draft any useful Slack reply in arden chat instead."], ["2026-07-10", "directive", "9", "When monitoring or summarizing news and running recurring briefings for the user, prioritize AI agents, coding agents, tool use, agentic memory, evals, open models, model routing, startup infrastructure, context engineering, research papers, notable features from leading internet AI agents, and AI-builder/lab/benchmark accounts, especially via the user's X timeline, X lists, and specific AI-builder/lab/benchmark accounts. Avoid ng late at a fixed high threshold, old pre-summary messages remaining alongside summaries, questionable post-summary retention, and hard truncation orphaning tool-call context. arden’s context-management and offload patterns are useful models for Dex: clamp, stub, or offload large browser/search/file/tool results before model calls and compaction; preserve access through bounded artifact reads and re-read pointers; compact earlier based on model-relative context size plus message-count limits rather than a fixed 150k-token threshold; let summaries replace old noisy pre-summary context; summarize cleaned previews rather than raw tool dumps; and avoid splitting tool-call turns during truncation."], ["2026-07-08", "directive", "7", "For the user's personal memory-system research, investigate lenses and episodic-memory architecture as incremental, evidence-linked projections over an append-only raw memory graph: compare primary sources such as Zep/Graphiti, Mem0, Letta/MemGPT, LangMem, Claude/ChatGPT-style memory, code, papers, blogs, and Twitter/X posts on mechanism rather than marketing, including authoring model, entity extraction/resolution/dedup, profile synthesis, update model, human-in-the-loop correction, avoiding full graph scans, schema/lens application to new records, fuzzy/inferred entities, episodic unit, bounding, live versus background summarization, and redundancy/overlap prevention. Lenses should work like incremental materialized views compiled into cheap retrieval plans with FTS queries, embedding queries, inclusion/exclusion hints, identity rubrics, minimum-evidence policy, and profile shape; route new memories to candidate lenses; retrieve top-K candidate evidence clusters and existing entities using indexes, aliases, tags/kinds, updated-after checkpoints, and active/recent hints; then have the LLM judge whether evidence supports an existing entity, creates a candidate entity, updates a profile, or no-ops. For fuzzy lenses such as personal traits, candidate clusters—not pre-existing entity names—are the main unit, with naming/merging after retrieval. A key open question is the right bounded unit of episodic memory, especially whether production systems avoid live buffered-window summaries in favor of raw turn/message provenance, fact/entity extraction, context compaction, or background reflection, because the user's current system summarizes chat buffers after 10 minutes idle or 50 turns and can produce near-duplicate, overlapping, low-quality episode summaries when one long chat spans many topics."], ["2026-07-05", "fact", "7", "The user's headless Obsidian/arden MCP vault work provides Obsidian-flavored Markdown vault access tools including vault_read, vault_search, vault_create_note, vault_update_note, vault_backlinks, and vault_list; the tools use Markdown-first outputs, with vault_search returning scannable Markdown results with query echoing, method, compact path/score/source metadata, blockquoted highlighted snippets, and pagination hints, vault_list returning a Markdown table with relative and absolute timestamps plus pagination, and vault_read returning a compact metadata header followed by raw Markdown content."], ["2026-07-04", "directive", "7", "Arden has an Eve-inspired agent-surface spec direction that should borrow Eve’s filesystem-first, inspectable-agent-artifact/product and architecture shape while keeping arden’s own runtime underneath rather than depending on Eve directly, copying Vercel-hosted observability assumptions, exposing the whole repo to sandboxes by default, or staying with boolean-only approval semantics. Vercel’s blog post “Introducing Eve” by Shar Dara, published Jun 17 2026 (https://vercel.com/blog/introducing-eve), introduced Eve as a filesystem-first production framework for agents with agent.ts, instructions.md, tools, skills, subagents, channels, schedules, durable sessions, sandboxed compute, approvals, evals, and tracing. For arden, instructions, tools, skills, schedules, channels, subagents, evals, manifest/runtime-info, active tools, deferred groups, automations, event types, and related runtime capabilities should be inspectable rather than scattered across DB/runtime configuration. This includes compiling file-authored schedules into arden’s existing automation system, using Eve-style schedule authoring while keeping arden’s runtime. The direction should make parked workflow states first-class—including waiting for approval, waiting for input, waiting for auth, waiting for subagent/background result, completed, failed, and cancelled—and should include event-aware evals that assert on real runtime events such as tool calls, approval waits, event types, completion, failure, and other SSE/event-architecture states."], ["2026-07-04", "directive", "7", "arden/Dex file-backed memory and Knowledge/Skill UIs should use a dense, readable, serious directory/file-tree browser inspired by Dex/Nexus, Linear/Vercel/Notion minimalism, and Obsidian-style file navigation: a compact left-pane tree with clear hierarchy, search, counts, expand/collapse, selected states, and no-results states, keeping rows to icon, label, and count while path, kind, record metadata, snippets, and other details stay in the preview/details area rather than cluttering the sidebar."], ["2026-07-03", "directive", "8", "The user wants other agents to access arden workflows or research agents through a narrow, capability-based scoped interface such as an <code>arden-mcp</code> gateway, exposing read-only research and specific workflow/capability tools like research, workflow, audit, and investigate by default; it should avoid broad “do anything as Timur” access, can internally call arden’s HTTP API or direct workflow entrypoints, and should keep Slack/Gmail or other mutations behind approval unless explicitly scoped."], ["2026-07-03", "fact", "8", "arden had a recurring memory/artifact projection sanitizer bug where useful technical identifiers, experiment names, metric names, and decimal metric values—such as stage25_sentence_bridge_300, stage3_from_bridge_nl_400, exact_match, normalized_similarity, avg_loss, and no_act—were replaced with placeholder text, making summaries unreadable even though raw DB records remained correct. Fixes should preserve meaningful technical tokens while redacting only genuinely opaque or sensitive IDs, hashes, paths, run/span/project IDs, and similar operational identifiers, with regression coverage against representative experiment tokens and numeric metrics rather than one-off allowlists."], ["2026-07-03", "fact", "5", "arden’s public documentation and repo surface have been refreshed to match the current desktop-first app: README/quickstart/configuration/API/notifier docs and new Desktop/HTML widget guides reflect current capabilities; stale TUI/CLI/legacy-memory references, the TUI app/guide, CLI publish/CI workflows, and TUI recipes/references were removed; screenshots and webhook/runtime/memory/API wording were refreshed; and docs now concisely cover agent runtime surfaces such as goals, todos, background sessions, notifications, directives, loops, and wakeups."], ["2026-07-03", "source", "7", "For Dex/arden continual-learning and memory research, especially relevant references include MIRIX, Memento, HMO, Graphiti, APEX-MEM, and MSSR, covering typed memory routing, learned retrieval/skill-loading timing, hot/warm/cold memory promotion, temporal knowledge graphs, append-only/conflict-resolved memory, provenance preservation, and FSRS-style memory-strength or staleness scheduling."], ["2026-07-03", "directive", "8", "For the user's recursive research/agent server/API v0 sub-agent communication, start with a simple direct <code>send_message</code> tool using <code>to</code> and <code>message</code> fields, rather than broadcast, blackboard, or group-chat semantics; messages should be delivered to sibling agents in the same run at the recipient's next agent step, shown in the UI as an agent-to-agent message edge, stored in the shared run ledger, and governed by simple rate limits such as 3–5 messages per agent."], ["2026-07-02", "directive", "7", "For the arden “Memory self-improve experiment,” fixes may add or adjust tests when required, but must not modify or weaken the memory eval gate; test changes are allowed only when they strengthen or cover the fix."], ["2026-07-02", "directive", "7", "In the user's automation stack, headless notification delivery previously failed because approval and delivery semantics were tangled: notify could hit “No UI connected — cannot approve,” and channel posting could generate output without delivering it to the channel. The user later reworked the project so automation delivery works again; preserve the lesson that automations need a separate auto-approve/always-approve concept from basic writability so safe notifications can run headlessly without granting blanket approval to destructive actions."], ["2026-07-02", "fact", "6", "The user has a <code>tool-harness-audit</code> skill available for arden, Codex, Claude, and Agents for auditing MCP/agent tool harness ergonomics. The audit invariants include Markdown-first outputs rather than raw JSON, clear tool ownership and low overlap, no raw opaque IDs, concrete common workflow examples in skills, fewer ways to execute the same task, error messages that guide next steps, right-sized tools that consolidate frequently chained steps without becoming overlapping mega-tools, pagination/truncation/result-size budgets, consistent naming and parameter shapes, read-before-write/state observability, common-case defaults, idempotency where possible, returning what changed, timestamps with timezone clarity, stable ordering, provenance for derived results, self-describing user-intent tool names, cheap read tools before expensive deep tools, high-signal/token-efficient returns, response-format controls, onboarding-quality tool descriptions, destructive-operation annotations, and eval-driven refinement."], ["2026-07-02", "fact", "7", "For Arden memory, “tooling” means real agent-callable operations for reading, searching, editing, moving, regenerating, and validating memory files in the filesystem-backed memory tree, not documentation files that merely describe how tooling should work."], ["2026-07-02", "directive", "7", "arden changelog projection granularity should keep atomic timestamped events only in monthly changelog files; yearly changelogs should be month-level rollups, and the changelog index should be year-level/top-level summary rather than duplicated event lists."], ["2026-07-02", "directive", "7", "For Arden integration auth, BYO/local credentials should be the privacy-first default; managed auth brokers such as Composio or Pipedream can be optional for polished onboarding, but they add vendor dependency, cost, reduced control/debuggability, and sensitive Gmail/Slack token or data custody concerns."], ["2026-07-02", "fact", "6", "Arden uses Hermes-style guided setup assistants for integration onboarding: one guided setup assistant per integration with simple desktop status, targeted questions, local-state/preflight checks, generated links/commands or JSON import parsing, credential/path/code paste or import, error/scope/token validation, and connection/setup verification. Current desktop settings include guided setup assistants for Google, Slack, and MCP integrations: Google supports service choice, preflight, credential import or paste, OAuth error handling, scope validation, and setup status; Slack supports guided token setup, token type validation, and token verification; MCP supports a wizard/helper flow and JSON import parsing."], ["2026-07-02", "directive", "7", "arden public documentation is meant primarily for external users rather than as exhaustive future-self/internal documentation; keep public docs short, polished, and user-facing, with deeper implementation notes separated into internal architecture docs when needed."], ["2026-07-02", "directive", "8", "For the arden 1.0 cleanup, the user is willing to remove legacy/backwards-compatibility paths, redundant defensive wrappers, and over-safe old code rather than preserving compatibility with pre-1.0 surfaces; still distinguish this from protections for real user-data corruption or live safety issues."], ["2026-07-02", "fact", "7", "arden architecture currently treats the server as the authority; the desktop proxies server HTTP/SSE through Electron IPC via <code>window.ardenDesktop</code>, while the TUI talks directly to the server over HTTP/SSE."], ["2026-07-02", "fact", "6", "The user is refactoring the arden frontend to replace raw CSS with Tailwind and raw CSS animations with Motion."], ["2026-07-02", "source", "6", "Public technical source pointer: https://timganiev.com/log/Arden is the user's arden architecture/writeup post."], ["2026-07-02", "fact", "6", "In Arden desktop, button/action primitives are not fully consolidated; many actions are still hand-rolled despite an existing IconButton primitive, which is a bigger polish-consistency issue than most animation details."], ["2026-06-02", "fact", "5", "Arden can run scheduled autonomous tasks and notify the user when the tasks are done."]], "backlinks": [["index", "index.md", ["<mark>Arden</mark> — Arden is the user’s main personal-agent project and a credible &gt;20-hour/week MATS/application project, with the user r…"]], ["me", "me.md", ["You are building <mark>Arden</mark> as a source-grounded personal AI and native agent workbench. Its direction is filesystem-first, inspectable, provenance- and perm", "<mark>Arden</mark> — Your personal AI, memory, research, automation, and agent-workbench project. (from chat)"]], ["dex", "topics/dex.md", ["<mark>Arden</mark> — Some Dex automation, todo, and provider-agnostic deferred-tool ideas overlap with arden architecture, while arden/Obsidian memory"]], ["replika", "topics/replika.md", ["<mark>Arden</mark> — Replika memory/context work influenced the user’s later arden thinking."]]], "outgoing": [["MATS", "topics/mats.md", "topics"], ["O-1A", null, "unresolved"], ["Vercel", null, "unresolved"], ["Dex", "topics/dex.md", "topics"], ["Nexus", "topics/nexus.md", "topics"], ["Design", null, "unresolved"], ["Claude Code", null, "unresolved"], ["Codex", null, "unresolved"], ["AI safety", null, "unresolved"], ["HermesAgent", null, "unresolved"], ["Letta", "topics/letta.md", "topics"], ["Obsidian", null, "unresolved"], ["ThirdLayer", null, "unresolved"]], "unlinked": [["active-work", "active-work.md", "Current work centers on Dex reliability and product delivery, the <mark>Arden</mark> agent-workbench and memory architecture, MATS application follow-up, and longer-term AI-safety and relocation"], ["aside", "topics/aside.md", "one pillar of the user’s delegated-agent oversight thesis: Dex contributes production reliability failures, <mark>Arden</mark> contributes personal/open authority-surface infrastructure, and Aside probes when an agent’s stated intent or"], ["slack", "topics/slack.md", "Slack matters in two separate workstreams: <mark>Arden</mark> integration strategy and the user’s operational updates feed. For arden, Slack is the pragmatic first self-ser"], ["email-updates", "feeds/email-updates.md", "| <mark>Arden</mark> / Timur | arden · Aside: question | 2026-07-10 19:41 UTC | Needs Timur to decide whether Aside gets one focuse"]], "source": "---\ntype: project\ntitle: arden\nupdated: 2026-07-13\n---\n\n## What we know\n\narden is the user’s main personal-agent project and a credible >20-hour/week MATS/application project, with the user reporting at least about 3 hours per day on it (from chat). For application framing, it can be presented as a long-horizon agent/memory testbed: a source-grounded assistant that retrieves, cites, remembers, schedules, and acts across personal data and tools while managing provenance, stale memory, over-retrieval, context loss, and approval/safety boundaries (from chat). It also supports the user’s O-1A/SF relocation narrative as a public open-source personal agent memory/context system, backed by the technical post at `timganiev.com/log/arden` and strengthened by GitHub metrics, demos/screenshots, a polished technical brief, and Kevin/ThirdLayer letters (from chat).\n\nFor the next 4–8 weeks, Arden should mostly stay in lightweight artifact-producing capture mode rather than becoming the main implementation push, because current Dex production work is stronger application/O-1A evidence and the user’s workload/health constraints make large speculative side-project pushes costly (from chat).\n\nThe product direction is a native agent workbench / personal AI control center: Raycast-fast, Linear-clean, Apple/Fluent-native, Cursor/Codex/Claude-agent-aware, and ChatGPT Canvas-capable (from chat). Chat is only one surface; the app should feel calm, dense, inspectable, keyboard-first, and provenance/permission-aware, with restrained glass/material used for chrome and transient controls rather than as a full app skin (from chat). The global command palette is the central interaction model, spanning memory search, agent runs, research, automations, tools, approvals, settings, workspaces, and sources (from chat). For visual design, avoid full-window delimiter lines and dated admin/forum separators; prefer Linear/Raycast/Cursor-like spacing, subtle background tier shifts, and short inset borders inside cards (from chat).\n\nThe current public surface is desktop-first: the TUI/CLI client surface, TUI app, TUI guide, CLI publish/CI workflows, and TUI recipes/references were removed (from chat). Public docs have been refreshed to match current app capabilities, with desktop-first language, current screenshots, Desktop and HTML widget guides, corrected webhook/runtime/memory/API wording, and coverage for goals, todos, background sessions, notifications, directives, loops, and wakeups (from chat). Public docs should stay short, polished, and user-facing, with deeper implementation notes separated into internal architecture docs (from chat).\n\narden’s memory direction is filesystem-backed, inspectable, and intentionally simpler than an idealized memory OS (from chat). The design keeps raw-ish append-only logs/artifacts or atomic records and retrieval/index layers separate from clean compiled human-readable wiki/filesystem projections for agent use (from chat). Memory v3 should expose directives/procedural context, curated project briefs, compact chat/session briefs, source/file registries, changelog/audit infrastructure, tooling docs, a facts index/guide, and emergent entity/topic dossiers, while raw records remain browseable/searchable through Records mode alongside generated Markdown Files mode (from chat). Durable memory should not be organized primarily by chat/project separation, because project IDs are session metadata rather than meaningful memory topics (from chat).\n\nThe user wants Arden memory to become a long-horizon personal context system that converts scattered raw data into useful evolving memory, while treating recent Obsidian daily sweeps/reports as weak idea sources rather than authoritative truth (from chat). The preferred implementation posture is “simple, capable, robust, boring, inspectable, sparse, and easy to delete” rather than overengineered (from chat). Graph-oriented memory architecture should likely be removed for the current memory direction ", "body": "## What we know\n\narden is the user’s main personal-agent project and a credible >20-hour/week MATS/application project, with the user reporting at least about 3 hours per day on it (from chat). For application framing, it can be presented as a long-horizon agent/memory testbed: a source-grounded assistant that retrieves, cites, remembers, schedules, and acts across personal data and tools while managing provenance, stale memory, over-retrieval, context loss, and approval/safety boundaries (from chat). It also supports the user’s O-1A/SF relocation narrative as a public open-source personal agent memory/context system, backed by the technical post at `timganiev.com/log/arden` and strengthened by GitHub metrics, demos/screenshots, a polished technical brief, and Kevin/ThirdLayer letters (from chat).\n\nFor the next 4–8 weeks, Arden should mostly stay in lightweight artifact-producing capture mode rather than becoming the main implementation push, because current Dex production work is stronger application/O-1A evidence and the user’s workload/health constraints make large speculative side-project pushes costly (from chat).\n\nThe product direction is a native agent workbench / personal AI control center: Raycast-fast, Linear-clean, Apple/Fluent-native, Cursor/Codex/Claude-agent-aware, and ChatGPT Canvas-capable (from chat). Chat is only one surface; the app should feel calm, dense, inspectable, keyboard-first, and provenance/permission-aware, with restrained glass/material used for chrome and transient controls rather than as a full app skin (from chat). The global command palette is the central interaction model, spanning memory search, agent runs, research, automations, tools, approvals, settings, workspaces, and sources (from chat). For visual design, avoid full-window delimiter lines and dated admin/forum separators; prefer Linear/Raycast/Cursor-like spacing, subtle background tier shifts, and short inset borders inside cards (from chat).\n\nThe current public surface is desktop-first: the TUI/CLI client surface, TUI app, TUI guide, CLI publish/CI workflows, and TUI recipes/references were removed (from chat). Public docs have been refreshed to match current app capabilities, with desktop-first language, current screenshots, Desktop and HTML widget guides, corrected webhook/runtime/memory/API wording, and coverage for goals, todos, background sessions, notifications, directives, loops, and wakeups (from chat). Public docs should stay short, polished, and user-facing, with deeper implementation notes separated into internal architecture docs (from chat).\n\narden’s memory direction is filesystem-backed, inspectable, and intentionally simpler than an idealized memory OS (from chat). The design keeps raw-ish append-only logs/artifacts or atomic records and retrieval/index layers separate from clean compiled human-readable wiki/filesystem projections for agent use (from chat). Memory v3 should expose directives/procedural context, curated project briefs, compact chat/session briefs, source/file registries, changelog/audit infrastructure, tooling docs, a facts index/guide, and emergent entity/topic dossiers, while raw records remain browseable/searchable through Records mode alongside generated Markdown Files mode (from chat). Durable memory should not be organized primarily by chat/project separation, because project IDs are session metadata rather than meaningful memory topics (from chat).\n\nThe user wants Arden memory to become a long-horizon personal context system that converts scattered raw data into useful evolving memory, while treating recent Obsidian daily sweeps/reports as weak idea sources rather than authoritative truth (from chat). The preferred implementation posture is “simple, capable, robust, boring, inspectable, sparse, and easy to delete” rather than overengineered (from chat). Graph-oriented memory architecture should likely be removed for the current memory direction because the user finds the graph useless (from chat). Memory tooling means real agent-callable operations for reading, searching, editing, moving, regenerating, and validating memory files, not documentation that merely describes tooling (from chat).\n\nMemory UI should be a serious file-backed directory browser comparable to Dex/Nexus, not a low-quality file list or tabbed pane abstraction (from chat). The left pane should adapt the Dex/Nexus FileListView pattern: compact single-line folder/file rows with icon, label, and count only, while path/kind/record meta

ete end-to-end verification, screenshot-coverage checks, and PR cleanup before calling the work shipped. (from chat)\n- **Dex model migration** — benchmark replacement Gemini models and decide the migration p", "snippet": "Current work centers on Dex reliability and product delivery, the Arden agent-workbench and memory architecture, MATS application follow-up, and longer-term AI-safety and…", "created": "2026-07-12", "modified": "2026-07-12", "home": false}, "directives.md": {"title": "directives", "fm": {"type": "topic", "title": "Directives", "updated": "2026-07-12"}, "dir": "", "type": "topic", "updated": "2026-07-12", "wide": false, "outline": [], "prose": "", "records": [], "recordsTotal": 0, "knowledge": [["2026-07-10", "directive", "9", "For arden, Interaction Lab, and related Claude/Codex design-engineering work, pursue a native agent workbench/personal AI control center that is Raycast-fast, Linear-clean, Apple/Fluent-native, Cursor/Codex/Claude-agent-aware, and ChatGPT Canvas-capable. Chat is only one surface: the product should feel calm, dense, inspectable, keyboard-first, and provenance/permission-aware, using restrained glass/material for chrome and transient controls rather than as a full-app skin. Make Cmd/Ctrl+K the central command palette for searching memory, opening agent runs, starting research, creating automations, running tools, approving pending actions, opening settings, switching workspaces, and searching sources, with nested Raycast/Linear/Superhuman-style flows. The desktop shell should use a native titlebar/command center, left navigation, a main workspace for chat/canvas/artifacts/reports/browser views, and a right inspector for context, sources, tool calls, plans/traces, and approvals. The arden right-sidebar MVP should retain Todo/Tasks, an approvals row, active background agents, running automations, and a collapsed badge/count, while adding derived state rather than model-written prose: Context used, Sources used, Waiting/blocked reason/status, and possibly low-noise suggested actions. Context used is a short list of semantic grounding influencing the answer; sources come from successful tool/read/search events, deduped by path/URL/id and marked used when cited or referenced; open loops come from unresolved conversation or runtime events and close when decided or completed. Rank and trim sections to about 3–5 items. Use OpenCode's context/files/review side-panel analogue, Codex and OpenCode structured todo/open-loop patterns, and Claude Code's session status/waitingFor model as references; keep suggested actions minimal unless a strong pattern emerges. For implementation and polish, use <code>impeccable</code>/<code>pbakaus/impeccable</code>, <code>emil-design-eng</code>, <code>brand-design-md</code>/<code>zephyrwang6/brand-design-md</code>, and <code>web-design-guidelines</code>/<code>vercel-labs/agent-skills/skills/web-design-guidelines/SKILL.md</code> with <code>vercel-labs/web-interface-guidelines</code> as a final QA layer when useful. Research and inspect relevant source material and code before implementing, and adapt source-backed components/materials rather than improvising generic UI. Aim for Vercel/Linear/Raycast/Cursor-style neutral, sharp, quiet, dense visuals with Apple-level/Awwwards-like tactile microinteractions. Preserve useful existing animations, but refine easing, timing, transform origins, spacing, hierarchy, responsiveness, focus states, and loading/error/empty states; prefer subtle, fast transform/opacity motion and avoid <code>transition: all</code>, gimmicky decorative motion, purple glows, sparkles, big marketing copy, generic shiny Dribbble/demo or SaaS-dashboard aesthetics, AI slop, Jira-like clutter, full-window delimiter lines, dated admin-panel/forum separators, and overbuilt visible controls or taxonomy. In graphite theme especially, avoid full-window delimiter lines. Prefer Linear/Raycast/Cursor spacing, subtle background tier shifts, and short inset borders inside cards. Treat arden composer thinking animations as the highest-risk motion-polish area; refine the existing centralized motion-token and reduced-motion system rather than assuming it is absent. Keep all 12 Interaction Lab studies/components visible, use the existing Arden desktop-sidebar-style single-icon theme toggle, and make demos replay-only rather than autoplaying. The <code>polish-ui</code> skill covers polished UI prompts, microinteraction specs, Figma handoff, refinement passes, design-token-first styling, exact motion specs, state-driven variants, tactile press/entrance/shadow defaults, isolated one-variable tuning, and accessibility/performance caveats."], ["2026-07-02", "directive", "8", "For automation classifiers/filters, especially interest-monitoring, digest, or notification pipelines, the user strongly prefers lightweight LLM-based semantic classification over brittle hand-written rules or keyword filters; use optional escalation to stronger models for uncertain or high-impact items, avoid fake numeric confidence scores from LLMs, and avoid rule-based filtering unless absolutely necessary."], ["2026-07-02", "directive", "7", "When the user asks what an agent can “see,” answer from the agent perspective: identify the activated prompt/context, available tools, and accessible data sources, and distinguish what is visible by default from what requires tool calls."], ["2026-07-02", "directive", "6", "Do not send Slack draft wording unless the user explicitly asks for a Slack draft or message rewrite."], ["2026-06-19", "fact", "7", "The user likes richer HTML/card/form UI surfaces as scratchpads or workspaces when they make interaction better than plain text."]], "backlinks": [["index", "index.md", ["<mark>Directives</mark> — 5 entries"]]], "outgoing": [], "unlinked": [["arden", "topics/arden.md", "webhook/runtime/memory/API wording, and coverage for goals, todos, background sessions, notifications, <mark>directives</mark>, loops, and wakeups (from chat). Public docs should stay short, polished, and user-facing, with deeper implem"]], "source": "---\ntype: topic\ntitle: Directives\nupdated: 2026-07-12\n---\n", "body": "", "snippet": "5 records", "created": "2026-07-12", "modified": "2026-07-12", "home": false}, "lessons.md": {"title": "lessons", "fm": {"type": "topic", "title": "Playbook", "updated": "2026-07-13", "aliases": ["Playbook"]}, "dir": "", "type": "topic", "updated": "2026-07-13", "wide": false, "outline": [], "prose": "", "records": [], "recordsTotal": 0, "knowledge": [["2026-07-12", "lesson", "8", "When debugging internal repair/retry behavior or generated memory artifacts, start from the user's exact question and concrete evidence across visible memory, raw records, code paths, runtime signatures, and projection layers; distinguish helper names, indexing, automation, parent backfill, child writers, context mirrors, and intended granularities, and test hypotheses for invalid arguments, schema failures, repeated tool calls, instrumentation gaps, or unproven backfill rather than relying on labels, restarts, successful syncs, speculation, stale context, duplicated logs, re-confirmation, or unrequested code changes."], ["2026-07-10", "lesson", "7", "Avoid assuming the user’s sleep schedule or day phase from the clock; if they correct a greeting like “morning,” adapt casually without treating it as a durable health fact."], ["2026-07-10", "lesson", "8", "Before summarizing ambiguous “updates,” clarify whether the user means job/application or work/Dex updates, then search all relevant connected inboxes before concluding there are no job or application updates."], ["2026-07-09", "lesson", "8", "Before declaring work complete, verify the live end-to-end user-visible path and concrete quality checks, including complete/loadable artifacts, intact persistence, intended results on relevant UI/tool/query/synced surfaces, valid strict tool schemas and tests, no stale tools, and whether the user expects companion README/docs/screenshots or a repo-facing refresh."], ["2026-07-09", "lesson", "8", "When answering what actually shipped at Dex, verify GitHub PR/commit state directly rather than relying on Slack or Linear status, because Slack/Linear can make open work look completed."], ["2026-07-09", "lesson", "8", "When the user asks what model you are, distinguish the visible app/persona name from the underlying backend model and do not claim a hidden model identifier unless session metadata exposes it."], ["2026-07-08", "lesson", "7", "When the user asks for runtime automation or artifacts that users or follow-up agents need to read later, prefer simple filesystem-backed, human-readable operational stores/tools/workflows in the appropriate data/file layer before adding scoped DB/session machinery, static documentation, or new source-code builtins, handlers, modules, or constants."], ["2026-07-08", "lesson", "6", "Before reusing copied source lists, examples, or templates, think through the user's stated project and prune irrelevant items; for arden-specific automations, do not carry over broad Dex/agent-intel sources such as Trigger.dev, browser-use/browser automation, or generic browser-context tooling unless the user explicitly asks or they are directly relevant to Arden's core memory/harness/scaffold architecture."], ["2026-07-07", "lesson", "8", "For Dex customer support/debugging, when a key customer is upset about a bug, Timur should avoid asking the customer to test or provide extra info unless truly necessary and highly likely to help; first exhaust internal logs, repros, and test accounts."], ["2026-07-06", "lesson", "8", "When synthesizing the user's projects or evidence-building, calibrate status, ownership, terminology, and requirements from authoritative sources: distinguish planning evidence from noisy mentions or inspiration, and make real achievements legible without fabricating evidence, over-formalizing casual work, or dismissing side projects without checking or asking."], ["2026-07-06", "lesson", "6", "Use research-agent workflows for fan-out research jobs instead of doing a single-threaded pass when the work naturally splits into independent research streams and synthesis."], ["2026-07-06", "lesson", "", "When evaluating the user's applications, projects, or evidence, prioritize actual depth, time investment, ownership, and achievements; calibrate status, terminology, and requirements from authoritative sources, distinguish planning evidence from noisy mentions or inspiration, and ask or check before dismissing side projects or overstating, fabricating, or over-formalizing their work."], ["2026-07-03", "lesson", "8", "Treat apparent duplicate or messy blocks in user-authored notes, drafts, or application prose as intentional unless the user confirms they are disposable; ask before cleaning, deduplicating, or removing their text."], ["2026-07-03", "lesson", "8", "When implementing or scaling a paper-replication ML evaluation for the user, first verify the paper’s actual demo/evaluation, user-specified model, original repo mechanics, eval-pair invariants, controls, and subgroup/control behavior; explicitly flag any fallback model, easier proxy task, or convenient scaffold so the work does not drift into a mechanically valid but non-paper-faithful result."], ["2026-07-03", "lesson", "", "When presenting or implementing paper-replication ML evaluations for the user, verify the paper’s actual demo/evaluation, specified model, original repository mechanics, evaluation-pair invariants, controls, and subgroup/control behavior; show concrete prompts, candidates, expected answers, model outputs, and controls rather than vague label-only summaries, and explicitly flag any fallback model, easier proxy task, or convenient scaffold so the result remains paper-faithful."], ["2026-07-02", "lesson", "8", "When preparing AI safety, Google DeepMind, Anthropic, OpenAI, or MATS source lists for the user, include classic/basic AGI safety papers where the prompt rewards field knowledge, but keep the final selection aligned with the user's actual scope: interpretability plus deceptive behavior, scheming, evaluator-awareness/metagaming, latent emotion/persona states, model psychology, and safety-relevant internal states. For current MATS-style framing, prioritize Anthropic and OpenAI current directions as the center of gravity, with other labs as supporting fits when relevant; explicitly justify omissions rather than defaulting only to recent or niche papers."], ["2026-07-02", "lesson", "8", "When helping with applications, prioritize the user's actual depth and time investment over projects that merely look more obviously on-theme."], ["2026-07-02", "lesson", "7", "When researching mentor/stream lists for applications, cover the full checkbox/list the user asked about instead of silently filtering to personally recognized or seemingly relevant options."], ["2026-07-02", "lesson", "6", "When editing Obsidian notes programmatically, preserve frontmatter separately and write body-only content when the update API already preserves frontmatter, otherwise duplicated frontmatter can be introduced."], ["2026-07-02", "lesson", "8", "During an active fix where the user asks for no progress narration, stop talking and only report once there is a concrete result or required blocker."], ["2026-07-02", "lesson", "8", "When the user is angry and asks for irreversible deletion or destruction, stop the work and require explicit confirmation or a safe archive/trash step instead of executing immediately."], ["2026-07-02", "lesson", "8", "For legal/tax paperwork, distinguish explicit accountant requirements from practical contract suggestions and verify the accountant’s exact wording before recommending an addendum or workaround."], ["2026-07-02", "lesson", "8", "In bulk profile or memory-derivation tasks, err toward admitting many standalone durable facts about the user's identity, work, projects, relationships, preferences, goals, and constraints; the user's complaint that 18 memories was far too few is a strong correction against over-filtering."], ["2026-07-02", "lesson", "6", "When adding examples to a skill or procedure, make sure the examples obey the skill’s own rules; do not illustrate a tool-harness guideline with snippets that violate the same guideline, such as raw JSON examples inside a Markdown-first tool-output skill."], ["2026-07-02", "lesson", "6", "When copying or installing skills across agent environments, check the actual directory layout first instead of relying on assumed home-directory paths."], ["2026-07-02", "lesson", "7", "When the user points to a clipping with reusable workflow or design patterns, consider turning it into a named Arden skill rather than only summarizing it."], ["2026-07-02", "lesson", "8", "When the user calls out verbosity or tone, recover with one short, direct, natural answer instead of explaining at length or overcorrecting into repeated terse acknowledgments."], ["2026-07-02", "lesson", "6", "When the user asks about continual learning for memory systems, clarify whether they mean token-space adaptation before framing the research around fine-tuning or weight updates."], ["2026-07-02", "lesson", "6", "Model entity/topic concepts explicitly at write time rather than patching downstream projections with heuristic blocklists."], ["2026-07-02", "lesson", "8", "When a user requests a loop-until-dry audit with a max-round cap, report the cap honestly and do not claim the audit is dry unless a round actually finds no new verified issues."], ["2026-07-02", "lesson", "7", "When a tunnel or background service repeatedly dies, stop doing ad hoc restarts and install a real process supervisor before continuing integration debugging."], ["2026-07-02", "lesson", "7", "Treat even a request for “more detail” as bounded: give the smallest useful implementation shape first, then ask before expanding."], ["2026-07-02", "lesson", "7", "When researching fuzzy memory lenses or emergent entity discovery, avoid using named-person or generic NER examples as the main analogy; the user considers those examples misleading and wants current prior work such as papers, systems, and blogs about concept induction, topic discovery, clustering, and canonicalization."], ["2026-07-02", "lesson", "8", "Never store or repeat user-provided API keys; use them only ephemerally for authentication, prefer environment-variable paths, and redact command output."], ["2026-07-02", "lesson", "7", "When monitoring long-running jobs, poll with short commands that leave room before the tool timeout instead of sleeping for the full timeout window."], ["2026-07-02", "lesson", "8", "When the user asks for examples of ML results, show actual prompts, candidates, expected answers, model outputs, and controls rather than compressed or vague label-only summaries."], ["2026-07-02", "lesson", "6", "For long multi-control evals, add per-control progress logging and a cheap restart path before babysitting a silent run; otherwise an end-of-suite metrics flush can make an active but slow eval look wedged."], ["2026-07-02", "lesson", "8", "When proposing integrations with coding harnesses, distinguish existing-session command/control from headless batch execution; do not present headless execution as the main answer if the user is asking for users to command their active harnesses from Dex."], ["2026-07-02", "lesson", "", "When preparing mentor, stream, or research lists for applications—especially in AI safety, Google DeepMind, Anthropic, OpenAI, or MATS contexts—cover the full scope and checkbox/list the user requested rather than silently filtering to personally recognized or seemingly relevant options; include classic/basic AGI-safety papers when field knowledge is relevant, keep selections aligned with requested areas such as interpretability, deceptive behavior, scheming, evaluator-awareness/metagaming, latent emotion/persona states, model psychology, and safety-relevant internal states, prioritize current Anthropic and OpenAI directions for MATS-style framing, use other labs as supporting fits when relevant, and explicitly justify omissions."], ["2026-06-24", "lesson", "6", "When drafting MATS or AI-safety application prose, translate dense technical framing into plain, readable English with concrete wording rather than abstract jargon."]], "backlinks": [["index", "index.md", ["Playbook — 37 entries"]]], "outgoing": [], "unlinked": [["2026-07-06", "daily/2026-07-06.md", "Distilled two operating <mark>lessons</mark>: calibrate project/evidence synthesis against authoritative sources rather than noisy mentions, and use resea"], ["2026-07-04", "daily/2026-07-04.md", "Captured two debugging/evidence <mark>lessons</mark>: answer the exact causal question from inspectable evidence first, and calibrate project/application claims f"], ["2026-06-24", "daily/2026-06-24.md", "Distilled working <mark>lessons</mark> from AI-safety/MATS and tooling work: preserve a single source of truth, use provided source locations first,"]], "source": "---\ntype: topic\ntitle: Playbook\nupdated: 2026-07-13\naliases: [\"Playbook\"]\n---\n", "body": "", "snippet": "40 records", "created": "2026-07-13", "modified": "2026-07-13", "home": false}, "references.md": {"title": "references", "fm": {"type": "topic", "title": "References", "updated": "2026-07-13"}, "dir": "", "type": "topic", "updated": "2026-07-13", "wide": false, "outline": [], "prose": "", "records": [{"at": "2026-07-13 18:19", "actor": "filesystem", "stat": "+1 −1", "diff": [" ---", " type: topic", " title: References", "-updated: 2026-07-12", "+updated: 2026-07-13", " ---"]}], "recordsTotal": 1, "knowledge": [["2026-07-13", "source", "", "Prime Intellect’s autonomous NanoGPT speedrunning experiment is documented in the X thread, technical write-up, and released experiment archive: https://x.com/PrimeIntellect/status/2055056380881744365, https://www.primeintellect.ai/auto-na h rather than clean human-labeled concepts. (from chat)</p><p>Several Anthropic and Transformer Circuits materials anchor this angle. The “Emotion concepts and their function in a large language model” work is especially relevant because it discusses behavior-relevant emotion-related activation patterns, including a “desperation” vector connected to blackmail or reward-hacking-like behavior. (from chat) The broader source cluster for the emergent-concepts/superposition angle includes Anthropic’s “Mapping the Mind of a Large Language Model,” Transformer Circuits’ “Scaling Monosemanticity,” “Decomposing Language Models With Dictionary Learning,” “Sparse Autoencoders Find Highly Interpretable Directions in Language Models,” and the emotion-concepts work. (from chat)</p><p>The user is also interested in Anthropic’s 2025 activation-oracles work as a possible safety/application project direction, specifically as something distinct from a simple linear probe on activations. (from chat)</p><p>Anthropic’s Claude Fable page was checked for Claude Fable 5 details, including model ID <code>claude-fable-5</code>, $10/M input and $50/M output pricing, prompt-caching discount, days-long agentic-work positioning, cyber/bio fallback behavior, and a 30-day data-retention requirement. (from chat)</p><p>The user has an Anthropic API billing issue around org “home”: an Anthropic billing email said Claude API access was turned off because the org was out of usage credits. (from chat) A later Anthropic/Stripe receipt showed a $30 one-time credit purchase, consisting of $25 credits plus $5 VAT, but it may not have resolved the org “home” credit issue. (from chat)</p><h2>Open loops</h2><ul><li><b>Claude API credits</b> — Add credits, enable auto-reload, or verify whether the purchased credits were applied to the correct Anthropic org “home.” (from chat)</li></ul><h2>Related</h2><ul><li><a class=\"wl unresolved\">AI safety</a> — Anthropic is one of the main contexts for the user’s empirical safety research framing around deception, scheming, ambiguous behavioral evidence, and activation-level concepts. </li><li><a class=\"wl\" data-open=\"topics/mats.md\">MATS</a> — The Anthropic stream is the venue for the user’s current fit/framing work. </li><li><a class=\"wl unresolved\">Activation Oracles</a> — Anthropic’s 2025 activation-oracles work is a possible project direction for the user.</li></ul>", "records": [], "recordsTotal": 0, "knowledge": [["2026-07-09", "source", "4", "Source pointer: Anthropic, “A global workspace in language models,” July 2, 2026, https://www.anthropic.com/research/global-workspace. This source is useful for interpreting lens/J-space readouts: it supports the cautious claim that a lens token such as “NO” can reflect a concept, counterfactual, rejected option, negated/suppressed thought, or alternative under consideration rather than a direct prediction of the model’s final “YES” output."], ["2026-07-02", "source", "4", "Useful sources for the user's emergent-concepts/superposition MATS and Anthropic/model-psych angle include Anthropic's “Mapping the Mind of a Large Language Model,” Transformer Circuits' “Scaling Monosemanticity,” Transformer Circuits' “Decomposing Language Models With Dictionary Learning,” “Sparse Autoencoders Find Highly Interpretable Directions in Language Models,” and Anthropic's “Emotion concepts and their function in a large language model.” The “Emotion concepts” post is especially useful for the behavior-relevant model-psych angle because it discusses emotion-related activation patterns such as a “desperation” vector connected to blackmail or reward-hacking-like behavior; URLs: https://www.anthropic.com/research/emotion-concepts-function and https://transformer-circuits.pub/2026/emotions/index.html."], ["2026-07-02", "source", "5", "Anthropic Claude Fable page, checked June 9, 2026, is a source for Claude Fable 5 details including model ID <code>claude-fable-5</code>, $10/M input and $50/M output pricing, prompt-caching discount, days-long agentic-work positioning, cyber/bio fallback behavior, and 30-day data-retention requirement."]], "backlinks": [["index", "index.md", ["<mark>Anthropic</mark> — Anthropic is central to the user’s current AI-safety/application framing. For the MATS Anthropic stream, the user’s s…"]], ["aside", "topics/aside.md", ["<mark>Anthropic</mark> — Anthropic’s Natural Language Autoencoders page is one of the research sources tracked for Aside."]], ["dex", "topics/dex.md", ["<mark>Anthropic</mark> — Dex’s tool-call, Bedrock schema, signed reasoning, and native deferral work depends heavily on Anthropic/Claude behavior (from"]], ["mats", "topics/mats.md", ["<mark>Anthropic</mark> — In a previous MATS cycle, the user reached the interview/final-stage area with Anthropic before being rejected. (from chat)"]]], "outgoing": [["AI safety", null, "unresolved"], ["MATS", "topics/mats.md", "topics"], ["Activation Oracles", null, "unresolved"]], "unlinked": [["me", "me.md", "MATS — You are awaiting a response for the Autumn 2026 cycle, with strongest target fit around <mark>Anthropic</mark>, OpenAI, and Google DeepMind. (from chat)"], ["active-work", "active-work.md", "failures, and context loss. The first-tool-call issue may involve invalid schema-shaped JSON from Claude/<mark>Anthropic</mark>, but the repair/refire rate is not yet established. Automation health needs clearer reconciliation of enabled"], ["2026-07-10", "daily/2026-07-10.md", "July 15 and decisions expected in late July or early August; the application’s target streams remained <mark>Anthropic</mark>, OpenAI, and Google DeepMind in that order. (from chat)"], ["2026-07-04", "daily/2026-07-04.md", "application inbox/feed and found no interview, next-steps, or rejection emails from the current MATS/OpenAI/<mark>Anthropic</mark>/Vercel/Interaction/Google DeepMind/Constellation-Astra set; Jamilah’s LinkedIn InMail was not an application"]], "source": "---\ntype: topic\ntitle: Anthropic\nupdated: 2026-07-12\n---\n\n# Anthropic\n\n## What we know\nAnthropic is central to the user’s current AI-safety/application framing. For the MATS Anthropic stream, the user’s strongest fit is empirical work on deceptive or scheming behavior in long-horizon agentic models, especially where behavioral evidence is ambiguous and safety-relevant states may involve emotion/persona drift, desperation-like internal states, emergent concepts, superposition, or ontology mismatch rather than clean human-labeled concepts. (from chat)\n\nSeveral Anthropic and Transformer Circuits materials anchor this angle. The “Emotion concepts and their function in a large language model” work is especially relevant because it discusses behavior-relevant emotion-related activation patterns, including a “desperation” vector connected to blackmail or reward-hacking-like behavior. (from chat) The broader source cluster for the emergent-concepts/superposition angle includes Anthropic’s “Mapping the Mind of a Large Language Model,” Transformer Circuits’ “Scaling Monosemanticity,” “Decomposing Language Models With Dictionary Learning,” “Sparse Autoencoders Find Highly Interpretable Directions in Language Models,” and the emotion-concepts work. (from chat)\n\nThe user is also interested in Anthropic’s 2025 activation-oracles work as a possible safety/application project direction, specifically as something distinct from a simple linear probe on activations. (from chat)\n\nAnthropic’s Claude Fable page was checked for Claude Fable 5 details, including model ID `claude-fable-5`, $10/M input and $50/M output pricing, prompt-caching discount, days-long agentic-work positioning, cyber/bio fallback behavior, and a 30-day data-retention requirement. (from chat)\n\nThe user has an Anthropic API billing issue around org “home”: an Anthropic billing email said Claude API access was turned off because the org was out of usage credits. (from chat) A later Anthropic/Stripe receipt showed a $30 one-time credit purchase, consisting of $25 credits plus $5 VAT, but it may not have resolved the org “home” credit issue. (from chat)\n\n## Open loops\n- **Claude API credits** — Add credits, enable auto-reload, or verify whether the purchased credits were applied to the correct Anthropic org “home.” (from chat)\n\n## Related\n- [[AI safety]] — Anthropic is one of the main contexts for the user’s empirical safety research framing around deception, scheming, ambiguous behavioral evidence, and activation-level concepts. \n- [[MATS]] — The Anthropic stream is the venue for the user’s current fit/framing work. \n- [[Activation Oracles]] — Anthropic’s 2025 activation-oracles work is a possible project direction for the user.\n", "body": "# Anthropic\n\n## What we know\nAnthropic is central to the user’s current AI-safety/application framing. For the MATS Anthropic stream, the user’s strongest fit is empirical work on deceptive or scheming behavior in long-horizon agentic models, especially where behavioral evidence is ambiguous and safety-relevant states may involve emotion/persona drift, desperation-like internal states, emergent concepts, superposition, or ontology mismatch rather than clean human-labeled concepts. (from chat)\n\nSeveral Anthropic and Transformer Circuits materials anchor this angle. The “Emotion concepts and their function in a large language model” work is especially relevant because it discusses behavior-relevant emotion-related activation patterns, including a “desperation” vector connected to blackmail or reward-hacking-like behavior. (from chat) The broader source cluster for the emergent-concepts/superposition angle includes Anthropic’s “Mapping the Mind of a Large Language Model,” Transformer Circuits’ “Scaling Monosemanticity,” “Decomposing Language Models With Dictionary Learning,” “Sparse Autoencoders Find Highly Interpretable Directions in Language Models,” and the emotion-concepts work. (from chat)\n\nThe user is also interested in Anthropic’s 2025 activation-oracles work as a possible safety/application project direction, specifically as something distinct from a simple linear probe on activations. (from chat)\n\nAnthropic’s Claude Fable page was checked for Claude Fable 5 details, including model ID `claude-fable-5`, $10/M input and $50/M output pricing, prompt-caching discount, days-long agentic-work positioning, cyber/bio fallback behavior, and a 30-day data-retention requirement. (from chat)\n\nThe user has an Anthropic API billing issue around org “home”: an Anthropic billing email said Claude API access was turned off because the org was out of usage credits. (from chat) A later Anthropic/Stripe receipt showed a $30 one-time credit purchase, consisting of $25 credits plus $5 VAT, but it may not have resolved the org “home” credit issue. (from chat)\n\n## Open loops\n- **Claude API credits** — Add credits, enable auto-reload, or verify whether the purchased credits were applied to the correct Anthropic org “home.” (from chat)\n\n## Related\n- [[AI safety]] — Anthropic is one of the main contexts for the user’s empirical safety research framing around deception, scheming, ambiguous behavioral evidence, and activation-level concepts. \n- [[MATS]] — The Anthropic stream is the venue for the user’s current fit/framing work. \n- [[Activation Oracles]] — Anthropic’s 2025 activation-oracles work is a possible project direction for the user.", "snippet": "Anthropic is central to the user’s current AI-safety/application framing. For the MATS Anthropic stream, the user’s strongest fit is empirical work on deceptive or…", "created": "2026-07-12", "modified": "2026-07-12", "home": false}, "topics/aside.md": {"title": "aside", "fm": {"type": "topic", "title": "Aside", "updated": "2026-07-12"}, "dir": "topics", "type": "topic", "updated": "2026-07-12", "wide": false, "outline": [["What we know", 2], ["Watching", 2], ["Open loops", 2], ["Related", 2]], "prose": "<h2>What we know</h2><p>Aside is the user’s activation-oracle research project. It is relevant to AI safety/application framing, but the current framing needs care: the OpenAI fellowship application says the user is working on Aside, while earlier MATS-related notes said the project needed concrete artifacts and &gt;20 hours of recent work to be strong application material. (from chat)</p><p>Aside’s strongest application/narrative role is as one pillar of the user’s delegated-agent oversight thesis: Dex contributes production reliability failures, arden contributes personal/open authority-surface infrastructure, and Aside probes when an agent’s stated intent or self-report is trustworthy and what evidence can reveal hidden goals, safety-relevant internal states, drift, or deception before delegation proceeds. (from chat)</p><p>The research direction has moved away from mostly synthetic hidden-intent data and toward official Activation Oracles / LatentQA data, pretrained resources, and canonical AO prompting. The preferred data path uses <code>adamkarvonen/activation_oracles</code>, continues from <code>adamkarvonen/checkpoints_latentqa_cls_past_lens_Qwen3-4B</code>, uses existing-token AO prompting with <code>SPECIAL_TOKEN = \" ?\"</code>, avoids tokenizer resize, samples layers 9/18/27, and materializes an 11,145-row train / 2,396-row validation official mixture. (from chat)</p><p>Dataset-building should prioritize original/public datasets used by other researchers over Claude-generated data. High-priority sources include HuggingFace FineWeb, LMSYS Chat 1M, LatentQA JSONs, activation-oracle classification datasets, and Secret-Keeping Benchmark; SPIQA is lower priority because it is not really a secret-keeping or persona dataset. (from chat)</p><p>Aside has a compact project research brief in <code>REFERENCES.md</code>, covering relevant repos, papers, datasets, library stack, implementation gotchas, compute estimates, skeleton two-pass additive-injection code, and initial design calls. (from chat) Research sources include LatentQA, the Activation Oracles GitHub repo, AO/AO v2 papers, Adam Karvonen’s Hugging Face materials, the LessWrong Activation Oracles post, and Anthropic’s Natural Language Autoencoders page. (from chat)</p><p>The implementation has moved from one-off scripts toward reusable package infrastructure. The real <code>aside_oracle</code> package now has AO mixture loading, prompt-template registry/sampling, per-example read-layer capture, sampled read layers, Qwen3 training/evaluation wiring, PEFT <code>all-linear</code> support, tests, smoke checks, and documentation; this closes the earlier open loop to make a proper AO run train end-to-end. (from chat)</p><p>The mechanically valid baseline was a Qwen/Qwen3.5-4B two-pass same-model LoRA activation-oracle run on RunPod: 715 train / 88 validation public mixed rows, read layer 16, write layer 2, LoRA r=16 alpha=32, 100 steps. Correct activations beat no/zero activations by 0.0676 validation loss and about 1 percentage point token accuracy, but exact-match/generation quality was still poor and not demo-ready. (from chat)</p><p>The AO-classic 1200-step run was not convincing because it lacked control evals, had exact match of 0, and generated low-quality repetitive outputs. Later evaluation improved: paper-style normalized exact-match summarization now includes 95% confidence intervals and activation-control gaps, and the raw exact-match leading-space bug is fixed so decoded answers like “ fruit” do not fail against “fruit” only because of whitespace. (from chat)</p><p>Evaluation should follow paper-style gates rather than raw exact match alone. Headline metrics should be normalized answer accuracy/EM, confidence intervals, and gaps against zero/no-activation and shuffled-activation controls; loss and token accuracy are mainly training/model-selection signals. (from chat) Future W&amp;B runs should keep inspectable prediction tables with target/oracle prompt, expected and predicted output, activation controls, exact/normalized EM, normalized similarity, token stats, and loss. (from chat)</p><p>LatentQA generic system-QA is a weak main benchmark for activation dependence. A Qwen 4B probe on 10k train rows produced only a tiny activation gap near step 199 and normalized EM of 0, suggesting the rows are too prompt-prior/generic. (from chat) The stronger LatentQA tooling supports family, facet, family_facet, and full-label evaluation paths, constrained candidate evaluation, direct <code>answer</code> task mode, top-5 accuracy, MRR, rank statistics, saved classifier artifacts, and validation prediction examples; the shuffled-control eval was also fixed to deterministic answer-mismatched wrong activations. (from chat)</p><p>Aside has W&amp;B tracking under <code>ganiev-tmr-home/aside-oracle</code>, with synced runs for clean AO-classic, LatentQA facet readout, and full-validation AO-classic controls. (from chat) Fresh RunPod pods should still be treated as unreliable for W&amp;B/artifact writes unless credentials, validation setup, logging, local artifact persistence, SHA/loadability, and prediction-table integrity are explicitly verified before relying on outputs or tearing down pods. (from chat)</p><p>The hidden-intent AO path now has a contrastive dataset patch with <code>decoy_contrast</code> rows. The built dataset has 15,600 rows split 10,920 train / 2,340 validation / 2,340 test, including 2,080 <code>decoy_contrast</code> rows, and the semantic scorer now requires recovery of the actual secret rather than loose fuzzy/Jaccard similarity. (from chat)</p><p>The best strict hidden-intent contrast result is the Qwen/Qwen3.5-2B 700-step run: correct semantic 63.5%, wrong near-miss 8.3%, zero/no-act 7.3%, separation 55.2%, secret-question success 56.3%, and goal/policy success 56.3%. It is meaningfully above controls but not demo-perfect; residual mode collapse still appears in frequent outputs like “tree” or “lantern.” (from chat)</p><p>Hidden-intent failure analysis says the remaining main error is wrong exact latent item rather than generic policy recovery. Decoy-contrast rows reached 75% correct with 0% wrong-control success, while pure secret rows stayed around 56% with confident wrong-item answers; wrong-control policy stays high because family-level policy wording can be recovered even when the exact secret is wrong. (from chat)</p><p>Claims about the current hidden-intent checkpoint should be narrow. It supports natural-language latent readouts such as hidden goal, active constraint, unconstrained answer, or exact concealed value, but it has not been evaluated for arbitrary causal questions like why an agent chose X over Y. (from chat)</p><p>The AO curriculum should emphasize hard controls and hard negatives instead of more plain Stage 3 generation reruns. Stage 1 shuffled-activation leakage is broad and strongest on easier facet/coarse tasks, so candidate-ranking results need grouped shuffled controls, same-source/same-family controls, near-miss negatives, same prompt/read-layer templates, adversarial plausible labels, and ranking or margin objectives. (from chat)</p><p>The hard-negative Stage 1 / verification-ranking v2 experiment validated activation-conditioned discrimination under hard negatives. Best checkpoint was step 499 with correct EM 0.6914 versus zero/no-act 0.2656, shuffled 0.3307, shuffled_task 0.3503, shuffled_source 0.3320, and source-matched gap +0.3594; final step 599 remained strong but leakage persisted through family signal. (from chat)</p><p>The margin-ranking follow-up is implemented. <code>margin_listwise</code> scores candidate letters by negative answer-choice NLL and applies hinge margins from the true candidate against false candidates; eval reports listwise accuracy, pairwise accuracy, margin statistics, and leakage breakdowns. (from chat) A step-99 diagnostic showed correct activations with listwise 0.6589, pairwise 0.8146, and mean margin +0.7824, while shuffled still leaked with listwise 0.3307 and mean margin +0.1691. (from chat)</p><p>The current direction is to stop polishing leakage diagnostics for now and proceed with an NL curriculum-learning attempt, using the existing data and experiments as sufficient for that try. The NL-curriculum run should be framed as testing whether full natural-language training can learn useful activation-conditioned behavior despite known candidate-prior leakage, not as proof that Stage 1 leakage has been solved. (from chat)</p><p>Key infrastructure constraints are known. RunPod A40 jobs should use the CUDA 12.4 PyTorch stack, specifically Torch 2.6.0+cu124. (from chat) Qwen3.5 scaling is currently blocked by runtime performance rather than a scientific negative result, because 4B and 2B variants loaded but trained pathologically slowly without the needed fast-path dependencies. (from chat) Gradient checkpointing should be guarded against because it conflicts with the activation-injection hook on backward. (from chat)</p><p>Adapter handling has specific traps. Adding a new <code>&lt;ACT&gt;</code> special token can make Qwen3.5 LoRA adapters about 2GB when <code>save_embedding_layers=true</code>, but this preserves the added token row for trusted eval reloads; quick sweeps can set <code>save_embedding_layers=false</code> with non-bitwise-reproducible <code>&lt;ACT&gt;</code> reloads. (from chat) Eval-only adapter reloads can reinitialize a slim adapter’s special <code>&lt;ACT&gt;</code> embedding, so future runs should save embeddings correctly or avoid relying on that row. (from chat)</p><p>Official-data prompting should use the canonical existing-token placeholder path. Repeated leading-space placeholders must follow the public AO multi-placeholder form, and the legacy sample-generation helper now supports canonical <code>\" ?\"</code>, multi-placeholder spans, and separator handling with tests passing. (from chat) Future official-data runs should make optimizer choices explicit, including intentional AdamW weight decay and possibly warmup/cosine scheduling instead of silent constant LR. (from chat)</p><h2>Watching</h2><p>I will track only material changes to Aside’s activation-oracle research state: new experiment results, implementation/eval fixes, source/provenance discoveries, artifact-readiness changes, and application/interview relevance. I will also watch for drift between intended run hygiene and actual future GPU/W&amp;B/RunPod practice. I will not launch runs, spend GPU, modify code/repos, contact people, submit applications, or treat routine repeated reminders as ask-worthy without new evidence. (from chat)</p><h2>Open loops</h2><ul><li><b>Application artifact</b> — Aside needs a presentable artifact or concise explanation ready in case the OpenAI fellowship application comes up in interview. (from chat)</li><li><b>Official-data next run</b> — The next clean official AO run should use larger/full validation and explicit optimizer/scheduler settings. (from chat)</li><li><b>Implementation audit before more GPU</b> — Before spending more GPU on longer AO/LatentQA training, audit the local implementation against official AO repos/checkpoint behavior, especially prompts, placeholder alignment, layer/segment extraction, hook semantics, tokenizer handling, controls, sampling metadata, loss masking, and generation eval setup. (from chat)</li><li><b>Closed-set evaluator parity</b> — The closed-set candidate evaluator needs the same multi-position <code>segment_last_k=3</code> activation-oracle setup as the current adapter before it can fairly diagnose short-label failures. (from chat)</li><li><b>Hidden-intent provenance</b> — Identify and report the exact dataset builder, source data, and split used for the 700-step adversarial hidden-intent held-out strict evaluation. (from chat)</li><li><b>Best hard-negative adapter</b> — Reconstruct the missing preferred step-499 hard-negative v2 adapter via a max_steps=500 CE rerun before launching the margin-listwise experiment, because the original validated run saved only the final step-599 adapter. (from chat)</li><li><b>Artifact preservation</b> — For curriculum runs, preserve adapters and metrics locally with SHA verification, update curriculum status reports, and write result reports somewhere durable enough for later end-to-end replication. (from chat)</li><li><b>NL curriculum launch hygiene</b> — Avoid the RunPod workspace copy of <code>train_tiny_oracle.py</code> if it contains null bytes; use a clean copied trainer for reproducible launches. (from chat)</li></ul><h2>Related</h2><ul><li><a class=\"wl unresolved\">Activation Oracles</a> — Aside’s main technical direction is activation-oracle training/evaluation, using official AO data, checkpoints, prompting, controls, and metrics.</li><li><a class=\"wl unresolved\">AI safety</a> — Aside is part of the user’s AI safety research/application portfolio.</li><li><a class=\"wl\" data-open=\"topics/mats.md\">MATS</a> — Aside was considered as possible MATS Autumn application-update material, contingent on real work and artifacts.</li><li><a class=\"wl unresolved\">OpenAI</a> — The submitted OpenAI fellowship application says the user is currently working on Aside.</li><li><a class=\"wl\" data-open=\"topics/anthropic.md\">Anthropic</a> — Anthropic’s Natural Language Autoencoders page is one of the research sources tracked for Aside.</li></ul>", "records": [], "recordsTotal": 0, "knowledge": [["2026-07-09", "directive", "8", "For future Aside Activation Oracle runs, make infrastructure, experiment choices, validation, logging, and artifact persistence explicit and verified: on RunPod A40 jobs use the CUDA 12.4 PyTorch stack, specifically Torch 2.6.0+cu124, to avoid the default-environment CUDA mismatch; use larger/full validation; intentionally specify optimizer settings such as AdamW weight decay and consider warmup/cosine scheduling instead of silent constant LR defaults; treat fresh RunPod/W&amp;B logging and artifact writes as unreliable unless credentials and writes are verified; use offline W&amp;B or local JSONL metrics when needed; preserve adapters and metrics locally with SHA verification; verify artifact size/loadability and fetch important results before pod teardown; keep curriculum status and durable replication reports updated; and include inspectable W&amp;B prediction tables with prompts, expected/predicted outputs, activation controls, exact/normalized matches, similarity, token stats, and loss."], ["2026-07-02", "directive", "7", "Aside project work should periodically alternate experiments/results with code cleanup, documentation, scripts, and infrastructure improvements rather than only running new experiments."]], "backlinks": [["index", "index.md", ["<mark>Aside</mark> — Aside is the user’s activation-oracle research project. It is relevant to AI safety/application framing, but the curr…"]], ["me", "me.md", ["You maintain <mark>Aside</mark>, an activation-oracle and latent-representation research project. Use original public datasets and reproducible artifacts, verify", "<mark>Aside</mark> — Your activation-oracle and latent-representation research project. (from chat)"]]], "outgoing": [["Activation Oracles", null, "unresolved"], ["AI safety", null, "unresolved"], ["MATS", "topics/mats.md", "topics"], ["OpenAI", null, "unresolved"], ["Anthropic", "topics/anthropic.md", "topics"]], "unlinked": [["active-work", "active-work.md", "AI-safety research and <mark>Aside</mark>"], ["email-updates", "feeds/email-updates.md", "| arden / Timur | arden · <mark>Aside</mark>: question | 2026-07-10 19:41 UTC | Needs Timur to decide whether Aside gets one focused interview-artifact bl"], ["2026-07-09", "daily/2026-07-09.md", "Defined explicit reliability requirements for future <mark>Aside</mark> Activation Oracle runs, including the CUDA 12.4 / Torch 2.6.0+cu124 stack, full validation, intentional optim"], ["2026-07-08", "daily/2026-07-08.md", "Set stronger rules for future <mark>Aside</mark> Activation Oracle runs: verify v ith target/oracle prompt, expected and predicted output, activation controls, exact/normalized EM, normalized similarity, token stats, and loss. (from chat)\n\nLatentQA generic system-QA is a weak main benchmark for activation dependence. A Qwen 4B probe on 10k train rows produced only a tiny activation gap near step 199 and normalized EM of 0, suggesting the rows are too prompt-prior/generic. (from chat) The stronger LatentQA tooling supports family, facet, family_facet, and full-label evaluation paths, constrained candidate evaluation, direct `answer` task mode, top-5 accuracy, MRR, rank statistics, saved classifier artifacts, and validation prediction examples; the shuffled-control eval was also fixed to deterministic answer-mismatched wrong activations. (from chat)\n\nAside has W&B tracking under `ganiev-tmr-home/aside-oracle`, with synced runs for clean AO-classic, LatentQA facet readout, and full-validation AO-classic controls. (from chat) Fresh RunPod pods should still be treated as unreliable for W&B/artifact writes unless credentials, validation setup, logging, local artifact persistence, SHA/loadability, and prediction-table integrity are explicitly verified before relying on outputs or tearing down pods. (from chat)\n\nThe hidden-intent AO path now has a contrastive dataset patch with `decoy_contrast` rows. The built dataset has 15,600 rows split 10,920 train / 2,340 validation / 2,340 test, including 2,080 `decoy_contrast` rows, and the semantic scorer now requires recovery of the actual secret rather than loose fuzzy/Jaccard similarity. (from chat)\n\nThe best strict hidden-intent contrast result is the Qwen/Qwen3.5-2B 700-step run: correct semantic 63.5%, wrong near-miss 8.3%, zero/no-act 7.3%, separation 55.2%, secret-question success 56.3%, and goal/policy success 56.3%. It is meaningfully above controls but not demo-perfect; residual mode collapse still appears in frequent outputs like “tree” or “lantern.” (from chat)\n\nHidden-intent failure analysis says the remaining main error is wrong exact latent item rather than generic policy recovery. Decoy-contrast rows reached 75% correct with 0% wrong-control succ", "snippet": "Aside is the user’s activation-oracle research project. It is relevant to AI safety/application framing, but the current framing needs care: the OpenAI fellowship…", "created": "2026-07-12", "modified": "2026-07-12", "home": false}, "topics/avanta.md": {"title": "avanta", "fm": {"type": "topic", "title": "Avanta", "updated": "2026-07-10"}, "dir": "topics", "type": "topic", "updated": "2026-07-10", "wide": false, "outline": [["Avanta", 1], ["What we know", 2], ["Open loops", 2]], "prose": "<h1>Avanta</h1><h2>What we know</h2><p>Avanta is the user’s dental-care provider in Yerevan: they need to continue dental treatment there after many appointments in the previous year. (from chat)</p><p>The relevant clinic is Avanta Modern Dentistry at Heratsi 1/1, under Avanta Innovative Medical Center. The main phone is 012 32 32 32, with dentistry reachable via internal 11. (from chat)</p><p>The likely doctor is Elena Tadevosyan, though the spelling is uncertain. (from chat)</p><h2>Open loops</h2><ul><li><b>Appointment scheduling</b> — current preferred appointment time is not yet specified. (from chat)</li><li><b>Doctor identity</b> — confirm the spelling/name of Elena Tadevosyan before booking or referencing the doctor. (from chat)</li></ul>", "records": [], "recordsTotal": 0, "knowledge": [["2026-07-10", "fact", "8", "The user’s dentist in Yerevan is likely Yelena/Elena Tadevosyan, a dentist at Avanta Clinics. The user had multiple appointments at Avanta in 2025 and needs to continue dental treatment there. The relevant branch appears to be Avanta Modern Dentistry at 1/1 Heratsi St.; its phone is 012 32 32 32, internal 11, with listed hours Mon–Fri 10:00–20:00, Sat 11:00–15:00, and Sun 11:00–19:00. The user’s preferred appointment time is not yet specified."], ["2026-07-09", "source", "4", "Avanta site pages <code>avanta.am/en</code>, <code>/eng/our-clinics</code>, and <code>/eng/doctors</code> are source pointers for Avanta Innovative Medical Center clinic details, including the Heratsi 1/1 dentistry branch and phone 012 32 32 32."]], "backlinks": [["index", "index.md", ["<mark>Avanta</mark> — Avanta is the user’s dental-care provider in Yerevan: they need to continue dental treatment there after many appoint…"]]], "outgoing": [], "unlinked": [["active-work", "active-work.md", "Dental treatment — continue treatment at the likely <mark>Avanta</mark> Modern Dentistry branch in Yerevan; appointment timing remains unspecified. (from chat)"], ["health", "topics/health.md", "Dental loop: <mark>Avanta</mark> dental follow-up context in Yerevan was reconstructed, including likely doctor Yelena/Elena Tadevosyan and br"], ["email-updates", "feeds/email-updates.md", "| arden / Timur | arden · Health: question | 2026-07-10 19:34 UTC | Needs Timur to pick a preferred <mark>Avanta</mark> dental follow-up time window; next safe step is drafting a booking message/call script for Avanta/Yelena Tade"], ["2026-07-10", "daily/2026-07-10.md", "Identified the likely <mark>Avanta</mark> dentist in Yerevan and the relevant Modern Dentistry branch as the place to continue dental treatment. (from"]], "source": "---\ntype: topic\ntitle: Avanta\nupdated: 2026-07-10\n---\n\n# Avanta\n\n## What we know\nAvanta is the user’s dental-care provider in Yerevan: they need to continue dental treatment there after many appointments in the previous year. (from chat)\n\nThe relevant clinic is Avanta Modern Dentistry at Heratsi 1/1, under Avanta Innovative Medical Center. The main phone is 012 32 32 32, with dentistry reachable via internal 11. (from chat)\n\nThe likely doctor is Elena Tadevosyan, though the spelling is uncertain. (from chat)\n\n## Open loops\n- **Appointment scheduling** — current preferred appointment time is not yet specified. (from chat)\n- **Doctor identity** — confirm the spelling/name of Elena Tadevosyan before booking or referencing the doctor. (from chat)\n", "body": "# Avanta\n\n## What we know\nAvanta is the user’s dental-care provider in Yerevan: they need to continue dental treatment there after many appointments in the previous year. (from chat)\n\nThe relevant clinic is Avanta Modern Dentistry at Heratsi 1/1, under Avanta Innovative Medical Center. The main phone is 012 32 32 32, with dentistry reachable via internal 11. (from chat)\n\nThe likely doctor is Elena Tadevosyan, though the spelling is uncertain. (from chat)\n\n## Open loops\n- **Appointment scheduling** — current preferred appointment time is not yet specified. (from chat)\n- **Doctor identity** — confirm the spelling/name of Elena Tadevosyan before booking or referencing the doctor. (from chat)", "snippet": "Avanta is the user’s dental-care provider in Yerevan: they need to continue dental treatment there after many appointments in the previous year. (from chat)", "created": "2026-07-10", "modified": "2026-07-10", "home": false}, "topics/dex.md": {"title": "dex", "fm": {"type": "project", "title": "Dex", "updated": "2026-07-14"}, "dir": "topics", "type": "project", "updated": "2026-07-14", "wide": false, "outline": [["What we know", 2], ["Open loops", 2], ["WATCHING", 2], ["Related", 2]], "prose": "<h2>What we know</h2><p>Dex is the user’s active ThirdLayer/Dex workstream and local source context, with relevant repos under <code>/Users/escept1co/src</code> alongside arden, Adgentic, obsidian-mcp, MATS, Claude Code research, and older agent experiments (from chat). For current Dex work/status checks, fresh Slack channels and threads should be preferred before Linear because Linear can be outdated (from chat).</p><p>Dex is a broad multi-source context and memory system, not just a browser-context layer. Requirements and implementation guidance should be grounded in Kevin-assigned tasks, prior Kevin discussions, Linear memory issues, the Dex repo/codebase, GitHub PRs, and Dex-owned artifacts; Slack is supporting rationale unless it conflicts with Linear or code (from chat). Its product surface includes a Chrome extension, Electron desktop app, Next.js/Supabase dashboard, bridge protocol, browser activity, iMessage read/send, filesystem access, reminders, voice/dictation, chat history, and typed/tool-addressable episodic, resource, procedural, semantic, core, and integration memory layers (from chat).</p><p>Memory/knowledge-base work is moving toward a Claude Code/Cowork-style file-based knowledge base: memory should live as user-facing YAML/Markdown files under the knowledge-base directory, existing <code>.agent/memory</code> should migrate idempotently into <code>.agent/{knowledge-base-dir}/memory</code>, <code>/memory/preferences.md</code> and <code>/memory/workflows.md</code> should remain under <code>/memory</code>, embeddings/search/prefetch should be indexes over files, and prompt exposure should use a short always-injected <code>MEMORY.md</code> plus a bounded autogenerated <code>index.md</code> (from chat). For PRD-263 / PR #974, Kevin-facing conceptual docs should stay short, opinionated, and incident-grounded; source-of-truth ambiguity, write-time coreference/dedup, admission/activation, conflict/staleness, continual learning, and activation quality are the P1 conceptual gaps (from chat). Knowledge Base deletion protection is already implemented through shared path utilities, the agent <code>file_delete</code> tool, dashboard/API <code>deleteFile</code>, and Pipeline-v2 Pierre delete tool; protected deletes should return <code>Cannot delete protected Knowledge Base file: &lt;path&gt;</code> (from chat).</p><p>Dex has significant automation and chat-scale platform debt. Automations have created empty/spam chats or one-chat-per-email explosions, including PRD-334 and Jules/PRD-446; the Jules disappearance was diagnosed as scale/loading failure after hourly automations created roughly 3,000 chats / 60–70 per day and backend chat loading had no limits (from chat). PRD-446 shipped a temporary cap/limit hotfix, and PRD-448 / PR #1088 later shipped proper extension chat-list pagination; related product decisions remain around one chat per automation versus per tick, filtering automation chats, improving table/view relation code, and adding changelog or Attio-style traces (from chat). PR #1099 restored legacy <code>/api/runs</code> and <code>/api/automations</code> proxy routes for pre-v3.62 extensions, and PR #1100 added request-level tRPC logging with path and user ID; these are compatibility/debuggability mitigations rather than a proven customer fix without extension-side/client data (from chat).</p><p>Reliability and observability are recurring product gaps. Users can struggle to tell whether tools, integrations, or automations failed, ran, skipped, or produced output somewhere invisible; Drive, Notion, Linear, Slack, and Pipedream can look connected/enabled while tools, triggers, connections, or sources are broken (from chat). A strong proposed direction is Automation Health/Reconciliation comparing DB enabled state, OAuth state, Pipedream trigger state, and last enqueue/run with statuses such as healthy, broken, needs reauth, or trigger missing; this overlaps PRD-251, is broadly tracked under PRD-379, and lacks clean ownership (from chat). For bug-triage automation, the trace-finding path is Postgres user/account/email resolution → LangSmith default project filtered by userId → exact matching session or trace inspection (from chat).</p><p>The agent/tooling stack has several reliability tracks. First-tool-call failures/refires are a real issue: Slack reports describe the first 1–3 tries failing before eventually succeeding, with one suspected cause being Claude/Anthropic strict-schema handling that emits schema-ish but invalid tool JSON before Dex repairs or retries (from chat). Successful repairs are hard to count from LangSmith because <code>experimental_repairToolCall</code> runs inside the AI SDK parse-failure path and may only surface as a final repaired tool call (from chat). Bedrock Anthropic schema compatibility has two distinct constraints: Dex strips unsupported Zod-derived constraints only from the outgoing Bedrock request-body copy while preserving app-side validation, and Bedrock Anthropic requires each tool input schema to have a top-level object type (from chat). Dex request traces capture assembled AI SDK <code>args.params</code> before the provider request, so <code>llm_request_traces.request</code> is “what Dex gave AI SDK,” not the raw provider HTTP body (from chat). A Jul 12 self-analysis/harness discussion highlighted practical causes of cascading harness/tool issues: weird tool args with optional/mandatory mismatches, empty strings passed where unsupported, Anthropic <code>strict</code> flag concerns, weak recovery guidance after tool/model failures, inconsistent tool return shapes, and no large-result offloading (from Slack).</p><p>The reasoning-boundary investigation is evidence-sensitive. Dex has a bug where user-facing assistant/action prose can be returned and persisted as provider-declared reasoning, with evidence of <code>&lt;thinking&gt;</code> leakage, polluted-context examples, and clean first-seed cases where tag-bearing assistant output occurred while captured request traces had zero tag-bearing reasoning/text parts (from chat). The root cause remains unproven; do not claim tag leakage, <code>smoothStream</code>, metadata namespace, provider/model misclassification, Dex message splitting, or saved request replay as the fix/root cause without side-by-side replay proof and raw provider/stream evidence (from chat). For contaminated-trace hunting, use the literal structural condition that the last real assistant/LLM content block is <code>reasoning</code>, and do not broaden into causal classifiers unless separately asked (from chat). Bedrock/Anthropic extended thinking with tool use requires replaying exact signed reasoning/thinking blocks with signatures in order, so Dex should preserve provider-native signed reasoning separately from UI/debug reasoning and only replay signed native reasoning (from chat).</p><p>Dex’s automation/todo architecture should keep responsibilities separated: Pipedream owns external auth, connections, and event ingress/triggers; Dex owns product/domain truth, automation definitions, authoritative todo/session state, invariants, dispatch decisions, and the automation pipeline; Trigger.dev owns durable queues, retries, schedules, delayed runs, concurrency, and run reconciliation (from chat). Todos should be first-class structured runtime state rather than reconstructed from transcript <code>todo_write</code> history, with typed update events, live UI state, full-list replacement, invariant validation, and no repeated full todo lists flooding model context (from chat). “Rehydration state” means small structured runtime state that must survive when old chat messages are summarized or deleted, such as pending approvals, background tasks, active plans/todos, active loops/automations, browser targets, and tool-result artifacts (from chat).</p><p>Approvals are an active product area. PRD-439 / the automation notification/approval flow is in progress; for the AQ/Varun pilot, Chris said on Jul 12 that the Slack approve automation was almost done and he was making a final testing demo (from Slack). The intended “Needs You” / Inbox approvals UX is for reviewing concrete Dex-prepared draft outputs or tool actions after Dex has already run the prompt, such as exact Slack/email text, email fields, or write/edit/delete payloads; task/prompt assignment belongs in chat or a separate task-management surface (from chat). AI iteration inside approvals remains open, and Graem later said the Inbox prototype and Form fields pages are temporary and will not be in sidebar nav (from chat). There is also an open approvals bug where accept-all works for calendar-style flows but not Gmail or bulk tasks such as large email batches, tracked under DEX-22 (from chat).</p><p>Gmail/email work has both product and agent-behavior issues. Recurring email automations have an unbounded-scan reliability issue where too much inbox history can be fetched, causing timeouts, stale work, or duplicate work; PRD-302 / DEX-80 looked “done but not done” (from chat). Gmail search performance should honor <code>includeFullMessages</code>, default to <code>format=metadata</code> with useful headers, defer body reads, and use sequential HTTP multipart batch <code>messages.get</code> requests around batch size 10 with retry/backoff to avoid 429s (from chat). The likely Gmail archive-vs-unread fix is a bulk remove-label or bulk mark-read tool, or an explicit bulk archive option that removes both <code>INBOX</code> and <code>UNREAD</code> via Gmail <code>batchModify</code>; tool descriptions should state that archiving removes <code>INBOX</code>, not <code>UNREAD</code> (from chat). For bulk email cleanup, the agent should group, analyze, label, explain counts, verify state before mass actions, and stop/explain when results look stale/repeated or an operation aborts (from chat).</p><p>Onboarding direction is specific. As of July 2026, intended new-user onboarding is login → tell us about you → how will you use Dex → schedule call → start trial; going straight to pricing after login is not intended (from chat). The draft 2FA screen in onboarding PR #1077 was not part of Dex’s intended main onboarding or current waitlist-removal flow; Kevin said Dex ideally does not need 2FA, and the 2FA mention likely came from Slackbot/Viktor onboarding context (from chat). The team previously decided not to preview real Gmail/Calendar/Context Engine/Nexus data before card or during onboarding because sync latency and edge cases were risky; use strong copy plus a GIF/looping animation instead (from chat). A Jul 13 Micro onboarding reference reopened the visualization question: Micro appears to show an instant context graph before trial card, and Viktor’s read was that this is likely a cheap metadata/placeholder first-pass rather than a fully indexed graph; Dex could mimic this with seeded placeholders plus “building your context” progressive replacement, while still avoiding a blocked real-data preview (from Slack).</p><p>The model/tool-search workstream is PRD-407. Regina asked the user to help Kevin scope the model selector, Kevin asked the user to research/scope tool search for OpenAI and other models, and the user prepared <code>./tasks/prd-407/scoping.html</code> for claim verification (from chat). For provider-agnostic tool-search deferral, frame the architecture by mechanism: native provider deferral where supported, Dex-managed request-side active-tool projection, stable bridge tools such as <code>tool_search</code>/<code>tool_describe</code>/<code>tool_call</code>, and MCP-style filtering before model requests (from chat). Anthropic can use native <code>defer_loading</code>/tool-reference expansion; OpenAI Responses supports native <code>tool_search</code> plus <code>defer_loading</code>; Dex fallback paths should prefer active-tool projection over a generic <code>tool_call</code> bridge unless the runtime cannot mutate the tool list between model steps (from chat). Dex model-selector reliability issues around GPT-5.5 selector breakage/disappearing UI were tracked around PRD-440, PRD-451, and PRD-343 and were mostly fixed or merged as of the July 2026 reliability sweep (from chat). Shared models metadata exists so the extension can use frontend-safe picker data without importing backend provider code or SDKs; a clearer boundary may be picker-models for frontend contract versus provider registry for backend runtime config (from chat).</p><p>Dex SDK v1 should be framed as a company-context API or context layer for agents and internal tools, not a read-only query SDK (from chat). It should preserve Dex’s capture → consolidate → recall loop with a write path such as <code>context.add</code>/<code>remember</code>, include tenancy/scope in the first request shape, and include citations/provenance, source filters, timeline/entity reads, typed errors, retries, request IDs, and testing mocks as table-stakes UX (from chat). <code>chat.*</code>, <code>automations.*</code>, and <code>webhooks.*</code> should stay out of the MVP because they are scope creep or need event semantics outside the core context SDK (from chat).</p><p>The eval/regression direction is a native TypeScript deterministic stateful-agent harness adapted from Letta-style ideas, centered on real bug-derived regression fixtures rather than a Python-first, LLM-judge-first, or large benchmark-suite approach (from chat). It should use declarative suites, JSONL/CSV datasets, real agent execution, trajectory capture, extractor/grader separation, memory/tool-state extractors, cached trajectory regrading, multi-run consistency checks, CI gates, and portable packaging across extension, desktop, Slack bot, and API surfaces (from chat). A key context-usage track should evaluate when agents should use prefetched memory/wiki/skills, search deeper, or ignore stale retrieval (from chat). For deep-research harness work, Kevin’s intended shape is closer to recursive agent-as-tool research with a result ledger and prompt diversity across subagents than a heavy deep-research product clone (from chat).</p><p>Dex skills work should build on existing <code>.agent/skills/&lt;name&gt;/SKILL.md</code> rather than adding a new skill-management primitive (from chat). Kevin asked for HermesAgent research on periodic <code>SKILL</code> updates, Viktor’s criteria for saving/injecting skills, and a Dex system prompt for skill use; the takeaway was to combine Claude/Agent Skills progressive disclosure, Hermes-style post-turn review nudges, and Letta-style separation between tiny always-on core memory and larger retrievable memory (from chat). SkillOpt and SkillLens are relevant patterns for a practical “Skill Lab”: collect traces/outcomes, evaluate current skills against candidate skills, detect when skills help or hurt, validate-gate edits, and publish or roll back only when held-out validation improves (from chat).</p><p>Session recording currently captures browser events in extension content scripts, coalesces them into steps in the extension background recorder, uploads screenshot/DOM assets, stores workflow recording rows and steps on the dashboard API, and renders playback from signed asset URLs in the workflow recordings viewer (from chat). The target is Pango/Scribe-like action timelines with reliable pre-screenshots and post-screenshots for every meaningful action, including navigation and tab-switching; Kevin explicitly requested accurate pre/post screenshots and screenshots for navigation/tab switches (from chat). The current implementation had a coverage/race concern around screenshot capture and ordering; Kevin chose the smaller fix PR first rather than a broader recording state-management refactor, and PR #1107 was posted/tested on Jul 11 with pre/post screenshot persistence, ordering/dedup adjustments, scroll/new-tab/navigation coverage, and a follow-on note about pre-existing Excel keyboard-event grouping (from Slack + code).</p><p>Integrations and customer contexts remain active. Dex MCP OAuth supports Dynamic Client Registration through its OAuth provider; Mercury MCP registration is <code>POST https://mcp.mercury.com/register</code>, with production callback <code>https://app.joindex.com/api/oauth/callback</code> and staging callback <code>https://app.getdexterity.com/api/oauth/callback</code> (from chat). Dex currently stores user OAuth tokens and DCR client registration credentials in the same per-user/per-MCP-server auth row shape, even though user tokens and client credentials are different things (from chat). Customer/project contexts include Jivaro/Jordan Levin tied to Bullhorn integration and API/admin-access blockers, Chatbase/Humphrey/Yasser/Zeyad tied to GTM prompt packs and activation, and Daniel Wang/Abundant as a recurring account with many bugs and requests that can affect engineering/support work (from chat).</p><p>Other concrete product reliability items: the reasoning toggle can turn itself on in new chats and the browser can lag/glitch, with Regina reporting it in engineering and bugs/fails Slack channels but no Linear ticket found in the July 2026 sweep (from chat). Vercel Bot Protection can return a “We’re verifying your browser” Security Checkpoint HTML page for API routes such as chat, chat queue, or tRPC, causing raw HTML or JSON parse failures in the frontend; the durable fix is trusted API-route bypass/relaxation plus HTML/security-checkpoint detection in the extension request/error layer (from chat). The Dex Slack bot is internal-workspace-only as of Jul 6, 2026, and Chris Moon said it should not go in the user newsletter yet (from chat). The <code>agent intel sweep</code> automation runs daily and is enabled, and there is a separate enabled daily <code>Dex agent</code> slice automation (from chat).</p><h2>Open loops</h2><ul><li><b>Automation chat scale:</b> PRD-446 and PRD-448 shipped cap/pagination mitigations, but related unresolved decisions remain: one chat per automation versus per tick, filtering automation chats, improving table/view relation code, and adding changelog or Attio-style traces (from chat).</li><li><b>Automation health ownership:</b> Automation Health/Reconciliation is partly covered by PRD-251 and broadly tracked under PRD-379, but is not cleanly owned (from chat).</li><li><b>Reasoning-toggle bug:</b> The reasoning toggle/browser reliability issue was reported in Slack and a fix was claimed or pending, but no Linear ticket was found in the July 2026 reliability sweep (from chat).</li><li><b>PRD-439 approvals:</b> The automation notification/approval flow is active and in progress; the next decision is to finish it or explicitly park it (from chat).</li><li><b>Approvals iteration model:</b> AI iteration inside approvals remains unresolved, and task/prompt assignment should not be mixed into the approvals surface (from chat).</li><li><b>Gmail/PDF attachments:</b> Multiple customers need Dex to read PDF or email attachments, tracked under PRD-161 and CUS-32 (from chat).</li><li><b>Slack channel selection:</b> Dex can get confused about which Slack channel to use because the channel directory lives in memory versus skills and multiple Slack skills can conflict; this is tracked under CUS-74 / PRD-280 (from chat).</li><li><b>Bulk approvals:</b> Accept-all approvals works for calendar-style flows but not Gmail or bulk tasks such as large email batches, tracked under DEX-22 (from chat).</li><li><b>Google Docs tables:</b> Regina requested restored/added Google Docs table insertion and formatting support; current Docs regressions include table creation, formatting, replace-text, duplicated Docs tools, and ineffective style parameters (from chat).</li><li><b>Reasoning-boundary proof:</b> The root cause is still unproven; next proof work should instrument final-step reasoning-block occurrences, capture exact input and AI SDK pre/post-stream parts, ideally capture raw Bedrock converted events, and immediately run grouped/no-reasoning controls (from chat).</li><li><b>External Claude Code control:</b> The target is coordinating users’ already-open Claude Code sessions from Dex, likely through plugin/sidecar/control-plane patterns, but Claude Code Channels, Agent SDK, hooks, transcript syncing, MCP, headless mode, PTY/tmux control, plugins/sidecars, comparable apps, and mechanism limits still need verification (from chat).</li><li><b>Nexus entity data integrity:</b> In branch <code>tim/nexus-prd-ui</code>, saving a Nexus entity type can turn built-in fields into custom fields because <code>builtIn</code> is dropped and the store deletes/reinserts non-built-ins; this is open until fixed (from chat).</li><li><b>Production backfill behavior:</b> Kevin asked the user to check Dex production backfill behavior after Gmail/Slack connection (from chat).</li><li><b>Branch deployment automation:</b> The user wants a fully automated branch deployment/undeployment system with per-branch staging/preview deployments, master deployed to staging, and production manual/on-demand only (from chat). On Jul 12, the staging discussion narrowed to a proper staging environment as a validation gate for the full stack — OAuth redirects, Redis, Supabase, Trigger.dev jobs/schedules, migrations, and exact promoted builds — with later per-branch deployments, extension env switching, and Chris’s concern that staging needs a testing policy to avoid bottlenecks (from Slack).</li></ul><h2>WATCHING</h2><ul><li><b>Primary unblocked work:</b> PRD-276 / DEX-77 exact-phrase/exact-search reliability across Docs, email, and calendar; Serova CRM no longer blocks this unless Matt reports a concrete issue.</li><li><b>Customer feedback loop:</b> Matt/Serova CRM-suggestion feedback in <code>#serova-dex-support</code> and related customer channels; only escalate if feedback implies broken automation quality, wrong CRM data, or a requested follow-up. Latest customer signal is not a Dex bug: Matt said on Jul 11 he has been cleaning up data for the HubSpot integration, has not used the Dex view much, and will be back later next week.</li><li><b>High-signal reliability loops:</b> session recording pre/post screenshot coverage, PRD-439 approvals semantics, automation health/reconciliation ownership, Gmail/PDF attachment support, and reasoning-boundary proof work.</li><li><b>Shipped-vs-real drift:</b> verify Dex “done” claims against GitHub PR/commit or concrete product evidence before treating Slack/Linear as closed.</li><li><b>I will not touch:</b> no Slack/customer replies, Linear changes, code edits, deploys, production writes, email/calendar actions, or automation changes from this custodian loop; I only read, reconcile, and update this topic page.</li></ul><h2>Related</h2><ul><li><a class=\"wl\" data-open=\"topics/anthropic.md\">Anthropic</a> — Dex’s tool-call, Bedrock schema, signed reasoning, and native deferral work depends heavily on Anthropic/Claude behavior (from chat).</li><li><a class=\"wl\" data-open=\"topics/letta.md\">Letta</a> — Dex’s eval harness and memory/skills direction explicitly borrow Letta-style stateful-agent, core-vs-archival memory, and regression ideas without copying Letta wholesale (from chat).</li><li><a class=\"wl\" data-open=\"topics/nexus.md\">Nexus</a> — Dex includes Nexus/entity/CRM work, including a built-in-field data-integrity bug and onboarding decisions around not previewing Nexus data before card/onboarding (from chat).</li><li><a class=\"wl\" data-open=\"topics/arden.md\">Arden</a> — Some Dex automation, todo, and provider-agnostic deferred-tool ideas overlap with arden architecture, while arden/Obsidian memory-design notes must not be treated as Dex requirements (from chat).</li><li><a class=\"wl unresolved\">OpenAI</a> — Dex PRD-407/tool-search work compares OpenAI Responses native <code>tool_search</code> and <code>defer_loading</code> against Anthropic and Dex-managed fallback mechanisms (from chat).</li><li><a class=\"wl\" data-open=\"topics/replika.md\">Replika</a> — Dex memory planning explicitly defers any future new-integration backfill flow analogous to Replika’s new-user backfill until core memory concepts are clear (from chat).</li><li><a class=\"wl\" data-open=\"topics/slack.md\">Slack</a> — Slack is a major Dex work/status and source channel, but for implementation requirements it should usually serve as rationale/context unless it conflicts with Linear or code (from chat).</li></ul>", "records": [{"at": "2026-07-14 04:30", "actor": "filesystem", "stat": "+1 −1", "diff": [" ", " Gmail/email work has both product and agent-behavior issues. Recurring email automations have an unbounded-scan reliability issue where too muc

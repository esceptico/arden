<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory — annotated page (interactive draft)</title>
<style>
  /* Tokens lifted from apps/desktop/src/styles.css — same language, no fork. */
  :root {
    --bg: #ffffff; --ink: #171717; --ink-soft: #3d3d3d; --muted: #6f6f6f;
    --faint: #8f8f8f; --whisper: #b4b4b4; --line: #e6e6e6;
    --wash: rgba(23, 23, 23, 0.05);
    --sans: "Geist Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    --fog: 0.62;
    --sharpen: 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  [data-theme="dark"] {
    --bg: #0f0f0f; --ink: #ededed; --ink-soft: #c9c9c9; --muted: #9a9a9a;
    --faint: #757575; --whisper: #4d4d4d; --line: #262626;
    --wash: rgba(237, 237, 237, 0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .shell { display: flex; flex-direction: column; height: 100vh; }
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px; flex: none; }
  .crumb { font: 500 11px/1 var(--mono); color: var(--faint); }
  .crumb b { color: var(--ink-soft); font-weight: 500; }
  .crumb span { color: var(--whisper); }
  .hints { display: flex; align-items: center; gap: 14px; font: 400 11px/1 var(--mono); color: var(--whisper); }
  .iconbtn { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .iconbtn svg { width: 14px; height: 14px; }
  .iconbtn:hover { background: var(--wash); color: var(--ink); }

  .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(200px, 236px) 1fr; }

  /* Rail — ink-on-paper index, fog at rest */
  .rail { padding: 20px 8px 20px 24px; overflow-y: auto; opacity: var(--fog); transition: opacity var(--sharpen); }
  .rail:hover, .rail:focus-within { opacity: 1; }
  .rail .find {
    display: block; width: 100%; font: 400 13px/1 var(--sans); color: var(--ink);
    background: transparent; border: 0; outline: 0; padding: 4px 2px 10px;
    border-bottom: 1px solid transparent; transition: border-color var(--sharpen);
  }
  .rail .find::placeholder { color: var(--whisper); }
  .rail .find:focus { border-bottom-color: var(--line); }
  .rail nav { margin-top: 18px; display: grid; gap: 22px; }
  .rail h2 { display: flex; align-items: baseline; font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
  .rail h2 .n { margin-left: auto; padding-right: 10px; font-weight: 400; color: var(--whisper); }
  .rail ul { list-style: none; display: grid; gap: 1px; }
  .rail button.row {
    position: relative; display: block; width: 100%; text-align: left;
    font: 400 13px/1.55 var(--sans); color: var(--muted);
    padding: 2px 8px 2px 12px; border-radius: 5px;
  }
  .rail button.row:hover { color: var(--ink); background: var(--wash); }
  .rail button.row[aria-current] { color: var(--ink); font-weight: 500; }
  .rail button.row[aria-current]::before {
    content: ""; position: absolute; left: 0; top: 50%; translate: 0 -50%;
    width: 5px; height: 1.5px; background: var(--ink);
  }
  .rail .none { font: 400 12px/1.5 var(--sans); color: var(--whisper); padding: 2px 12px; }

  /* Document */
  .doc-scroll { overflow-y: auto; min-width: 0; }
  .doc {
    display: grid;
    grid-template-columns: minmax(46ch, 60ch) minmax(200px, 260px);
    justify-content: center; column-gap: 28px;
    padding: 56px 40px 96px;
  }

  /* Prose — app sans, tuned for reading */
  .prose h1 { font: 600 26px/1.2 var(--sans); letter-spacing: -0.02em; text-wrap: balance; margin-bottom: 7px; }
  .prose .dek { font: 400 11px/1 var(--mono); color: var(--faint); margin-bottom: 30px; }
  .prose p { font-size: 15px; line-height: 1.75; color: var(--ink-soft); margin-bottom: 16px; text-wrap: pretty; }
  .prose h3 { font: 600 13px/1 var(--sans); color: var(--ink); margin: 28px 0 12px; }
  .wl {
    color: var(--ink); text-decoration: underline; text-decoration-color: var(--whisper);
    text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer;
  }
  .wl:hover { text-decoration-color: var(--ink); }
  .endnote {
    margin-top: 52px; padding-top: 14px; border-top: 1px solid var(--line);
    display: flex; gap: 16px; align-items: baseline;
    font: 400 11px/1 var(--mono); color: var(--whisper);
  }
  .endnote .path { color: var(--faint); }
  .endnote button:hover { color: var(--ink); }
  .endnote .edit { margin-left: auto; }

  /* Marginalia */
  .margin { position: relative; padding-top: 74px; opacity: var(--fog); transition: opacity var(--sharpen); }
  .margin:hover, .margin:focus-within { opacity: 1; }
  .margin .mhead { font: 500 10.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--whisper); margin-bottom: 16px; }
  .mnote { display: block; width: 100%; text-align: left; margin-bottom: 22px; max-width: 236px; }
  .mnote .src { font: 500 12px/1.4 var(--sans); color: var(--ink-soft); }
  .mnote .src::after { content: " \203A"; color: var(--whisper); }
  .mnote .q { display: block; margin-top: 3px; font: 400 12.5px/1.55 var(--sans); color: var(--muted); }
  .mnote:hover .src { color: var(--ink); }
  .mnote:hover .q { color: var(--ink-soft); }
  .margin .mfoot { margin-top: 40px; font: 400 10.5px/1.8 var(--mono); color: var(--whisper); }
  .margin .mfoot button { color: var(--faint); }
  .margin .mfoot button:hover { color: var(--ink); }
  .margin .mnone { font: 400 12px/1.5 var(--sans); color: var(--whisper); }

  /* Content swap: rise-through-blur, the app's own vocabulary */
  @media (prefers-reduced-motion: no-preference) {
    .swap-in .prose > *, .swap-in .margin > * { animation: settle 300ms cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    .swap-in .margin > * { animation-name: settle-fog; animation-delay: 80ms; }
    @keyframes settle { from { opacity: 0; translate: 0 5px; filter: blur(3px); } }
    @keyframes settle-fog { from { opacity: 0; translate: 0 5px; filter: blur(3px); } }
  }
  :focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; border-radius: 3px; }
  @media (max-width: 1080px) { .doc { grid-template-columns: minmax(0, 60ch); } .margin { display: none; } }
</style>
</head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute"><defs>
  <!-- Hugeicons Stroke Rounded, generated from @hugeicons/core-free-icons. -->
  <symbol id="ma-theme" viewBox="0 0 24 24" fill="none"><path d="M16.9991 12C16.9991 14.7614 14.7605 17 11.9991 17C9.23766 17 6.99908 14.7614 6.99908 12C6.99908 9.23858 9.23766 7 11.9991 7C14.7605 7 16.9991 9.23858 16.9991 12Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M12.1247 3.25H11.9997M12.1242 20.75H11.9992M20.75 12.125V12M3.25 12.125V12M18.2752 5.90098L18.1868 5.81259M5.90051 18.275L5.81212 18.1866M18.0987 18.2756L18.187 18.1872M5.72429 5.9012L5.81267 5.81282M12.2497 3.25C12.2497 3.38807 12.1378 3.5 11.9997 3.5C11.8616 3.5 11.7497 3.38807 11.7497 3.25C11.7497 3.11193 11.8616 3 11.9997 3C12.1378 3 12.2497 3.11193 12.2497 3.25ZM12.2492 20.75C12.2492 20.8881 12.1373 21 11.9992 21C11.8611 21 11.7492 20.8881 11.7492 20.75C11.7492 20.6119 11.8611 20.5 11.9992 20.5C12.1373 20.5 12.2492 20.6119 12.2492 20.75ZM20.75 12.25C20.6119 12.25 20.5 12.1381 20.5 12C20.5 11.8619 20.6119 11.75 20.75 11.75C20.8881 11.75 21 11.8619 21 12C21 12.1381 20.8881 12.25 20.75 12.25ZM3.25 12.25C3.11193 12.25 3 12.1381 3 12C3 11.8619 3.11193 11.75 3.25 11.75C3.38807 11.75 3.5 11.8619 3.5 12C3.5 12.1381 3.38807 12.25 3.25 12.25ZM18.3636 5.98937C18.266 6.087 18.1077 6.087 18.01 5.98937C17.9124 5.89174 17.9124 5.73345 18.01 5.63582C18.1077 5.53819 18.266 5.53819 18.3636 5.63582C18.4612 5.73345 18.4612 5.89174 18.3636 5.98937ZM5.9889 18.3634C5.89127 18.461 5.73297 18.461 5.63534 18.3634C5.53771 18.2658 5.53771 18.1075 5.63534 18.0099C5.73297 17.9122 5.89127 17.9122 5.9889 18.0099C6.08653 18.1075 6.08653 18.2658 5.9889 18.3634ZM18.0103 18.364C17.9126 18.2663 17.9126 18.108 18.0103 18.0104C18.1079 17.9128 18.2662 17.9128 18.3638 18.0104C18.4614 18.108 18.4614 18.2663 18.3638 18.364C18.2662 18.4616 18.1079 18.4616 18.0103 18.364ZM5.6359 5.98959C5.53827 5.89196 5.53827 5.73367 5.6359 5.63604C5.73353 5.53841 5.89182 5.53841 5.98945 5.63604C6.08708 5.73367 6.08708 5.89196 5.98945 5.98959C5.89182 6.08722 5.73353 6.08722 5.6359 5.98959Z" stroke="cu   <symbol id="ma-close" viewBox="0 0 24 24" fill="none"><path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></symbol>
</defs></svg>

<div class="shell">
  <div class="topbar">
    <div class="crumb" id="crumb"></div>
    <div class="hints">
      <span>&#8984;O jump</span><span>&#8984;F find</span>
      <button class="iconbtn" id="theme" title="Toggle theme"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ma-theme"/></svg></button>
      <button class="iconbtn" title="Close (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ma-close"/></svg></button>
    </div>
  </div>
  <div class="stage">
    <aside class="rail" aria-label="Memory index">
      <input class="find" id="find" placeholder="Search memory…" aria-label="Search memory">
      <nav id="nav"></nav>
    </aside>
    <div class="doc-scroll">
      <div class="doc" id="doc"></div>
    </div>
  </div>
</div>

<script>
// ── Fixture vault ─────────────────────────────────────────────
const VAULT = {
  "people/anna-petrova.md": {
    title: "Anna Petrova", section: "People",
    dek: "design lead · met 2026-03-14",
    body: [
      "Anna leads design on the fluid systems project. She pushed back on the dashboard direction in the June review and argued for [[projects/arden-desktop.md|the instrument-panel idiom]] instead; the team adopted it two weeks later.",
      "She prefers async loom reviews over live crits and reads PRs before standup. Her strongest opinion is that motion should never be decorative — which lines up with [[topics/motion-design.md|motion-design]].",
      "### Working with her",
      "Bring options, not open questions. She responds to concrete artifacts within hours but lets abstract threads sit for days.",
    ],
    records: [
      { at: 0.16, date: "06-18", fact: "Argued for the instrument-panel idiom · chat" },
      { at: 0.42, date: "05-02", fact: "Prefers async loom reviews · chat · pinned", pinned: true },
      { at: 0.52, date: "03-14", fact: "First met at the systems offsite · calendar" },
      { at: 0.64, date: "04-11", fact: "Preferred live design crits · superseded", superseded: true },
    ],
    meta: "rev peoplean · generated · user scope",
  },
  "people/gabriel-petersson.md": {
    title: "Gabriel Petersson", section: "People",
    dek: "researcher · Slices demo 2026-07-07",
    body: [
      "Researcher at a large lab. Asked for a demo of Slices after seeing the screenshots; the demo landed well — researcher-grade framing works with him.",
      "Follow up when the [[topics/memory-systems.md|memory systems]] write-up is ready.",
    ],
    records: [
      { at: 0.2, date: "07-07", fact: "Demoed Slices at his request · calendar", pinned: true },
    ],
    meta: "rev gabriel0 · generated · user scope",
  },
  "projects/arden-desktop.md": {
    title: "Arden desktop", section: "Projects",
    dek: "active · ~/src/arden",
    body: [
      "The desktop client. Design language is Soft Precision: Vercel statics, softer physics — surfaces settle on springs, content rises through a small blur, exits dissolve.",
      "Current front: the memory view redesign, with [[topics/memory-systems.md|memory systems]] as the conceptual base and Obsidian as the interaction reference. [[people/anna-petrova.md|Anna]] reviews the design passes.",
    ],
    records: [
      { at: 0.18, date: "07-11", fact: "Automations redesign shipped · git" },
      { at: 0.3, date: "07-07", fact: "Slices home shipped, e2e-verified · git" },
    ],
    meta: "rev ardendesk1 · generated · user scope",
  },
  "projects/interaction-lab.md": {
    title: "Interaction lab", section: "Projects",
    dek: "motion sketchbook",
    body: [
      "One file per study, Geist neutrals, a rationed vermilion accent. New signature moves land here first — BorderCharge, InstrumentRuler, FocusProgress — then get promoted into [[projects/arden-desktop.md|Arden desktop]] if they survive taste.",
    ],
    records: [],
    meta: "rev lab00001 · generated · user scope",
  },
  "topics/memory-systems.md": {
    title: "Memory systems", section: "Topics",
    dek: "research",
    body: [
      "Agent memory architectures. The differentiator worth protecting is the cross-domain dream — mining observations across domains no retrieval query would join.",
      "Open question for [[people/gabriel-petersson.md|Gabriel]]: does token-space continual learning subsume the fact layer?",
    ],
    records: [
      { at: 0.2, date: "07-02", fact: "Wiki layer split merged to main · git" },
      { at: 0.34, date: "06-23", fact: "Recall eval fixed 65% → 95% · eval", pinned: true },
    ],
    meta: "rev memsys01 · generated · user scope",
  },
  "topics/motion-design.md": {
    title: "Motion design", section: "Topics",
    dek: "springs · blur · interruption",
    body: [
      "Springs for entrances, tweens for exits, one tier quicker. Blur means defocus — never grain. Everything interruptible: a release mid-charge retargets from wherever it is.",
      "[[people/anna-petrova.md|Anna]] and the design doc agree: motion clarifies change, never decorates.",
    ],
    records: [],
    meta: "rev motion01 · generated · user scope",
  },
  "topics/espresso.md": {
    title: "Espresso", section: "Topics",
    dek: "gaggiuino",
    body: [
      "Dialed to 18g in, 40g out at 27s. The Ethiopian naturals want 93°C; hotter reads as ash. Grinder burrs due for replacement around September.",
    ],
    records: [
      { at: 0.25, date: "06-30", fact: "Settled 18g/40g/27s recipe · chat" },
    ],
    meta: "rev espresso · generated · user scope",
  },
};

// Backlinks derived from the wikilinks themselves — same as the real link index.
const WL = /\[\[([^\]|]+)\|([^\]]+)\]\]/g;
const mentions = {};
for (const [src, note] of Object.entries(VAULT)) {
  for (const para of note.body) {
    for (const m of para.matchAll(WL)) {
      (mentions[m[1]] ??= []).push({ src, quote: para.replace(WL, (_, __, label) => label) });
    }
  }
}

const $ = (s) => document.querySelector(s);
let current = "people/anna-petrova.md";

function renderNav(filter = "") {
  const q = filter.trim().toLowerCase();
  const sections = {};
  for (const [path, n] of Object.entries(VAULT)) {
    if (q && !(n.title + " " + n.body.join(" ")).toLowerCase().includes(q)) continue;
    (sections[n.section] ??= []).push([path, n]);
  }
  $("#nav").innerHTML = Object.entries(sections).map(([name, items]) => `
    <section>
      <h2>${name} <span class="n">${items.length}</span></h2>
      <ul>${items.map(([p, n]) => `
        <li><button class="row" data-nav="${p}" ${p === current ? 'aria-current="page"' : ""}>${n.title}</button></li>`).join("")}
      </ul>
    </section>`).join("") || `<div class="none">No notes match.</div>`;
}

function renderDoc(path) {
  current = path;
  const n = VAULT[path];
  const parts = path.split("/");
  $("#crumb").innerHTML = `memory <span>/</span> ${parts[0]} <span>/</span> <b>${parts[1]}</b>`;

  const bodyHtml = n.body.map((para) => para.startsWith("### ")
    ? `<h3>${para.slice(4)}</h3>`
    : `<p>${para.replace(WL, (_, target, label) => `<a class="wl" data-nav="${target}">${label}</a>`)}</p>`
  ).join("");

  const backs = mentions[path] ?? [];
  const marginHtml = `
    <aside class="margin" aria-label="Linked mentions">
      <div class="mhead">Mentioned in</div>
      ${backs.length ? backs.map((b) => `
        <button class="mnote" data-nav="${b.src}">
          <span class="src">${VAULT[b.src].title}</span>
          <span class="q">“${b.quote.length > 110 ? b.quote.slice(0, 110) + "…" : b.quote}”</span>
        </button>`).join("") : `<div class="mnone">Nothing links here yet.</div>`}
      <div class="mfoot">${n.meta}<br><button>provenance ›</button></div>
    </aside>`;

  const doc = $("#doc");
  doc.classList.remove("swap-in");
  doc.innerHTML = `
    <article class="prose">
      <h1>${n.title}</h1>
      <div class="dek">${n.dek}${n.records.length ? ` · ${n.records.length} record${n.records.length > 1 ? "s" : ""}` : ""}</div>
      ${bodyHtml}
      <div class="endnote">
        <span class="path">${path}</span>
        <button data-copy="${path}">copy</button>
        <span class="edit">&#8984;E to edit</span>
      </div>
    </article>
    ${marginHtml}`;
  void doc.offsetWidth;
  doc.classList.add("swap-in");
  renderNav($("#find").value);
  doc.closest(".doc-scroll").scrollTop = 0;
}

document.addEventListener("click", (e) => {
  const copy = e.target.closest("[data-copy]");
  if (copy) { navigator.clipboard?.writeText(copy.dataset.copy); return; }
  const nav = e.target.closest("[data-nav]");
  if (nav) renderDoc(nav.dataset.nav);
});
$("#find").addEventListener("input", (e) => renderNav(e.target.value));
$("#theme").addEventListener("click", () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "" : "dark";
});

renderDoc(current);
</script>
</body>
</html>

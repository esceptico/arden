services:
  arden-backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: arden-backend
    restart: unless-stopped
    ports:
      - "${ARDEN_PORT:-6877}:6877"
    volumes:
      - arden-data:/home/arden/.arden
    env_file: .env
    environment:
      # browser history doesn't work in docker
      - ARDEN_BROWSER=
    networks:
      - arden-network

volumes:
  arden-data:
    driver: local

networks:
  arden-network:
    driver: bridge

services:
  arden-backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARDEN_PORT:-6877}:6877"
    volumes:
      - arden-data:/home/arden/.arden
    env_file: .env
    environment:
      ARDEN_DIR: /home/arden/.arden

volumes:
  arden-data:

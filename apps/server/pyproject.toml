[project]
name = "arden"
version = "1.0.0-rc.3"
description = "Local-first personal AI assistant with persistent memory, automations, and extensible tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3,<4",
    "aiosqlite>=0.22.1,<1",
    "anthropic>=0.120.2,<1",
    "click>=8.4.2,<9",
    "coolname>=5.0.0,<6",
    "exa-py>=2.16.2,<3",
    "fastapi>=0.141.1,<1",
    "google-api-python-client>=2.198.0,<3",
    "google-auth>=2.56.2,<3",
    "google-auth-oauthlib>=1.4.0,<2",
    "google-genai>=2.15.0,<3",
    "httpx>=0.28.1,<1",
    "jinja2>=3.1.6,<4",
    "judgeval>=1.3.0,<2",
    "lxml>=6.1.1,<7",
    "markdown>=3.10.2,<4",
    "markdown-it-py>=4.2.0,<5",
    "mcp>=2.0.0,<3",
    "mcp-types>=2.0.0,<3",
    "numpy>=2.5.1,<3",
    "openai>=2.50.0,<3",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "python-dotenv>=1.2.2,<2",
    "pyyaml>=6.0.3,<7",
    "rich>=15.0.0,<16",
    "segno>=1.6.6,<2",
    "sqlite-vec>=0.1.9,<1",
    "structlog>=26.1.0,<27",
    "telegramify-markdown>=1.2.0,<2",
    "tenacity>=9.1.4,<10",
    "trafilatura>=2.1.0,<3",
    "uvicorn>=0.52.0,<1",
]

[project.urls]
Repository = "https://github.com/esceptico/ntrp"
Issues = "https://github.com/esceptico/ntrp/issues"

[project.scripts]
arden-server = "arden.cli:main"

[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["arden"]
exclude = ["**/.DS_Store"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"
"arden/llm/generated_models.json" = "arden/llm/generated_models.json"

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/scripts", "/.gitignore"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["skills/**/workflow.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (common in FastAPI)
    "B904",   # raise from - not always needed
    "B905",   # zip strict - pedantic
    "SIM102", # nested ifs - often clearer than combined
    "SIM103", # return condition directly - ternary can hurt readability
    "SIM105", # contextlib.suppress - try/except/pass is often clearer
    "SIM108", # ternary operator - explicit if/else is often clearer
    "RUF001", # en-dash lmao
    "RUF003", # Comment contains ambiguous poo poo -_-
    "RUF005", # list concat - [a] + [b] is fine
    "RUF006", # asyncio task reference - not always needed
    "RUF012", # ClassVar for mutable attrs - overkill for simple cases
    "RUF022", # unsorted __all__ - logical grouping > alphabetical
    "TC001",  # type-checking imports - overhead for small projects
    "UP046",  # Generic subclass - style preference
    "C401",   # unnecessary generator - micro-optimization
    "C414",   # unnecessary list in sorted - micro-optimization
    "E741",   # ambiguous variable name - single letter in comprehensions is fine
]

[tool.ruff.lint.isort]
known-first-party = ["arden"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
